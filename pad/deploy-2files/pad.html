ругим полосам."},{num:"9.9",text:"Запрещается движение транспортных средств по разделительным полосам и обочинам, тротуарам и пешеходным дорожкам (за исключением случаев, предусмотренных пунктами 12.1, 24.2 - 24.4, 24.7, 25.2 Правил), а также движение механических транспортных средств (кроме мопедов) по полосам для велосипедистов. Запрещается движение механических транспортных средств по велосипедным и велопешеходным дорожкам. Допускается движение машин дорожно-эксплуатационных и коммунальных служб, а также подъезд по кратчайшему пути транспортных средств, подвозящих грузы к торговым и другим предприятиям и объектам, расположенным непосредственно у обочин, тротуаров или пешеходных дорожек, при отсутствии других возможностей подъезда. При этом должна быть обеспечена безопасность движения."},{num:"9.10",text:"Водитель должен соблюдать такую дистанцию до движущегося впереди транспортного средства, которая позволила бы избежать столкновения, а также необходимый боковой интервал, обеспечивающий безопасность движения."},{num:"9.11",text:"Вне населенных пунктов на дорогах с двусторонним движением, имеющих две полосы, водитель транспортного средства, для которого установлено ограничение скорости, а также водитель транспортного средства (состава транспортных средств) длиной более 7 м должен поддерживать между своим и движущимся впереди транспортным средством такую дистанцию, чтобы обгоняющие его транспортные средства могли без помех перестроиться на ранее занимаемую ими полосу. Это требование не действует при движении по участкам дорог, на которых запрещается обгон, а также при интенсивном движении и движении в организованной транспортной колонне."},{num:"9.12",text:"На дорогах с двусторонним движением при отсутствии разделительной полосы островки направляющие, островки безопасности, тумбы и элементы дорожных сооружений (опоры мостов, путепроводов и тому подобное), находящиеся на середине проезжей части, водитель должен объезжать справа, если знаки и разметка не предписывают иное."}]},{num:10,title:"10. Скорость движения",entries:[{num:"10.1",text:"Водитель должен вести транспортное средство со скоростью, не превышающей установленного ограничения, учитывая при этом интенсивность движения, особенности и состояние транспортного средства и груза, дорожные и метеорологические условия, в частности видимость в направлении движения. Скорость должна обеспечивать водителю возможность постоянного контроля за движением транспортного средства для выполнения требований Правил.\n\nПри возникновении опасности для движения, которую водитель в состоянии обнаружить, он должен принять возможные меры к снижению скорости вплоть до остановки транспортного средства."},{num:"10.2",text:"В населенных пунктах разрешается движение транспортных средств со скоростью не более 60 км/ч, а в жилых зонах, велосипедных зонах и на дворовых территориях не более 20 км/ч.\n\nПримечание. По решению органов исполнительной власти субъектов Российской Федерации может разрешаться повышение скорости (с установкой соответствующих знаков) на участках дорог или полосах движения для отдельных видов транспортных средств, если дорожные условия обеспечивают безопасное движение с большей скоростью. В этом случае величина разрешенной скорости не должна превышать значения, установленные для соответствующих видов транспортных средств на автомагистралях."},{num:"10.3",text:"Вне населенных пунктов разрешается движение:\n\n• мотоциклам, легковым автомобилям и грузовым автомобилям с разрешенной максимальной массой не более 3,5 т на автомагистралях - со скоростью не более 110 км/ч, на остальных дорогах - не более 90 км/ч;\n• автобусам, в которых места для сидения пассажиров оборудованы ремнями безопасности, предназначенным для перевозки исключительно сидящих пассажиров, - не более 90 км/ч, другим автобусам - не более 70 км/ч;\n• легковым автомобилям при буксировке прицепа, грузовым автомобилям с разрешенной максимальной массой более 3,5 т на автомагистралях - не более 90 км/ч, на остальных дорогах - не более 70 км/ч;\n• грузовым автомобилям, перевозящим людей в кузове, - не более 60 км/ч;\n• автобусам, осуществляющим организованные перевозки групп детей, - не более 60 км/ч;\n\nПримечание. По решению собственников или владельцев автомобильных дорог может разрешаться повышение скорости на участках дорог для отдельных видов транспортных средств, если дорожные условия обеспечивают безопасное движение с большей скоростью. В этом случае величина разрешенной скорости не должна превышать значения 130 км/ч на дорогах, обозначенных знаком 5.1, и 110 км/ч на дорогах, обозначенных знаком 5.3."},{num:"10.4",text:"Транспортным средствам, буксирующим механические транспортные средства, разрешается движение со скоростью не более 50 км/ч.\n\nТяжеловесным транспортным средствам, крупногабаритным транспортным средствам и транспортным средствам, осуществляющим перевозки опасных грузов, разрешается движение со скоростью, не превышающей скорости, указанной в специальном разрешении, при наличии которого в соответствии с законодательством об автомобильных дорогах и о дорожной деятельности допускается движение по автомобильным дорогам таких транспортных средств."},{num:"10.5",text:'Водителю запрещается:\n\n• превышать максимальную скорость, определенную технической характеристикой транспортного средства;\n• превышать скорость, указанную на опознавательном знаке "Ограничение скорости", установленном на транспортном средстве;\n• создавать помехи другим транспортным средствам, двигаясь без необходимости со слишком малой скоростью;\n• резко тормозить, если это не требуется для предотвращения дорожно-транспортного происшествия.'}]},{num:11,title:"11. Обгон, опережение, встречный разъезд",entries:[{num:"11.1",text:"Прежде чем начать обгон, водитель обязан убедиться в том, что полоса движения, на которую он собирается выехать, свободна на достаточном для обгона расстоянии и в процессе обгона он не создаст опасности для движения и помех другим участникам дорожного движения."},{num:"11.2",text:"Водителю запрещается выполнять обгон в случаях, если:\n\n• транспортное средство, движущееся впереди, производит обгон или объезд препятствия;\n• транспортное средство, движущееся впереди по той же полосе, подало сигнал поворота налево;\n• следующее за ним транспортное средство начало обгон;\n• по завершении обгона он не сможет, не создавая опасности для движения и помех обгоняемому транспортному средству, вернуться на ранее занимаемую полосу."},{num:"11.3",text:"Водителю обгоняемого транспортного средства запрещается препятствовать обгону посредством повышения скорости движения или иными действиями."},{num:"11.4",text:"Обгон запрещен:\n\n• на регулируемых перекрестках, а также на нерегулируемых перекрестках при движении по дороге, не являющейся главной;\n• на пешеходных переходах;\n• на железнодорожных переездах и ближе чем за 100 метров перед ними;\n• на мостах, путепроводах, эстакадах и под ними, а также в тоннелях;\n• в конце подъема, на опасных поворотах и на других участках с ограниченной видимостью."},{num:"11.5",text:"Опережение транспортных средств при проезде пешеходных переходов осуществляется с учетом требований пункта 14.2 Правил."},{num:"11.6",text:"В случае если вне населенных пунктов обгон или опережение тихоходного транспортного средства, крупногабаритного транспортного средства или транспортного средства, двигающегося со скоростью, не превышающей 30 км/ч, затруднены, водитель такого транспортного средства должен принять как можно правее, а при необходимости остановиться, чтобы пропустить следующие за ним транспортные средства."},{num:"11.7",text:"В случае если встречный разъезд затруднен, водитель, на стороне которого имеется препятствие, должен уступить дорогу. Уступить дорогу при наличии препятствия на уклонах, обозначенных знаками 1.13 «Крутой спуск» и 1.14 «Крутой подъем», должен водитель транспортного средства, движущегося на спуск."}]},{num:12,title:"12. Остановка и стоянка",entries:[{num:"12.1",text:"Остановка и стоянка транспортных средств разрешаются на правой стороне дороги на обочине, а при ее отсутствии — на проезжей части у ее края и в случаях, установленных пунктом 12.2 Правил, — на тротуаре.\n\nНа левой стороне дороги остановка и стоянка разрешаются в населенных пунктах на дорогах с одной полосой движения для каждого направления без трамвайных путей посередине и на дорогах с односторонним движением (грузовым автомобилям с разрешенной максимальной массой более 3,5 т на левой стороне дорог с односторонним движением разрешается лишь остановка для загрузки или разгрузки)."},{num:"12.2",text:"Ставить транспортное средство разрешается в один ряд параллельно краю проезжей части. Двухколесные транспортные средства без бокового прицепа допускается ставить в два ряда.\n\nСпособ постановки транспортного средства на стоянке (парковке) определяется знаком 6.4 и линиями дорожной разметки, знаком 6.4 с одной из табличек 8.6.1-8.6.9 и линиями дорожной разметки или без таковых.\n\nСочетание знака 6.4 с одной из табличек 8.6.4-8.6.9, а также линиями дорожной разметки допускает постановку транспортного средства под углом к краю проезжей части в случае, если конфигурация (местное уширение) проезжей части допускает такое расположение.\n\nСтоянка на краю тротуара, граничащего с проезжей частью, разрешается только легковым автомобилям, мотоциклам и мопедам в местах, обозначенных знаком 6.4 с одной из табличек 8.6.2, 8.6.3 и 8.6.6-8.6.9."},{num:"12.3",text:"Стоянка с целью длительного отдыха, ночлега и тому подобное вне населенного пункта разрешается только на предусмотренных для этого площадках или за пределами дороги."},{num:"12.4",text:"Остановка запрещается:\n\n• на трамвайных путях, а также в непосредственной близости от них, если это создаст помехи движению трамваев;\n• на железнодорожных переездах, в тоннелях, а также на эстакадах, мостах, путепроводах (если для движения в данном направлении имеется менее трех полос) и под ними;\n• в местах, где расстояние между сплошной линией разметки (кроме обозначающей край проезжей части), разделительной полосой или противоположным краем проезжей части и остановившимся транспортным средством менее 3 м;\n• на пешеходных переходах и ближе 5 м перед ними;\n• на проезжей части вблизи опасных поворотов и выпуклых переломов продольного профиля дороги при видимости дороги менее 100 м хотя бы в одном направлении;\n• на пересечении проезжих частей и ближе 5 м от края пересекаемой проезжей части, за исключением стороны напротив бокового проезда трехсторонних пересечений (перекрестков), имеющих сплошную линию разметки или разделительную полосу;\n• ближе 15 метров от мест остановки маршрутных транспортных средств или стоянки легковых такси, обозначенных разметками 1.17.1 и 1.17.2, а при ее отсутствии - от указателя места остановки маршрутных транспортных средств или стоянки легковых такси (кроме остановки для посадки и высадки пассажиров, если это не создаст помех движению маршрутных транспортных средств или транспортных средств, используемых в качестве легкового такси);\n• в местах, где транспортное средство закроет от других водителей сигналы светофора, дорожные знаки, или сделает невозможным движение (въезд или выезд) других транспортных средств (в том числе на велосипедных или велопешеходных дорожках, а также ближе 5 м от пересечения велосипедной или велопешеходной дорожки с проезжей частью), или создаст помехи для движения пешеходов (в том числе в местах сопряжения проезжей части и тротуара в одном уровне, предназначенных для движения маломобильных граждан);\n• на полосе для велосипедистов;\n• на островках направляющих и островках безопасности"},{num:"12.5",text:"Стоянка запрещается:\n\n• в местах, где запрещена остановка;\n• вне населенных пунктов на проезжей части дорог, обозначенных знаком 2.1;\n• ближе 50 м от железнодорожных переездов."},{num:"12.6",text:"При вынужденной остановке в местах, где остановка запрещена, водитель должен принять все возможные меры для отвода транспортного средства из этих мест."},{num:"12.7",text:"Запрещается открывать двери транспортного средства, если это создаст помехи другим участникам дорожного движения."},{num:"12.8",text:"Водитель может покидать свое место или оставлять транспортное средство, если им приняты необходимые меры, исключающие самопроизвольное движение транспортного средства или использование его в отсутствие водителя.\n\nЗапрещается оставлять в транспортном средстве на время его стоянки ребенка в возрасте младше 7 лет в отсутствие совершеннолетнего лица."}]},{num:13,title:"13. Проезд перекрестков",entries:[{num:"13.1",text:"При повороте направо или налево водитель обязан уступить дорогу пешеходам, лицам, использующим для передвижения средства индивидуальной мобильности, и велосипедистам, пересекающим проезжую часть дороги, на которую он поворачивает."},{num:"13.2",text:"Запрещается выезжать на перекресток, пересечение проезжих частей или участка перекрестка, обозначенного разметкой 1.26, если впереди по пути следования образовался затор, который вынудит водителя остановиться, создав препятствие для движения транспортных средств в поперечном направлении, за исключением поворота направо или налево в случаях, установленных настоящими Правилами."},{num:"13.3",text:"Перекресток, где очередность движения определяется сигналами светофора или регулировщика, считается регулируемым.\n\nПри желтом мигающем сигнале, неработающих светофорах или отсутствии регулировщика перекресток считается нерегулируемым, и водители обязаны руководствоваться правилами проезда нерегулируемых перекрестков и установленными на перекрестке знаками приоритета."},{group:"Регулируемые перекрестки"},{num:"13.4",text:"При повороте налево или развороте по зеленому сигналу светофора водитель безрельсового транспортного средства обязан уступить дорогу транспортным средствам, движущимся со встречного направления прямо или направо. Таким же правилом должны руководствоваться между собой водители трамваев."},{num:"13.5",text:"При движении в направлении стрелки, включенной в дополнительной секции одновременно с желтым или красным сигналом светофора, водитель обязан уступить дорогу транспортным средствам, движущимся с других направлений."},{num:"13.6",text:"Если сигналы светофора или регулировщика разрешают движение одновременно трамваю и безрельсовым транспортным средствам, то трамвай имеет преимущество независимо от направления его движения. Однако при движении в направлении стрелки, включенной в дополнительной секции одновременно с красным или желтым сигналом светофора, трамвай должен уступить дорогу транспортным средствам, движущимся с других направлений."},{num:"13.7",text:"Водитель, въехавший на перекресток при разрешающем сигнале светофора, должен выехать в намеченном направлении независимо от сигналов светофора на выходе с перекрестка. Однако, если на перекрестке перед светофорами, расположенными на пути следования водителя, имеются стоп-линии (знаки 6.16) водитель обязан руководствоваться сигналами каждого светофора."},{num:"13.8",text:"При включении разрешающего сигнала светофора водитель обязан уступить дорогу транспортным средствам, завершающим движение через перекресток, и пешеходам, не закончившим переход проезжей части данного направления."},{group:"Нерегулируемые перекрестки"},{num:"13.9",text:"На перекрестке неравнозначных дорог водитель транспортного средства, движущегося по второстепенной дороге, должен уступить дорогу транспортным средствам, приближающимся по главной, независимо от направления их дальнейшего движения.\n\nНа таких перекрестках трамвай имеет преимущество перед безрельсовыми транспортными средствами, движущимися в попутном или встречном направлении по равнозначной дороге, независимо от направления его движения."},{num:"13.10",text:"В случае, когда главная дорога на перекрестке меняет направление, водители, движущиеся по главной дороге, должны руководствоваться между собой правилами проезда перекрестков равнозначных дорог. Этими же правилами должны руководствоваться водители, движущиеся по второстепенным дорогам."},{num:"13.11",text:"На перекрестке равнозначных дорог, за исключением случая, предусмотренного пунктом 13.11(1) Правил, водитель безрельсового транспортного средства обязан уступить дорогу транспортным средствам, приближающимся справа. Этим же правилом должны руководствоваться между собой водители трамваев.\n\nНа таких перекрестках трамвай имеет преимущество перед безрельсовыми транспортными средствами независимо от направления его движения.\n\n13.11(1) При въезде по дороге, не являющейся главной, на перекресток, на котором организовано круговое движение и который обозначен знаком 4.3, водитель транспортного средства обязан уступить дорогу транспортным средствам, движущимся по такому перекрестку."},{num:"13.12",text:"При повороте налево или развороте водитель безрельсового транспортного средства обязан уступить дорогу транспортным средствам, движущимся по равнозначной дороге со встречного направления прямо или направо. Этим же правилом должны руководствоваться между собой водители трамваев."},{num:"13.13",text:"Если водитель не может определить наличие покрытия на дороге (темное время суток, грязь, снег и тому подобное), а знаков приоритета нет, он должен считать, что находится на второстепенной дороге."}]},{num:14,title:"14. Пешеходные переходы и места остановок маршрутных транспортных средств",entries:[{num:"14.1",text:"Водитель транспортного средства, приближающегося к нерегулируемому пешеходному переходу , обязан уступить дорогу пешеходам, переходящим дорогу или вступившим на проезжую часть (трамвайные пути) для осуществления перехода."},{num:"14.2",text:"Если перед нерегулируемым пешеходным переходом остановилось или снизило скорость транспортное средство, то водители других транспортных средств, движущихся в том же направлении, также обязаны остановиться или снизить скорость. Продолжать движение разрешено с учетом требований пункта 14.1 Правил."},{num:"14.3",text:"На регулируемых пешеходных переходах при включении разрешающего сигнала светофора водитель должен дать возможность пешеходам и лицам, использующим для передвижения средства индивидуальной мобильности, закончить пересечение проезжей части (трамвайных путей) соответствующего направления."},{num:"14.4",text:"Запрещается въезжать на пешеходный переход, если за ним образовался затор, который вынудит водителя остановиться на пешеходном переходе."},{num:"14.5",text:"Во всех случаях, в том числе и вне пешеходных переходов, водитель обязан пропустить слепых пешеходов, подающих сигнал белой тростью."},{num:"14.6",text:'Водитель должен уступить дорогу пешеходам, идущим к стоящему в месте остановки маршрутному транспортному средству или от него (со стороны дверей), если посадка и высадка производятся с проезжей части или с посадочной площадки, расположенной на ней.\n\nВ случае если на таком стоящем маршрутном транспортном средстве включено световое табло "Внимание, пассажир!", водитель, приближающийся сзади, должен остановиться перед разметкой 1.17.2, а при ее отсутствии - перед маршрутным транспортным средством, не создавая помех пешеходам, осуществляющим посадку и высадку с проезжей части или с посадочной площадки, расположенной на ней. Начинать движение разрешается только при отсутствии пешеходов на проезжей части и после выключения светового табло "Внимание, пассажир!".'},{num:"14.7",text:"Приближаясь к остановившемуся транспортному средству с включенной аварийной сигнализацией, имеющему опознавательные знаки «Перевозка детей», водитель должен снизить скорость, при необходимости остановиться и пропустить детей."}]},{num:15,title:"15. Движение через железнодорожные пути",entries:[{num:"15.1",text:"Водители транспортных средств могут пересекать железнодорожные пути только по железнодорожным переездам, уступая дорогу поезду (локомотиву, дрезине)."},{num:"15.2",text:"При подъезде к железнодорожному переезду водитель обязан руководствоваться требованиями дорожных знаков, светофоров, разметки, положением шлагбаума и указаниями дежурного по переезду и убедиться в отсутствии приближающегося поезда (локомотива, дрезины)."},{num:"15.3",text:"Запрещается выезжать на переезд:\n\n• при закрытом или начинающем закрываться шлагбауме (независимо от сигнала светофора);\n• при запрещающем сигнале светофора (независимо от положения и наличия шлагбаума);\n• при запрещающем сигнале дежурного по переезду (дежурный обращен к водителю грудью или спиной с поднятым над головой жезлом, красным фонарем или флажком, либо с вытянутыми в сторону руками);\n• если за переездом образовался затор, который вынудит водителя остановиться на переезде;\n• если к переезду в пределах видимости приближается поезд (локомотив, дрезина).\n\nКроме того, запрещается:\n\n• объезжать с выездом на полосу встречного движения стоящие перед переездом транспортные средства;\n• самовольно открывать шлагбаум;\n• провозить через переезд в нетранспортном положении сельскохозяйственные, дорожные, строительные и другие машины и механизмы;\n• без разрешения начальника дистанции пути железной дороги движение тихоходных машин, скорость которых менее 8 км/ч, а также тракторных саней-волокуш."},{num:"15.4",text:"В случаях когда движение через переезд запрещено, водитель должен остановиться у стоп-линии и (или) знака 6.16, знака 2.5, если их нет - не ближе 5 м от светофора или шлагбаума, а при отсутствии светофора или шлагбаума - не ближе 10 м до ближайшего рельса."},{num:"15.5",text:"При вынужденной остановке на переезде водитель должен немедленно высадить людей и принять меры для освобождения переезда. Одновременно водитель должен:\n\n• при имеющейся возможности послать двух человек вдоль путей в обе стороны от переезда на 1000 м (если одного, то в сторону худшей видимости пути), объяснив им правила подачи сигнала остановки машинисту приближающегося поезда;\n• оставаться возле транспортного средства и подавать сигналы общей тревоги;\n• при появлении поезда бежать ему навстречу, подавая сигнал остановки.\n\nПримечание. Сигналом остановки служит круговое движение руки (днем с лоскутом яркой материи или каким-либо хорошо видимым предметом, ночью - с факелом или фонарем). Сигналом общей тревоги служат серии из одного длинного и трех коротких звуковых сигналов."}]},{num:16,title:"16. Движение по автомагистралям",entries:[{num:"16.1",text:"На автомагистралях запрещается:\n\n• движение пешеходов, лиц, использующих для передвижения средства индивидуальной мобильности, домашних животных, велосипедов, мопедов, тракторов и самоходных машин, иных транспортных средств, скорость которых по технической характеристике или их состоянию менее 40 км/ч;\n• движение грузовых автомобилей с разрешенной максимальной массой более 3,5 т далее второй полосы;\n• остановка вне специальных площадок для стоянки, обозначенных знаком 6.4 или 7.11;\n• разворот и въезд в технологические разрывы разделительной полосы;\n• движение задним ходом."},{num:"16.2",text:"При вынужденной остановке на проезжей части водитель должен обозначить транспортное средство в соответствии с требованиями раздела 7 Правил и принять меры для того, чтобы вывести его на предназначенную для этого полосу (правее линии, обозначающей край проезжей части)."},{num:"16.3",text:"Требования данного раздела распространяются также на дороги, обозначенные знаком 5.3."}]},{num:17,title:"17. Движение в жилых зонах",entries:[{num:"17.1",text:"В жилой зоне, то есть на территории, въезды на которую и выезды с которой обозначены знаками 5.21 и 5.22, движение пешеходов разрешается как по тротуарам, так и по проезжей части. В жилой зоне пешеходы имеют преимущество, при этом они не должны создавать на проезжей части необоснованные помехи для движения транспортных средств и лиц, использующих для передвижения средства индивидуальной мобильности."},{num:"17.2",text:"В жилой зоне запрещаются сквозное движение механических транспортных средств, учебная езда, стоянка с работающим двигателем, а также стоянка грузовых автомобилей с разрешенной максимальной массой более 3,5 т и автобусов вне специально выделенных и обозначенных знаками и (или) разметкой мест."},{num:"17.3",text:"При выезде из жилой зоны водители и лица, использующие для передвижения средства индивидуальной мобильности, должны уступить дорогу другим участникам дорожного движения."},{num:"17.4",text:"Требования данного раздела распространяются также и на дворовые территории."}]},{num:18,title:"18. Приоритет маршрутных транспортных средств",entries:[{num:"18.1",text:"Вне перекрестков, где трамвайные пути пересекают проезжую часть, трамвай имеет преимущество перед безрельсовыми транспортными средствами, кроме случаев выезда из депо."},{num:"18.2",text:"На дорогах с полосой для маршрутных транспортных средств, обозначенных знаками 5.11.1, 5.13.1, 5.13.2, 5.14.1, запрещаются движение и остановка других транспортных средств на этой полосе, за исключением:\n\n• школьных автобусов;\n• транспортных средств, используемых в качестве легкового такси;\n• транспортных средств, которые используются для перевозки пассажиров, имеют, за исключением места водителя, более 8 мест для сидения, технически допустимая максимальная масса которых превышает 5 тонн, перечень которых утверждается органами исполнительной власти субъектов Российской Федерации - гг. Москвы, Санкт-Петербурга и Севастополя.\n\nНа полосах для маршрутных транспортных средств разрешено движение велосипедистов в случае, если такая полоса располагается справа.\n\nВодители транспортных средств, допущенных к движению по полосам для маршрутных транспортных средств, при въезде на перекресток с такой полосы могут отступать от требований дорожных знаков 4.1.1 — 4.1.6, 5.15.1 и 5.15.2 для продолжения движения по такой полосе.\n\nЕсли эта полоса отделена от остальной проезжей части прерывистой линией разметки, то при поворотах транспортные средства должны перестраиваться на нее. Разрешается также в таких местах заезжать на эту полосу при въезде на дорогу и для посадки и высадки пассажиров у правого края проезжей части при условии, что это не создает помех маршрутным транспортным средствам."},{num:"18.3",text:"В населенных пунктах водители должны уступать дорогу троллейбусам и автобусам, начинающим движение от обозначенного места остановки. Водители троллейбусов и автобусов могут начинать движение только после того, как убедятся, что им уступают дорогу."}]},{num:19,title:"19. Пользование внешними световыми приборами и звуковыми сигналами",entries:[{num:"19.1",text:"В темное время суток и в условиях недостаточной видимости независимо от освещения дороги, а также в тоннелях на движущемся транспортном средстве должны быть включены следующие световые приборы:\n\n• на всех механических транспортных средствах - фары дальнего или ближнего света, на велосипедах и средствах индивидуальной мобильности - фары или фонари, на гужевых повозках - фонари (при их наличии);\n• на прицепах и буксируемых механических транспортных средствах - габаритные огни."},{num:"19.2",text:"Дальний свет должен быть переключен на ближний:\n\n• в населенных пунктах, если дорога освещена;\n• при встречном разъезде на расстоянии не менее чем за 150 м до транспортного средства, а также и при большем, если водитель встречного транспортного средства периодическим переключением света фар покажет необходимость этого;\n• в любых других случаях для исключения возможности ослепления водителей как встречных, так и попутных транспортных средств.\n\nПри ослеплении водитель должен включить аварийную сигнализацию и, не меняя полосу движения, снизить скорость и остановиться."},{num:"19.3",text:"При остановке и стоянке в темное время суток на неосвещенных участках дорог, а также в условиях недостаточной видимости на транспортном средстве должны быть включены габаритные огни. В условиях недостаточной видимости дополнительно к габаритным огням могут быть включены фары ближнего света, противотуманные фары и задние противотуманные фонари."},{num:"19.4",text:"Противотуманные фары могут использоваться:\n\n• в условиях недостаточной видимости с ближним или дальним светом фар;\n• в темное время суток на неосвещенных участках дорог совместно с ближним или дальним светом фар;\n• вместо ближнего света фар в соответствии с пунктом 19.5 Правил."},{num:"19.5",text:"В светлое время суток на всех движущихся транспортных средствах (кроме велосипедов) с целью их обозначения должны включаться фары ближнего света или дневные ходовые огни."},{num:"19.6",text:"Фарой-прожектором и фарой-искателем разрешается пользоваться только вне населенных пунктов при отсутствии встречных транспортных средств. В населенных пунктах пользоваться такими фарами могут только водители транспортных средств, оборудованных в установленном порядке проблесковыми маячками синего цвета и специальными звуковыми сигналами, при выполнении неотложного служебного задания."},{num:"19.7",text:"Задние противотуманные фонари могут применяться только в условиях недостаточной видимости. Запрещается подключать задние противотуманные фонари к стоп-сигналам."},{num:"19.10",text:"Звуковые сигналы могут применяться только:\n\n• для предупреждения других водителей о намерении произвести обгон вне населенных пунктов;\n• в случаях, когда это необходимо для предотвращения дорожно-транспортного происшествия."},{num:"19.11",text:"Для предупреждения об обгоне вместо звукового сигнала или совместно с ним может подаваться световой сигнал, представляющий собой кратковременное переключение фар с ближнего на дальний свет."}]},{num:20,title:"20. Буксировка механических транспортных средств",entries:[{num:"20.1",text:"Буксировка на жесткой или гибкой сцепке должна осуществляться только при наличии водителя за рулем буксируемого транспортного средства, кроме случаев, когда конструкция жесткой сцепки обеспечивает при прямолинейном движении следование буксируемого транспортного средства по траектории буксирующего."},{num:"20.2",text:"При буксировке на гибкой или жесткой сцепке запрещается перевозка людей в буксируемом автобусе, троллейбусе и в кузове буксируемого грузового автомобиля, а при буксировке путем частичной погрузки — нахождение людей в кабине или кузове буксируемого транспортного средства, а также в кузове буксирующего.\n\n20.2(1). При буксировке управление буксирующими транспортными средствами должно осуществляться водителями, имеющими право на управление транспортными средствами в течение 2 и более лет."},{num:"20.3",text:"При буксировке на гибкой сцепке должно быть обеспечено расстояние между буксирующим и буксируемым транспортными средствами в пределах 4 — 6 м, а при буксировке на жесткой сцепке — не более 4 м.\n\nГибкое связующее звено должно быть обозначено в соответствии с пунктом 9 Основных положений."},{num:"20.4",text:"Буксировка запрещается:\n\n• транспортных средств, у которых не действует рулевое управление (допускается буксировка методом частичной погрузки);\n• двух и более транспортных средств;\n• транспортных средств с недействующей тормозной системой , если их фактическая масса более половины фактической массы буксирующего транспортного средства. При меньшей фактической массе буксировка таких транспортных средств допускается только на жесткой сцепке или методом частичной погрузки;\n• двухколёсными мотоциклами без бокового прицепа, а также таких мотоциклов;\n• в гололедицу на гибкой сцепке."}]},{num:21,title:"21. Учебная езда",entries:[{num:"21.1",text:"Обучение первоначальным навыкам управления транспортным средством должно проводиться на закрытых площадках или автодромах."},{num:"21.2",text:"Учебная езда на дорогах допускается только с обучающим вождению."},{num:"21.3",text:"При обучении управлению транспортным средством на дорогах обучающий вождению должен находиться на сиденье, с которого осуществляется доступ к дублирующим органам управления этим транспортным средством, иметь при себе документ на право обучения управлению транспортным средством данной категории или подкатегории, а также водительское удостоверение на право управления транспортным средством соответствующей категории или подкатегории."},{num:"21.4",text:'К учебной езде на дорогах допускаются обучающиеся вождению, достигшие возраста:\n\n• 16 лет - при обучении управлению транспортным средством категорий "В", "С" или подкатегории "С1";\n• 20 лет - при обучении управлению транспортным средством категорий "D", "Tb", "Tm" или подкатегории "D1" (18 лет - для лиц, указанных в пункте 4 статьи 26 Федерального закона "О безопасности дорожного движения", - при обучении управлению транспортным средством категории "D" или подкатегории "D1").'},{num:"21.5",text:"Механическое транспортное средство, на котором проводится обучение, должно быть оборудовано в соответствии с пунктом 5 Основных положений и иметь опознавательные знаки «Учебное транспортное средство»."},{num:"21.6",text:"Запрещается учебная езда на дорогах, перечень которых объявляется в установленном порядке."}]},{num:22,title:"22. Перевозка людей",entries:[{num:"22.1",text:'Перевозка людей в кузове грузового автомобиля должна осуществляться водителями, имеющими водительское удостоверение на право управления транспортным средством категории "C" или подкатегории "C1" в течение 3 и более лет.\n\nВ случае перевозки людей в кузове грузового автомобиля в количестве более 8, но не более 16 человек, включая пассажиров в кабине, требуется также наличие в водительском удостоверении разрешающей отметки, подтверждающей наличие права управления транспортным средством категории "D" или подкатегории "D1", в случае перевозки более 16 человек, включая пассажиров в кабине, - категории "D".\n\nПримечание. Допуск военных водителей к перевозке людей на грузовых автомобилях осуществляется в установленном порядке.'},{num:"22.2",text:'Перевозка людей в кузове грузового автомобиля с бортовой платформой разрешается, если он оборудован в соответствии с Основными положениями, при этом перевозка детей не допускается.\n\n22.2(1). Перевозка людей на мотоцикле должна осуществляться водителем, имеющим водительское удостоверение на право управления транспортными средствами категории "A" или подкатегории "A1" в течение 2 и более лет, перевозка людей на мопеде должна осуществляться водителем, имеющим водительское удостоверение на право управления транспортными средствами любой категории или подкатегории в течение 2 и более лет.'},{num:"22.3",text:"Число перевозимых людей в кузове грузового автомобиля, а также салоне автобуса, осуществляющего перевозку на междугородном, горном, туристическом или экскурсионном маршруте, и при организованной перевозке группы детей не должно превышать количества оборудованных для сидения мест."},{num:"22.4",text:"Перед поездкой водитель грузового автомобиля должен проинструктировать пассажиров о порядке посадки, высадки и размещения в кузове.\n\nНачинать движение можно только убедившись, что условия безопасной перевозки пассажиров обеспечены."},{num:"22.5",text:"Проезд в кузове грузового автомобиля с бортовой платформой, не оборудованной для перевозки людей, разрешается только лицам, сопровождающим груз или следующим за его получением, при условии, что они обеспечены местом для сидения, расположенным ниже уровня бортов."},{num:"22.6",text:"Организованная перевозка группы детей должна осуществляться в соответствии с настоящими Правилами, а также правилами, утверждаемыми Правительством Российской Федерации, в автобусе, обозначенном опознавательными знаками «Перевозка детей»."},{num:"22.7",text:"Водитель обязан осуществлять посадку и высадку пассажиров только после полной остановки транспортного средства, а начинать движение только с закрытыми дверями и не открывать их до полной остановки."},{num:"22.8",text:"Запрещается перевозить людей:\n\n• вне кабины автомобиля (кроме случаев перевозки людей в кузове грузового автомобиля с бортовой платформой или в кузове-фургоне), трактора, других самоходных машин, на грузовом прицепе, в прицепе-даче, в кузове грузового мотоцикла и вне предусмотренных конструкцией мотоцикла мест для сидения;\n• сверх количества, предусмотренного технической характеристикой транспортного средства."},{num:"22.9",text:"Перевозка детей в возрасте младше 7 лет в легковом автомобиле и кабине грузового автомобиля, конструкцией которых предусмотрены ремни безопасности либо ремни безопасности и детская удерживающая система ISOFIX , должна осуществляться с использованием детских удерживающих систем (устройств), соответствующих весу и росту ребенка.\n\nПеревозка детей в возрасте от 7 до 11 лет (включительно) в легковом автомобиле и кабине грузового автомобиля, конструкцией которых предусмотрены ремни безопасности либо ремни безопасности и детская удерживающая система ISOFIX, должна осуществляться с использованием детских удерживающих систем (устройств), соответствующих весу и росту ребенка, или с использованием ремней безопасности, а на переднем сиденье легкового автомобиля - только с использованием детских удерживающих систем (устройств), соответствующих весу и росту ребенка.\n\nУстановка в легковом автомобиле и кабине грузового автомобиля детских удерживающих систем (устройств) и размещение в них детей должны осуществляться в соответствии с руководством по эксплуатации указанных систем (устройств).\n\nЗапрещается перевозить детей в возрасте младше 12 лет на заднем сиденье мотоцикла."}]},{num:23,title:"23. Перевозка грузов",entries:[{num:"23.1",text:"Масса перевозимого груза и распределение нагрузки по осям не должны превышать величин, установленных предприятием — изготовителем для данного транспортного средства."},{num:"23.2",text:"Перед началом и во время движения водитель обязан контролировать размещение, крепление и состояние груза во избежание его падения, создания помех для движения."},{num:"23.3",text:"Перевозка груза допускается при условии, что он:\n\n• не ограничивает водителю обзор;\n• не затрудняет управление и не нарушает устойчивость транспортного средства;\n• не закрывает внешние световые приборы и световозвращатели, регистрационные и опознавательные знаки, а также не препятствует восприятию сигналов, подаваемых рукой;\n• не создает шум, не пылит, не загрязняет дорогу и окружающую среду.\n\nЕсли состояние и размещение груза не удовлетворяют указанным требованиям, водитель обязан принять меры к устранению нарушений перечисленных правил перевозки либо прекратить дальнейшее движение."},{num:"23.4",text:"Груз, выступающий за габариты транспортного средства спереди и сзади более чем на 1 м или сбоку более чем на 0,4 м от внешнего края габаритного огня, должен быть обозначен опознавательными знаками «Крупногабаритный груз» а в темное время суток и в условиях недостаточной видимости, кроме того, спереди — фонарем или световозвращателем белого цвета, сзади — фонарем или световозвращателем красного цвета."},{num:"23.5",text:'Движение тяжеловесного и (или) крупногабаритного транспортного средства, а также транспортного средства, осуществляющего перевозки опасных грузов, осуществляется с учетом требований Федерального закона "Об автомобильных дорогах и о дорожной деятельности в Российской Федерации и о внесении изменений в отдельные законодательные акты Российской Федерации".\n\nМеждународные автомобильные перевозки осуществляются в соответствии с требованиями к транспортным средствам и правилами перевозки, установленными международными договорами Российской Федерации.'}]},{num:24,title:"24. Дополнительные требования к движению велосипедистов, водителей мопедов и лиц, использующих для передвижения средства индивидуальной мобильности",entries:[{num:"24.1",text:"Движение велосипедистов в возрасте старше 14 лет и лиц, использующих для передвижения средства индивидуальной мобильности, в возрасте старше 14 лет должно осуществляться по велосипедной, велопешеходной дорожкам, проезжей части велосипедной зоны или полосе для велосипедистов."},{num:"24.2",text:"Допускается движение велосипедистов в возрасте старше 14 лет:\n\n• по правому краю проезжей части - в следующих случаях:\n отсутствуют велосипедная и велопешеходная дорожки, полоса для велосипедистов либо отсутствует возможность двигаться по ним;\n• габаритная ширина велосипеда, прицепа к нему либо перевозимого груза превышает 1 м;\n• движение велосипедистов осуществляется в колоннах;\n\n• отсутствуют велосипедная и велопешеходная дорожки, полоса для велосипедистов либо отсутствует возможность двигаться по ним, а также по правому краю проезжей части или обочине;\n• велосипедист сопровождает велосипедиста в возрасте до 14 лет либо перевозит ребенка в возрасте до 7 лет на дополнительном сиденье, в велоколяске или в прицепе, предназначенном для эксплуатации с велосипедом.\n\n24.2(1) Допускается движение лиц в возрасте старше 14 лет, использующих для передвижения средства индивидуальной мобильности:\n\nв пешеходной зоне - в случае, если масса средства индивидуальной мобильности не превышает 35 кг;\n\nпо тротуару, пешеходной дорожке - в случае, если масса средства индивидуальной мобильности не превышает 35 кг, и при соблюдении одного из следующих условий:\n\n• отсутствуют велосипедная и велопешеходная дорожки, полоса для велосипедистов либо отсутствует возможность двигаться по ним;\n• лицо, использующее для передвижения средство индивидуальной мобильности, сопровождает ребенка в возрасте до 14 лет, использующего для передвижения средство индивидуальной мобильности, или велосипедиста в возрасте до 14 лет;\n\nпо обочине - в случае, если отсутствуют велосипедная и велопешеходная дорожки, полоса для велосипедистов, тротуар, пешеходная дорожка либо отсутствует возможность двигаться по ним;\n\nпо правому краю проезжей части дороги при соблюдении одновременно следующих условий:\n\n• отсутствуют велосипедная и велопешеходная дорожки, полоса для велосипедистов, тротуар, пешеходная дорожка, обочина либо отсутствует возможность двигаться по ним;\n• на дороге разрешено движение транспортных средств со скоростью не более 60 км/ч, а также движение велосипедов;\n• средство индивидуальной мобильности оборудовано тормозной системой, звуковым сигналом, световозвращателями белого цвета спереди, оранжевого или красного цвета с боковых сторон, красного цвета сзади, фарой (фонарем) белого цвета спереди."},{num:"24.3",text:"Движение велосипедистов в возрасте от 7 до 14 лет и лиц, использующих для передвижения средства индивидуальной мобильности, в возрасте от 7 до 14 лет должно осуществляться только по тротуарам, пешеходным, велосипедным и велопешеходным дорожкам, а также в пределах пешеходных зон."},{num:"24.4",text:"Движение велосипедистов в возрасте младше 7 лет, а также детей в возрасте младше 7 лет, использующих для передвижения средство индивидуальной мобильности, должно осуществляться только по тротуарам, пешеходным и велопешеходным дорожкам (на стороне для движения пешеходов), а также в пределах пешеходных зон.\n\nДвижение детей в возрасте младше 7 лет, использующих для передвижения средства индивидуальной мобильности, должно осуществляться только в сопровождении взрослых."},{num:"24.5",text:"Движение велосипедистов и лиц, использующих для передвижения средства индивидуальной мобильности, по правому краю проезжей части в случаях, предусмотренных настоящими Правилами, должно осуществляться только в один ряд. При этом лицам, использующим для передвижения средства индивидуальной мобильности, запрещаются обгон или объезд с левой стороны транспортного средства.\n\nДопускается движение колонны велосипедистов в два ряда в случае, если габаритная ширина велосипедов не превышает 0,75 м.\n\nКолонна велосипедистов должна быть разделена на группы по 10 велосипедистов в случае однорядного движения либо на группы по 10 пар в случае двухрядного движения. Для облегчения обгона расстояние между группами должно составлять 80 - 100 м."},{num:"24.6",text:"Движение лиц, использующих для передвижения средства индивидуальной мобильности, разрешается со скоростью не более 25 км/ч.\n\nЕсли движение велосипедиста или лица, использующего для передвижения средство индивидуальной мобильности, в случаях, предусмотренных настоящими Правилами, по тротуару, пешеходной дорожке, обочине или в пределах пешеходных зон (включая велосипедные дорожки, находящиеся в пешеходных зонах) подвергает опасности или создает помехи для движения пешеходов, велосипедист должен спешиться и руководствоваться требованиями, предусмотренными настоящими Правилами для движения пешеходов, а лицо, использующее для передвижения средство индивидуальной мобильности, спешиться или снизить скорость до скорости, не превышающей скорость движения пешеходов.\n\nВо всех случаях совмещенного с пешеходами движения велосипедистов и лиц, использующих для передвижения средства индивидуальной мобильности, пешеходы имеют приоритет.\n\n24.6.1. При пересечении проезжей части вне перекрестка велосипедистом или лицом, использующим для передвижения средство индивидуальной мобильности, указанные лица обязаны уступить дорогу другим участникам дорожного движения, движущимся по ней."},{num:"24.7",text:"Водители мопедов должны двигаться по правому краю проезжей части в один ряд либо по полосе для велосипедистов.\n\nДопускается движение водителей мопедов по обочине, если это не создает помех пешеходам."},{num:"24.8",text:"Велосипедистам, лицам, использующим для передвижения средства индивидуальной мобильности, и водителям мопедов запрещается:\n\n• управлять велосипедом, мопедом и средством индивидуальной мобильности (при наличии руля), не держась за руль хотя бы одной рукой;\n• перевозить груз, который выступает более чем на 0,5 м по длине или ширине за габариты, или груз, мешающий управлению;\n• перевозить пассажиров, если это не предусмотрено оборудованием или конструкцией велосипеда или средства индивидуальной мобильности;\n• перевозить детей до 7 лет при отсутствии специально оборудованных для них мест;\n• поворачивать налево или разворачиваться на дорогах с трамвайным движением и на дорогах, имеющих более одной полосы для движения в данном направлении (кроме случаев, когда из правой полосы разрешен поворот налево, и за исключением дорог, находящихся в велосипедных зонах);\n• двигаться по дороге без застегнутого мотошлема (для водителей мопедов);\n• пересекать дорогу по пешеходным переходам."},{num:"24.9",text:"Запрещается буксировка велосипедов, средств индивидуальной мобильности и мопедов, а также буксировка велосипедами, средствами индивидуальной мобильности и мопедами, кроме буксировки велосипедом, мопедом или средством индивидуальной мобильности прицепа, предназначенного для эксплуатации с велосипедом, мопедом или средством индивидуальной мобильности соответственно."},{num:"24.10",text:"При движении в темное время суток или в условиях недостаточной видимости велосипедистам, лицам, использующим для передвижения средства индивидуальной мобильности, и водителям мопедов рекомендуется, а вне населенных пунктов указанные лица обязаны иметь при себе предметы со световозвращающими элементами и обеспечивать видимость этих предметов водителями других транспортных средств."},{num:"24.11",text:"В велосипедной зоне:\n\n• велосипедисты и лица, использующие для передвижения средства индивидуальной мобильности, имеют преимущество перед механическими транспортными средствами, а также могут двигаться по всей ширине проезжей части, предназначенной для движения в данном направлении, при соблюдении требований пунктов 9.1(1) - 9.3 и 9.6 - 9.12 настоящих Правил;\n• пешеходам разрешается переходить проезжую часть в любом месте при условии соблюдения требований пунктов 4.4 - 4.7 настоящих Правил."}]},{num:25,title:"25. Дополнительные требования к движению гужевых повозок, а также к прогону животных",entries:[{num:"25.1",text:"Управлять гужевой повозкой (санями), быть погонщиком вьючных, верховых животных или стада при движении по дорогам разрешается лицам не моложе 14 лет."},{num:"25.2",text:"Гужевые повозки (сани), верховые и вьючные животные должны двигаться только в один ряд возможно правее. Допускается движение по обочине, если это не создает помех пешеходам.\n\nКолонны гужевых повозок (саней), верховых и вьючных животных при движении по проезжей части должны быть разделены на группы по 10 верховых и вьючных животных и по 5 повозок (саней). Для облегчения обгона расстояние между группами должно составлять 80 - 100 м."},{num:"25.3",text:"Водитель гужевой повозки (саней) при выезде на дорогу с прилегающей территории или со второстепенной дороги в местах с ограниченной обзорностью должен вести животное под уздцы."},{num:"25.4",text:"Животных по дороге следует перегонять, как правило, в светлое время суток. Погонщики должны направлять животных как можно ближе к правому краю дороги."},{num:"25.5",text:"При прогоне животных через железнодорожные пути стадо должно быть разделено на группы такой численности, чтобы с учетом количества погонщиков был обеспечен безопасный прогон каждой группы."},{num:"25.6",text:"Водителям гужевых повозок (саней), погонщикам вьючных, верховых животных и скота запрещается:\n\n• оставлять на дороге животных без надзора;\n• прогонять животных через железнодорожные пути и дороги вне специально отведенных мест, а также в темное время суток и в условиях недостаточной видимости (кроме скотопрогонов на разных уровнях);\n• вести животных по дороге с асфальто- и цементобетонным покрытием при наличии иных путей."}]},{num:26,title:"26. Нормы времени управления транспортным средством и отдыха",entries:[{num:"26.1",text:"Не позднее 4 часов 30 минут времени управления с момента завершения предшествующего отдыха или с момента завершения перерыва для отдыха водитель обязан сделать перерыв для отдыха от управления транспортным средством продолжительностью не менее 45 минут, после которого этим водителем может быть начат очередной период управления транспортным средством. Указанный перерыв для отдыха может быть разделен на 2 части или более, первая из которых должна составлять не менее 15 минут, а последняя - не менее 30 минут."},{num:"26.2",text:"Время управления транспортным средством не должно превышать:\n\n• 9 часов в течение периода, не превышающего 24 часов с момента завершения ежедневного или еженедельного отдыха. Допускается увеличение этого времени до 10 часов, но не более 2 раз в течение календарной недели;\n• 56 часов в течение календарной недели;\n• 90 часов в течение 2 календарных недель."},{num:"26.3",text:"Отдых водителя от управления транспортным средством должен быть непрерывным и составлять:\n\n• не менее 11 часов в течение периода, не превышающего 24 часов с момента завершения предшествующего отдыха (ежедневный отдых). Допускается сокращение этого времени до 9 часов, но не более 3 раз в течение периода между двумя последовательными периодами еженедельного отдыха;\n• не менее 45 часов, которые начинаются не позднее чем по окончании периода, не превышающего шести 24-часовых периодов с момента завершения еженедельного отдыха (еженедельный отдых). Допускается сокращение этого времени до 24 часов, но не более одного раза в течение 2 подряд календарных недель. Разница времени, на которую сокращен еженедельный отдых, в полном объеме должна быть в течение 3 подряд календарных недель после окончания календарной недели, в которой еженедельный отдых был сокращен, использована водителем на отдых от управления транспортным средством. Этот период отдыха должен быть присоединен к ежедневному отдыху продолжительностью не менее 9 часов или к очередному еженедельному отдыху. Любой ежедневный отдых может быть заменен еженедельным. (Изменение вступило в силу: 1 сентября 2023 года)."},{num:"26.4",text:'При достижении предельного времени управления транспортным средством, предусмотренного пунктом 26.1 и (или) абзацем вторым пункта 26.2 настоящих Правил, и при отсутствии места стоянки для отдыха водитель вправе увеличить период управления транспортным средством на время, необходимое для движения с соблюдением необходимых мер предосторожности до ближайшего места стоянки для отдыха, но не более чем:\n\n• на 1 час - для случая, указанного в пункте 26.1 настоящих Правил;\n• на 2 часа - для случая, указанного в абзаце втором пункта 26.2 настоящих Правил.\n\nПримечание. Положения настоящего раздела применяются в отношении физических лиц, осуществляющих эксплуатацию грузовых автомобилей, разрешенная максимальная масса которых превышает 3500 килограммов, и автобусов, а также физических лиц, применяющих специальный налоговый режим "Налог на профессиональный доход", не являющихся индивидуальными предпринимателями и которым в соответствии с законодательством Российской Федерации предоставлено право на осуществление деятельности по перевозке пассажиров и багажа легковым такси.\n\nУказанные физические лица по требованию должностных лиц, уполномоченных на осуществление федерального государственного контроля (надзора) в области безопасности дорожного движения, предоставляют доступ к тахографу и карте водителя, используемой совместно с тахографом, а также осуществляют по требованию этих должностных лиц вывод на печать информации из тахографа (при наличии тахографа и карты водителя, используемой совместно с тахографом). (Изменение вступило в силу: 1 сентября 2023 года).'}]}];
</script>
