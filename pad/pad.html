}

// Кэшируем последний zoom: размер маркеров пересчитывается только при его изменении,
// а не на каждый кадр движения камеры (перемещение не меняет zoom).
let _lastZoomForSize = null;

function updateAllPicMarkers(event) {
    if (!map) return;
    const cam = (event && event.camera) || {};
    const azDeg = isFinite(cam.azimuth) ? cam.azimuth * 180 / Math.PI : undefined;
    if (azDeg !== undefined) mapRot = azDeg;
    const zoom = isFinite(cam.zoom) ? cam.zoom : map.zoom;
    const cLat = cam.center && isFinite(cam.center[1])
        ? cam.center[1]
        : (map.center && isFinite(map.center[1]) ? map.center[1] : NaN);
    // Камера ещё не стабилизировалась (иногда на первом кадре zoom/center = NaN) —
    // пропускаем кадр, чтобы не пересчитывать размеры в мусорные значения.
    if (!isFinite(zoom) || !isFinite(cLat)) return;
    if (zoom !== _lastZoomForSize) {
        // zoom изменился — пересчитываем размер всех маркеров
        _lastZoomForSize = zoom;
        placedMarkers.forEach(updatePicSize);
        mapSigns.forEach(updatePicSize);
        // и толщину линий, нарисованных в «метровом» режиме (widthM).
        // Старые линии без widthM остаются фиксированной пиксельной толщины.
        if (drawnLines.some(l => l.widthM)) {
            const mpp = metersPerPixel(cLat);
            if (isFinite(mpp) && mpp > 0) {
                drawnLines.forEach(l => {
                    if (!l.widthM) return;
                    l.feature.update({ style: { stroke: [{ width: Math.max(1, l.widthM / mpp), color: hexToRgba(l.color, 0.7) }] } });
                });
            }
        }
    } else {
        // zoom не менялся (перемещение/поворот) — только поворот, без пересчёта размера
        placedMarkers.forEach(updatePicTransform);
        mapSigns.forEach(updatePicTransform);
    }
    positionAllText();
}

            const matches = [];
            sec.entries.forEach(entry => {
                if (entry.group) return;
                const hay = (entry.num + ' ' + entry.text).toLowerCase();
                if (hay.includes(low)) matches.push(entry);
            });
            if (matches.length) out.push({ sec, matches });
        });
        return out;
    }

    function pddSnippet(text, query) {
        const low = query.toLowerCase();
        const textLow = text.toLowerCase();
        const idx = textLow.indexOf(low);
        const start = Math.max(0, idx - 60);
        const end = Math.min(text.length, (idx === -1 ? 0 : idx) + Math.max(low.length, 0) + 140);
        let s = (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
        s = escapeHtml(s);
        if (low) s = s.replace(new RegExp('(' + escapeRegExp(query) + ')', 'gi'), '<mark>$1</mark>');
        return s;
    }

    function pddHighlightFull(text, query) {
        let s = escapeHtml(text);
        if (query) s = s.replace(new RegExp('(' + escapeRegExp(query) + ')', 'gi'), '<mark>$1</mark>');
        return s;
    }

    function pddRender() {
        const body = document.getElementById('pddBody');
        const v = pddStack[pddStack.length - 1];
        document.getElementById('pddTitle').textContent = v.type === 'sections' ? 'ПДД РФ' : v.type === 'items' ? v.sec.title : v.type === 'search' ? 'Поиск: «' + v.query + '»' : 'Пункт ' + v.entry.num;
        document.getElementById('pddBack').style.visibility = pddStack.length > 1 ? 'visible' : 'hidden';
        body.innerHTML = '';
        if (v.type === 'sections') {
            PDD_DATA.forEach(sec => {
                const row = document.createElement('div');
                row.className = 'pdd-row';
                row.textContent = sec.title;
                row.addEventListener('click', () => { pddStack.push({ type: 'items', sec }); pddRender(); });
                body.appendChild(row);
            });
        } else if (v.type === 'items') {
            v.sec.entries.forEach(entry => {
                if (entry.group) {
                    const g = document.createElement('div');
                    g.className = 'pdd-group';
                    g.textContent = entry.group;
                    body.appendChild(g);
                    return;
                }
                const row = document.createElement('div');
                row.className = 'pdd-row';
                const num = document.createElement('span');
                num.className = 'pdd-row-num';
                num.textContent = entry.num + '.';
                const prev = document.createElement('span');
                prev.className = 'pdd-row-prev';
                prev.textContent = entry.text;
                row.appendChild(num);
                row.appendChild(prev);
                row.addEventListener('click', () => { pddStack.push({ type: 'text', sec: v.sec, entry }); pddRender(); });
                body.appendChild(row);
            });
        } else if (v.type === 'search') {
            const results = pddSearchEntries(v.query);
            if (!results.length) {
                const e = document.createElement('div');
                e.className = 'pdd-empty';
                e.textContent = 'Ничего не найдено';
                body.appendChild(e);
            } else {
                results.forEach(({ sec, matches }) => {
                    const g = document.createElement('div');
                    g.className = 'pdd-group';
                    g.textContent = sec.title;
                    body.appendChild(g);
                    matches.forEach(entry => {
                        const row = document.createElement('div');
                        row.className = 'pdd-row';
                        const num = document.createElement('span');
                        num.className = 'pdd-row-num';
                        num.textContent = entry.num + '.';
                        const prev = document.createElement('span');
                        prev.className = 'pdd-row-prev';
                        prev.innerHTML = pddSnippet(entry.text, v.query);
                        row.appendChild(num);
                        row.appendChild(prev);
                        row.addEventListener('click', () => { pddStack.push({ type: 'text', sec, entry, query: v.query }); pddRender(); });
                        body.appendChild(row);
                    });
                });
            }
        } else {
            const t = document.createElement('div');
            t.className = 'pdd-text';
            const num = document.createElement('span');
            num.className = 'pdd-row-num';
            num.textContent = v.entry.num + '.';
            t.appendChild(num);
            if (v.query) {
                const txt = document.createElement('span');
                txt.innerHTML = pddHighlightFull(v.entry.text, v.query);
                t.appendChild(txt);
                body.appendChild(t);
                requestAnimationFrame(() => {
                    const mark = t.querySelector('mark');
                    if (mark) mark.scrollIntoView({ block: 'center' });
                });
            } else {
                const txt = document.createElement('span');
                txt.textContent = v.entry.text;
                t.appendChild(txt);
                body.appendChild(t);
            }
        }
        body.scrollTop = 0;
    }

    const pddBtn = document.getElementById('pddBtn');
    const pddModal = document.getElementById('pddModal');
    const togglePdd = () => {
        const open = !pddModal.classList.contains('visible');
        pddModal.classList.toggle('visible', open);
        pddBtn.classList.toggle('active', open);
        document.body.classList.toggle('pdd-open', open);
        if (open) { pddStack = [{ type: 'sections' }]; document.getElementById('pddSearch').value = ''; setSearchVisible(false); pddRender(); }
        placeGalleryAbove();
    };
    // Переключение режима скрытия элементов управления (общая логика для
    // кнопки #hideUiBtn и долгого нажатия на кнопку ПДД).
    const setControlsHidden = (hidden) => {
        document.body.classList.toggle('controls-hidden', hidden);
        const hideUiBtn = document.getElementById('hideUiBtn');
        if (hideUiBtn) hideUiBtn.classList.toggle('active', hidden);
        // Блокировать перетаскивание в режиме скрытия не нужно: знаки, светофоры
        // и текст и так перемещаются только через включаемый в их панелях режим,
        // а панели в этом режиме скрыты. Машинки можно двигать всегда, кроме
        // момента воспроизведения записи (играющие маркеры блокирует recplay.js).
        placedMarkers.forEach(m => m.update({ draggable: markerDraggable(m) && !m._playing }));
        mapSigns.forEach(m => m.update({ draggable: markerDraggable(m) }));
        // при скрытии закрываем шторку и все панели
        if (hidden) {
            if (pddModal.classList.contains('visible')) togglePdd();
            ['picPanel', 'znakPanel', 'tlPanel'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('visible');
            });
            document.getElementById('addPicBtn').classList.remove('open');
            document.getElementById('addZnakBtn').classList.remove('open');
            const tlb = document.getElementById('addTlBtn');
            if (tlb) tlb.classList.remove('open');
        }
    };
    const toggleControlsHidden = () => {
        const hidden = !document.body.classList.contains('controls-hidden');
        setControlsHidden(hidden);
    };
    document.getElementById('hideUiBtn').addEventListener('click', toggleControlsHidden);
    // Долгое нажатие на кнопку ПДД: скрыть/вернуть все элементы управления
    let pddLpTimer = null, pddLpFired = false;
    const pddLpClear = () => { if (pddLpTimer) { clearTimeout(pddLpTimer); pddLpTimer = null; } };
    pddBtn.addEventListener('pointerdown', () => {
        pddLpFired = false;
        pddLpTimer = setTimeout(() => {
            pddLpTimer = null;
            pddLpFired = true;
            toggleControlsHidden();
        }, 500);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => pddBtn.addEventListener(ev, pddLpClear));
    pddBtn.addEventListener('click', () => {
        if (pddLpFired) { pddLpFired = false; return; } // это был long-press — не открываем шторку
        togglePdd();
    });
    document.getElementById('pddClose').addEventListener('click', togglePdd);
    document.getElementById('pddBack').addEventListener('click', () => {
        if (pddStack[pddStack.length - 1].type === 'search') { exitSearch(); return; }
        if (pddStack.length > 1) { pddStack.pop(); pddRender(); }
        else togglePdd();
    });

    const pddSearchInput = document.getElementById('pddSearch');
    const pddSearchBox = document.querySelector('.pdd-search');
    const pddSearchBtn = document.getElementById('pddSearchBtn');
    const setSearchVisible = (v) => {
        pddSearchBox.classList.toggle('visible', v);
        pddSearchBtn.classList.toggle('active', v);
        if (v) pddSearchInput.focus();
    };
    const exitSearch = () => {
        pddSearchInput.value = '';
        setSearchVisible(false);
        const si = pddStack.findIndex(x => x.type === 'search');
        if (si !== -1) { pddStack = pddStack.slice(0, si); pddRender(); }
    };
    pddSearchBtn.addEventListener('click', () => {
        if (pddSearchBox.classList.contains('visible')) exitSearch();
        else setSearchVisible(true);
    });
    pddSearchInput.addEventListener('input', () => {
        const q = pddSearchInput.value.trim().replace(/\s+/g, ' ');
        const top = pddStack[pddStack.length - 1];
        if (!q) {
            if (top.type === 'search') { pddStack.pop(); pddRender(); }
            return;
        }
        if (top.type === 'search') {
            if (top.query !== q) { top.query = q; pddRender(); }
        } else {
            pddStack.push({ type: 'search', query: q });
            pddRender();
        }
    });

    const pddHeader = document.querySelector('.pdd-header');
    let pddDrag = null;
    pddHeader.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.pdd-nav')) return;
        document.body.classList.add('pdd-drag');
        pddDrag = { startY: e.clientY, startH: pddModal.offsetHeight };
        pddHeader.setPointerCapture(e.pointerId);
        e.preventDefault();
    });
    const galleryBtn = document.getElementById('addPicBtn');
    const galleryPanel = document.getElementById('picPanel');
    const znakBtn = document.getElementById('addZnakBtn');
    const znakPanelEl = document.getElementById('znakPanel');
    function placeGalleryAbove() {
        // Кнопки нижнего ряда поднимаются вместе со шторкой ПДД, панели галерей — ещё выше (над кнопками)
        const btns = ['addPicBtn', 'addZnakBtn', 'addTlBtn', 'textBtn', 'eraserBtn', 'drawBtn']
            .map(id => document.getElementById(id)).filter(Boolean);
        const panels = ['picPanel', 'tlPanel']
            .map(id => document.getElementById(id)).filter(Boolean);
        const signModal = document.getElementById('znakModal');
        // У панели знаков положение задаёт не bottom самой панели, а отступ
        // оверлея-шторки — иначе отступ складывается и панель уезжает вверх.
        if (znakPanelEl) znakPanelEl.style.bottom = '';
        if (document.body.classList.contains('pdd-open')) {
            const h = pddModal.offsetHeight + 12;
            for (const el of btns) el.style.bottom = h + 'px';
            for (const el of panels) el.style.bottom = (h + 64) + 'px';
            if (signModal) signModal.style.setProperty('--pad-sheet-bottom', (h + 64) + 'px');
            const colorPanel = document.getElementById('colorPanel');
            const widthSlider = document.getElementById('widthSlider');
            if (colorPanel) colorPanel.style.bottom = (h + 64) + 'px';
            if (widthSlider) widthSlider.style.bottom = (h + 128) + 'px';
        } else {
            for (const el of btns) el.style.bottom = '';
            for (const el of panels) el.style.bottom = '';
            if (signModal) signModal.style.removeProperty('--pad-sheet-bottom');
            const colorPanel = document.getElementById('colorPanel');
            const widthSlider = document.getElementById('widthSlider');
            if (colorPanel) colorPanel.style.bottom = '';
            if (widthSlider) widthSlider.style.bottom = '';
        }
    }
    pddHeader.addEventListener('pointermove', (e) => {
        if (!pddDrag) return;
        const h = pddDrag.startH + (pddDrag.startY - e.clientY);
        const vh = window.innerHeight;
        pddModal.style.height = Math.min(vh, Math.max(vh * 0.15, h)) + 'px';
        placeGalleryAbove();
    });
    const endPddDrag = () => { pddDrag = null; document.body.classList.remove('pdd-drag'); };
    pddHeader.addEventListener('pointerup', endPddDrag);
    pddHeader.addEventListener('pointercancel', endPddDrag);

    document.getElementById('addPicBtn').addEventListener('click', () => {
        if (drawMode) stopDraw();
        if (eraserMode) stopEraser();
        if (textMode) stopTextMode();
        const panel = document.getElementById('picPanel');
        panel.classList.toggle('visible');
        document.getElementById('addPicBtn').classList.toggle('open', panel.classList.contains('visible'));
        if (panel.classList.contains('visible')) {
            // Сетка строится один раз при старте; пересоздание заставляет картинки мигать
            if (!document.getElementById('picGrid').children.length) buildPicGrid();
            document.getElementById('znakModal').classList.remove('visible');
            document.getElementById('addZnakBtn').classList.remove('open');
            const tlPanel = document.getElementById('tlPanel');
            if (tlPanel) { tlPanel.classList.remove('visible'); }
            const tlBtn = document.getElementById('addTlBtn');
            if (tlBtn) tlBtn.classList.remove('open');
        }
    });

    document.getElementById('addZnakBtn').addEventListener('click', async () => {
        if (drawMode) stopDraw();
        if (eraserMode) stopEraser();
        if (textMode) stopTextMode();
        const modal = document.getElementById('znakModal');
        if (!signsLayerMode) {
            // Вход в режим знаков: окно каталога изначально закрыто,
            // его открывает вкладка группы знаков.
            await enterSignsLayer();
            return;
        }
        if (!modal.classList.contains('visible')) {
            openZnakPanel('place');
            return;
        }
        // Галерея открыта — повторное нажатие выходит из режима слоя знаков.
        await requestExitSignsLayer();
    });

    const tlToggleBtn = document.getElementById('addTlBtn');
    if (tlToggleBtn) tlToggleBtn.addEventListener('click', () => {
        if (drawMode) stopDraw();
        if (eraserMode) stopEraser();
        if (textMode) stopTextMode();
        const panel = document.getElementById('tlPanel');
        panel.classList.toggle('visible');
        tlToggleBtn.classList.toggle('open', panel.classList.contains('visible'));
        if (panel.classList.contains('visible')) {
            if (window.buildTlGrid) window.buildTlGrid();
            document.getElementById('picPanel').classList.remove('visible');
            document.getElementById('addPicBtn').classList.remove('open');
            document.getElementById('znakModal').classList.remove('visible');
            document.getElementById('addZnakBtn').classList.remove('open');
        }
    });

    const znakSearch = document.getElementById('znakSearch');
    if (znakSearch) {
    }

    buildPicGrid();
    loadZnakCatalog();
    document.getElementById('addPicThumb').src = 'pic/' + encodeURIComponent(PIC_FILES[0]);
    document.getElementById('addZnakThumb').src = 'znaki/webp/1.1.webp';
    document.querySelector('.color-btn[data-color="#000000"]').classList.add('active');
    commit();
    document.getElementById('loading').classList.add('hidden');
})();
</script>

<script>
// Deep-link сцены: startapp содержит s + постоянный ID сцены.
// Сцены общие, привязки к аккаунту нет.
(function () {
    let loadOverlay = null;
    const FLY_PAUSE_MS = 900; // длительность полёта карты к сцене + запас на отработку

    function showLoadOverlay() {
        if (loadOverlay) return;
        loadOverlay = document.createElement('div');
        loadOverlay.id = 'loadOverlay';
        const spin = document.createElement('div');
        spin.className = 'load-spinner';
        const label = document.createElement('div');
        label.textContent = 'Загружаю сцену';
        loadOverlay.appendChild(spin);
        loadOverlay.appendChild(label);
        document.body.appendChild(loadOverlay);
    }

    function hideLoadOverlay() {
        if (!loadOverlay) return;
        loadOverlay.remove();
        loadOverlay = null;
    }

    function handleStartParam() {
        try {
            const search = new URLSearchParams(location.search);
            const sceneIdParam = search.get('scene');
            const directSceneId = /^[a-z0-9]{8}$/.test(sceneIdParam || '') ? sceneIdParam : null;
            const urlParam = search.get('startapp');
            const wa = window.Telegram && window.Telegram.WebApp;
            const tgParam = (wa && wa.initDataUnsafe && wa.initDataUnsafe.start_param) || null;
            // В WebView startapp лежит в initDataUnsafe.start_param, который появляется
            // только после загрузки SDK Telegram. Если SDK ещё не готов — ждём его.
            if (!directSceneId && !tgParam && !urlParam && !window._tgInitDone && typeof window.onTgReady === 'function') {
                window.onTgReady(handleStartParam);
                return;
            }
            const param = tgParam || urlParam;
            const match = param && /^s([a-z0-9]{8})$/.exec(param);
            const sceneId = directSceneId || (match && match[1]);
            if (!sceneId) return;
            // Показываем спиннер «Загрузка», пока сцена грузится в карту.
            showLoadOverlay();
            if (!window.loadSharedScene) { setTimeout(handleStartParam, 100); return; }
            // При запуске по ссылке с параметром сразу включаем режим прозрачности
            if (document.body) {
                document.body.classList.add('controls-hidden');
                const hub = document.getElementById('hideUiBtn');
                if (hub) hub.classList.add('active');
            }
            // Ждём готовности карты
            const doLoad = () => {
                window.loadSharedScene(sceneId).then(() => {
                    // Сцена применена — ждём завершения полёта карты к сцене.
                    setTimeout(() => hideLoadOverlay(), FLY_PAUSE_MS);
                    // Записи в сцене есть — включаем кнопку запуска воспроизведения
                    // (имитация нажатия: тот же старт, что и по тапу пользователя).
                    // Играющие машинки блокирует markPlaying() в recplay.js.
                    const pb = document.getElementById('playAllBtn');
                    if (pb && !pb.classList.contains('active')) pb.click();
                });
            };
            if (map) {
                doLoad();
            } else {
                const t = setInterval(() => {
                    if (map) { clearInterval(t); doLoad(); }
                }, 500);
            }
        } catch (e) { /* безвредно: ссылка с параметром не должна ломать запуск */ }
    }
    handleStartParam();
})();
</script>
<script>
// Нажатие любой кнопки интерфейса закрывает открытую шторку менеджера сцен.
document.addEventListener('pointerdown', (e) => {
    if (typeof window.closeSceneManager !== 'function') return;
    const t = e.target;
    if (!t || !t.closest) return;
    if (t.closest('.scene-io-modal')) return; // клики внутри шторки её не закрывают
    if (t.closest('#saveBtn')) return; // кнопка менеджера сама переключает шторку
    if (t.closest('.fab') || t.closest('#pddBtn') || t.closest('#savePddGroup')) {
        window.closeSceneManager();
    }
}, true);
</script>
