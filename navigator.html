        display: inline-block;
        width: 52px;
        height: 32px;
        flex-shrink: 0;
    }
    .toggle-input { display: none; }
    .toggle-slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: rgba(255,255,255,0.15);
        border-radius: 32px;
        transition: 0.25s;
    }
    .toggle-slider::before {
        content: '';
        position: absolute;
        width: 26px; height: 26px;
        left: 3px; bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: 0.25s;
    }
    .toggle-input:checked + .toggle-slider {
        background: #30D158;
    }
    .toggle-input:checked + .toggle-slider::before {
        transform: translateX(20px);
    }

<script>
    // Грузим Telegram/VK SDK асинхронно с таймаутом 10с.
    (function (g) {
        var finished = false, pending = 0, cbs = [];
        function finish() {
            if (finished) return;
            finished = true;
            var list = cbs.splice(0);
            for (var i = 0; i < list.length; i++) { try { list[i](); } catch (e) {} }
        }
        function tryLoad(url, flag) {
            pending++;
            var settled = false;
            var controller = null;
            var timeout = null;
            function settle(failed) {
                if (settled) return; settled = true;
                if (failed) { try { g[flag] = true; } catch (e) {} }
                if (timeout) { clearTimeout(timeout); timeout = null; }
                if (controller) { try { controller.abort(); } catch (e) {} controller = null; }
                if (--pending === 0) finish();
            }
            timeout = setTimeout(function () { settle(true); }, 10000);
            if (typeof fetch === 'function' && typeof AbortController !== 'undefined') {
                controller = new AbortController();
                fetch(url, { signal: controller.signal })
                    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
                    .then(function (code) {
                        if (settled) return;
                        try {
                            var s = document.createElement('script');
                            s.text = code;
                            (document.head || document.documentElement).appendChild(s);
                        } catch (e) {}
                        settle(false);
                    })
                    .catch(function () { settle(true); });
            } else {
                var s = document.createElement('script');
                s.async = true;
                var done = false;
                function done_(failed) { if (done) return; done = true; settle(failed); }
                s.onload = function () { done_(false); };
                s.onerror = function () { done_(true); };
                s.src = url;
                try { (document.head || document.documentElement).appendChild(s); }
                catch (e) { done_(true); }
            }
        }
        g.bootPlatforms = function (cb) {
            if (finished) { try { cb(); } catch (e) {} }
            else cbs.push(cb);
        };
        g.platformReady = new Promise(function (r) { g.bootPlatforms(r); });
        tryLoad('https://telegram.org/js/telegram-web-app.js', '__tgWebAppFailed');
        tryLoad('https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js', '__vkBridgeFailed');
    })(window);
</script>

// Auth detection (ждёт загрузки Telegram/VK SDK, максимум ~10с)
(function() {
    // localStorage-авторизация применяется СРАЗУ (браузер без TG/VK), чтобы личные маршруты
    // не ждали таймаута загрузки SDK (до ~10с). TG/VK ниже имеют приоритет и переопределяют её.
    if (!window.authPlatform) {
        try {
            const stored = JSON.parse(localStorage.getItem('3api_auth') || '{}');
            if (stored.platform && stored.login) {
                window.authPlatform = stored.platform;
                window.authLogin = stored.login;
                window.authPassword = stored.password || '';
                window.authName = stored.name || stored.login;
            }
        } catch (e) {}
    }
    const runAuth = () => {
        if (window._authRan) return;
        window._authRan = true;
        if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
            try {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                if (Telegram.WebApp.version && parseFloat(Telegram.WebApp.version) >= 7.0) {
                    try { Telegram.WebApp.requestFullscreen?.(); } catch (e) {}
                    try { Telegram.WebApp.disableVerticalSwipes?.(); } catch (e) {}
                }
                const user = Telegram.WebApp.initDataUnsafe?.user;
                if (user) {
                    window.authPlatform = 'tg';
                    window.authLogin = String(user.id);
                    window.authPassword = '';
                    window.authName = [user.first_name, user.last_name].filter(Boolean).join(' ');
                    window.tgUser = user;
                    window.tgInitData = Telegram.WebApp.initData;
                }
            } catch (e) {}
        }
        if (typeof vkBridge !== 'undefined') {
            try {
                vkBridge.send('VKWebAppInit');
                vkBridge.send('VKWebAppGetUserInfo').then(data => {
                    if (data?.id) {
                        window.authPlatform = 'vk';
                        window.authLogin = String(data.id);
                        window.authPassword = '';
                        window.authName = [data.first_name, data.last_name].filter(Boolean).join(' ');
                        window.vkUser = data;
                    }
                });
            } catch (e) {}
        }
        if (!window.authPlatform) {
            try {
                const stored = JSON.parse(localStorage.getItem('3api_auth') || '{}');
                if (stored.platform && stored.login) {
                    window.authPlatform = stored.platform;
                    window.authLogin = stored.login;
                    window.authPassword = stored.password || '';
                    window.authName = stored.name || stored.login;
                }
            } catch (e) {}
        }
        if (navigator.userAgent.includes('Android') && window.authPlatform === 'tg') {
            document.documentElement.classList.add('android-app');
        }
    };
    if (window.bootPlatforms) window.bootPlatforms(runAuth); else runAuth();
})();

function calcAzimuth(p1, p2) {
    if (!p1 || !p2) return 0;
    const [la1, lo1] = p1.map(v => v * Math.PI / 180);
    const [la2, lo2] = p2.map(v => v * Math.PI / 180);
    const y = Math.sin(lo2 - lo1) * Math.cos(la2);
    const x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(lo2 - lo1);
    return Math.round((Math.atan2(y, x) * 180 / Math.PI + 360) % 360);
}

function getGeoDistance(p1, p2) {
    const R = 6371000;
    const dLat = (p2[0] - p1[0]) * Math.PI / 180;
    const dLon = (p2[1] - p1[1]) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(p1[0] * Math.PI / 180) * Math.cos(p2[0] * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function setMapLocation(center, zoom, azimuth, duration = 400) {
    if (!APP.map) return;
    const params = { center: [center[1], center[0]], duration, easing: 'linear' };
    if (zoom !== undefined) params.zoom = zoom;
    if (azimuth !== undefined) {
        params.bearing = azimuth;
    }
    APP.map.easeTo(params);
}

// --- MapLibre Initialization ---
async function initMap() {
    const { Map, GeolocateControl, Marker, NavigationControl } = maplibregl;
    
    // Initial center (Nizhny Novgorod as fallback)
    const initialCenter = [43.9332, 56.3399];
    
    APP.map = new Map({
        container: 'map',
        style: getStyleUrl(APP._currentStyle),
        center: initialCenter,
        zoom: 16,
        pitch: 0,
        bearing: 0,
        antialias: true,
        preserveDrawingBuffer: false,
    });
    
    // Add navigation controls (zoom, compass)
    APP.map.addControl(new NavigationControl({
        showCompass: true,
        showZoom: true,
        visualizePitch: true,
    }), 'top-left');
    
    // Geolocate control
    APP._geolocateControl = new GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true,
        showUserHeading: true,
    });
    APP.map.addControl(APP._geolocateControl, 'top-left');
    
    // Wait for map to load
    await new Promise(resolve => APP.map.once('load', resolve));
    
    // Create user marker
    createUserMarker();
    
    // Start geolocation tracking
    initGeolocation();
    
    // Hide loading overlay
    const loading = $('loading');
    if (loading) loading.classList.add('hidden');
    
    // Enable wake lock if supported
    try {
        const video = $('wakeLockVideo');
        if (video) {
            await video.play().catch(() => {});
        }
    } catch (e) {}
    
    // Check URL for route
    if (typeof MenuModule !== 'undefined') {
        MenuModule.checkUrlParam();
    }
}

function createUserMarker() {
    const el = document.createElement('div');

    el.style.cssText = 'width:40px;height:40px;transform:translate(-50%,-50%);pointer-events:none;';

            <circle cx="20" cy="20" r="18" fill="#007AFF" opacity="0.9"/>
            <circle cx="20" cy="20" r="18" fill="none" stroke="#fff" stroke-width="2"/>
            <path d="M20 8 L20 16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            <circle cx="20" cy="20" r="6" fill="#fff"/>
        </svg>
    `;
    APP.userMarkerEl = el;
    APP.userMarker = new maplibregl.Marker({ element: el, anchor: 'center' })
        .setLngLat([0, 0])
        .addTo(APP.map);
    APP.userMarker._element = el;
}

function initGeolocation() {
    if (!navigator.geolocation) return;
    
    navigator.geolocation.watchPosition(pos => {
        const coords = [pos.coords.latitude, pos.coords.longitude];
        const speed = (pos.coords.speed || 0) * 3.6;
        
        if (APP.lastPos && speed >= APP.navConfig.SPEED_THRESHOLD) {
            const rawAz = calcAzimuth(APP.lastPos, coords);
            APP.rawAz = rawAz;
            APP.lastAz = rawAz;
        }
        APP.lastPos = coords;
        APP.currentSpeed = speed;
        checkSpeedAlert(speed);
        
        if (APP.userMarker && APP.userMarkerEl) {
            if (APP.autoCenter) {
                APP._lastMarkerPos = coords;
                APP._currentDisplayAz = APP.lastAz;
                APP.userMarker.setLngLat([coords[1], coords[0]]);
                const bearing = APP.lastAz || 0;
                APP.map.easeTo({
                    center: [coords[1], coords[0]],
                    bearing: bearing,
                    pitch: APP.lastTilt,
                    duration: 0
                });
            } else {
                APP._lastMarkerPos = coords;
                APP._currentDisplayAz = APP.lastAz;
                APP.userMarker.setLngLat([coords[1], coords[0]]);
            }
            updateUserMarkerRotation();
        }
        $('telSpeed').textContent = Math.round(APP.currentSpeed);
        
        if (APP.navCurrentIndex >= 0) navCheckTriggers();
    }, () => {}, { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 });
}

function updateUserMarkerRotation() {
    if (!APP.userMarkerEl || APP.lastAz === null || !APP.map) return;
    if (APP.currentSpeed < APP.navConfig.SPEED_THRESHOLD) return;
    const arrow = APP.userMarkerEl.querySelector('svg');
    if (arrow) {
        const mapBearing = APP.map.getBearing();
        const targetRotation = APP._currentDisplayAz - mapBearing;
        let delta = ((targetRotation - APP.markerRotation + 180) % 360) - 180;
        APP.markerRotation += delta;
        arrow.style.transform = `rotate(${APP.markerRotation}deg)`;
    }
}

function disableAutoCenter() {
    if (APP._autoCenterTimer) {
        clearTimeout(APP._autoCenterTimer);
        APP._autoCenterTimer = null;
    }
    APP.autoCenter = false;
    $('locateBtn').classList.remove('active');
    updateTiltState();
}

function tempDisableAutoCenter(duration) {
    if (!APP.autoCenter) return;
    disableAutoCenter();
    APP._autoCenterTimer = setTimeout(() => {
        APP.autoCenter = true;
        $('locateBtn').classList.add('active');
        if (APP.lastPos) {
            const bearing = APP.lastAz || 0;
            APP.map.easeTo({
                center: [APP.lastPos[1], APP.lastPos[0]],
                bearing: bearing,
                pitch: APP.lastTilt,
                duration: 0
            });
        }
        updateTiltState();
        APP._autoCenterTimer = null;
    }, duration || 5000);
}

function toggleAutoCenter() {
    if (APP._autoCenterTimer) {
        clearTimeout(APP._autoCenterTimer);
        APP._autoCenterTimer = null;
    }
    APP.autoCenter = !APP.autoCenter;
    $('locateBtn').classList.toggle('active', APP.autoCenter);
    if (APP.autoCenter) {
        stopDrive();
        APP._simMode = false;
    }
    if (APP.autoCenter && APP.lastPos) {
        const bearing = APP.lastAz || 0;
        APP.map.easeTo({
            center: [APP.lastPos[1], APP.lastPos[0]],
            bearing: bearing,
            pitch: APP.lastTilt,
            duration: 0
        });
    }
    updateTiltState();
    showToast(APP.autoCenter ? 'Привязка включена' : 'Привязка отключена');
}

function updateShockDisplay() {
    if (!$('triggerShockToggle').checked) {
        $('triggerShockVal').textContent = 'Выкл';
        return;
    }
    const val = parseFloat($('triggerShock').value);
    $('triggerShockVal').textContent = val + 'g';
}

function applyShockConfig() {
    const on = $('triggerShockToggle').checked;
    const val = on ? parseFloat($('triggerShock').value) : 0;
    const phrase = $('triggerShockPhrase').value.trim() || 'Сильный удар';
    APP.navConfig.SHOCK_THRESHOLD = val;
    APP.navConfig.SHOCK_PHRASE = phrase;
    updateShockBarVisibility();
    if (val > 0) ensureMotionTracking();
}

function applySpeedConfig() {
    const on = $('triggerSpeedAlertToggle').checked;
    const val = on ? parseInt($('triggerSpeedAlert').value) || 58 : 0;
    const phrase = $('triggerSpeedAlertPhrase').value.trim() || 'Превышена максимальная скорость';
    APP.navConfig.SPEED_ALERT_THRESHOLD = val;
    APP.navConfig.SPEED_ALERT_PHRASE = phrase;
}

function applyCommentConfig() {
    APP._commentEnabled = $('commentToggle').checked;
    if (!APP._commentEnabled) APP._commentAudio.pause();
    const ct = $('commentText');
    ct.style.display = APP._commentEnabled && ct.textContent.trim() ? 'block' : 'none';
    const pct = $('prevCommentText');
    if (pct) pct.style.display = APP._commentEnabled && pct.textContent.trim() ? 'block' : 'none';
}

async function requestMotionPermission() {
    if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
        try {
            const state = await DeviceMotionEvent.requestPermission();
            return state === 'granted';
        } catch (e) {
            return false;
        }
    }
    return true;
}

function ensureMotionTracking() {
    if (APP._motionTracked) return Promise.resolve(true);
    return requestMotionPermission().then(granted => {
        if (granted) {
            APP._motionTracked = true;
            window.addEventListener('devicemotion', onMotion);
        } else {
            APP.navConfig.SHOCK_THRESHOLD = 0;
            $('triggerShock').value = 0;
            updateShockDisplay();
        }
        updateShockBarVisibility();
        return granted;
    });
}

function updateShockBarVisibility() {
    const bar = $('shockBar');
    if (bar) bar.style.display = APP.navConfig.SHOCK_THRESHOLD > 0 ? 'block' : 'none';
}

const SHOCK_DEBOUNCE = 3000;

function isAudioPlaying() {
    return APP._audioPending > 0 ||
           (!APP.navAudio.paused && APP.navAudio.currentTime > 0) ||
           (!APP._commentAudio.paused && APP._commentAudio.currentTime > 0);
}

function onMotion(event) {
    const gThreshold = APP.navConfig.SHOCK_THRESHOLD;
    if (gThreshold <= 0) return;
    const { x, y, z } = event.accelerationIncludingGravity;
    const total = Math.sqrt(x*x + y*y + z*z);
    const impactG = Math.abs(total - 9.8) / 9.8;
    updateShockBar(impactG);
    if (isAudioPlaying()) return;
    if (impactG > gThreshold) {
        const now = Date.now();
        if (now - APP._lastShockTime < SHOCK_DEBOUNCE) return;
        APP._lastShockTime = now;
        playCommand(APP.navConfig.SHOCK_PHRASE || 'Сильный удар').catch(() => {});
    }
}

let _shockFill = null;
let _shockLabel = null;
let _shockLastG = -1;
let _shockLastColor = '';

function updateShockBar(g) {
    if (!_shockFill) _shockFill = $('shockBarFill');
    if (!_shockLabel) _shockLabel = $('shockBarValue');
    if (!_shockFill) return;
    const now = Date.now();
    if (g > APP._shockDisplayG) {
        APP._shockDisplayG = g;
        APP._shockPeakTime = now;
    } else if (now - APP._shockPeakTime > 1000) {
        APP._shockDisplayG += (g - APP._shockDisplayG) * 0.08;
        if (Math.abs(APP._shockDisplayG - g) < 0.01) {
            APP._shockDisplayG = g;
        }
    }
    const displayG = APP._shockDisplayG;
    if (Math.abs(displayG - _shockLastG) < 0.05) return;
    _shockLastG = displayG;
    const clamped = Math.max(0.1, Math.min(3, displayG));
    const pct = ((clamped - 0.1) / (3 - 0.1)) * 100;
    _shockFill.style.width = Math.min(100, pct) + '%';
    if (_shockLabel) {
        _shockLabel.textContent = displayG > 0.2 ? displayG.toFixed(2) : '';
    }
    let color;
    if (displayG < 0.5) color = '#30D158';
    else if (displayG < 1.5) color = '#FFD700';
    else if (displayG < 2.5) color = '#FF9500';
    else color = '#FF3B30';
    if (color !== _shockLastColor) {
        _shockFill.style.background = color;
        _shockLastColor = color;
    }
}

const SPEED_ALERT_DEBOUNCE = 5000;

function checkSpeedAlert(speed) {
    const threshold = APP.navConfig.SPEED_ALERT_THRESHOLD;
    if (threshold <= 0) return;
    if (isAudioPlaying()) return;
    if (speed > threshold) {
        const now = Date.now();
        if (now - APP._lastSpeedAlertTime < SPEED_ALERT_DEBOUNCE) return;
        APP._lastSpeedAlertTime = now;
        playCommand(APP.navConfig.SPEED_ALERT_PHRASE || 'Превышена максимальная скорость').catch(() => {});
    }
}

function setMapType(type) {
    if (!APP.map) return;
    const isScheme = type === 'scheme';
    const newStyle = isScheme ? 'streets' : 'hybrid';
    if (newStyle === APP._currentStyle) return;
    
    APP._currentStyle = newStyle;
    APP.map.setStyle(getStyleUrl(newStyle));
    
    // Recreate user marker after style change
    if (APP.userMarker) {
        APP.userMarker.remove();
        createUserMarker();
    }
    
    // Re-render route
    renderRoutePoints();
    
    showToast(isScheme ? 'Схема' : 'Спутник', 'info', 2000);
    $('schemeBtn').classList.toggle('active', isScheme);
    $('satBtn').classList.toggle('active', !isScheme);
}

function setTilt(mode) {
    const is3d = mode === '3d';
    if (is3d === APP._is3D) return;
    APP._is3D = is3d;
    APP.lastTilt = is3d ? 60 : 0;
    APP.map.easeTo({ pitch: APP.lastTilt, duration: 300 });
}

function updateTiltState() {
    setTilt(APP._simMode || APP.autoCenter ? '3d' : '2d');
}

function closeAllSheets() {
    closePointsList();
    closeSettings();
    if (typeof MenuModule !== 'undefined') MenuModule.hide();
}

function openSettings() {
    if (!$('navSettingsModal').classList.contains('hidden')) { closeSettings(); return; }
    closeAllSheets();
    $('schemeBtn').classList.toggle('active', APP._isScheme);
    $('satBtn').classList.toggle('active', !APP._isScheme);
    const shockOn = APP.navConfig.SHOCK_THRESHOLD > 0;
    $('triggerShockToggle').checked = shockOn;
    $('triggerShock').value = shockOn ? APP.navConfig.SHOCK_THRESHOLD : 1;
    $('triggerShockPhrase').value = APP.navConfig.SHOCK_PHRASE;
    const speedOn = APP.navConfig.SPEED_ALERT_THRESHOLD > 0;
    $('triggerSpeedAlertToggle').checked = speedOn;
    $('triggerSpeedAlert').value = speedOn ? APP.navConfig.SPEED_ALERT_THRESHOLD : 58;
    $('triggerSpeedAlertPhrase').value = APP.navConfig.SPEED_ALERT_PHRASE;
    $('triggerShockVal').textContent = shockOn ? APP.navConfig.SHOCK_THRESHOLD + 'g' : 'Выкл';
    $('commentToggle').checked = APP._commentEnabled;
    $('navSettingsModal').classList.remove('hidden');
    mountDonateNav();
}

function mountDonateNav() {
    try {
        if (typeof StarsDonate === 'undefined' || !StarsDonate.mount) return;
        const el = $('donateNav');
        if (!el || el.dataset.mounted) return;
        el.dataset.mounted = '1';
        StarsDonate.mount('#donateNav');
    } catch (e) {}
}

function hideSheetModal(modalId, sheetId) {
    const sheet = document.getElementById(sheetId);
    if (sheet) { sheet.style.transform = ''; sheet.style.transition = ''; }
    document.getElementById(modalId).classList.add('hidden');
}

function closeSettings() {
    hideSheetModal('navSettingsModal', 'navSettingsSheet');
}

function getNavIconSvg(col, txt, az, isEnd, isCurr = false, hasComm = false) {
    const s = isEnd ? 34 : 40, c = s / 2;
    const r = isEnd ? 7 : 9;
    const txtFill = '#ffffff';
    const txtStroke = hasComm ? '#FF3B30' : '#000000';
    const txtStrokeW = hasComm ? 3 : 2;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}">
        <rect width="${s}" height="${s}" fill="transparent"/>
        ${isCurr ? `<circle cx="${c}" cy="${c}" r="${r + 3}" fill="none" stroke="#00FF00" stroke-width="2.5" opacity="0.9"/>` : ''}
        <circle cx="${c}" cy="${c}" r="${r}" fill="rgba(0,0,0,0.7)"/>
        <circle cx="${c}" cy="${c}" r="${r}" fill="${col}" opacity="0.3"/>
        <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="1.5"/>
        <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
        <text x="${c}" y="${c + 0.5}" font-size="${isEnd ? 8 : 9}" font-family="Arial" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="${txtFill}" stroke="${txtStroke}" stroke-width="${txtStrokeW}" paint-order="stroke fill">${txt}</text>
    </svg>`;
    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

function hexToRgba(h, a) {
    return `rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`;
}

function removeRouteObjects() {
    if (!APP.map) return;
    APP.navPoints.forEach(p => {
        if (p.marker) p.marker.remove();
        if (p.lineLayerId) {
            if (APP.map.getLayer(p.lineLayerId)) APP.map.removeLayer(p.lineLayerId);
            if (APP.map.getSource(p.lineSourceId)) APP.map.removeSource(p.lineSourceId);
        }
    });
}

function updateRouteNameDisplay() {
    const el = $('routeNameDisplay');
    if (!el) return;
    let name = '';
    try {
        if (typeof MenuModule !== 'undefined') {
            const cr = MenuModule.currentRoute;
            if (cr && MenuModule.routesDescriptions && MenuModule.routesDescriptions[cr]) {
                const fullName = MenuModule.routesDescriptions[cr].name || '';
                name = fullName.split('/').pop() || fullName;
            }
            if (!name && cr) {
                const dashIndex = cr.indexOf('-');
                name = dashIndex > 0 ? decodeURIComponent(cr.substring(dashIndex + 1)) : cr;
            }
        }
    } catch (e) {}
    if (APP._routeTotalDistance > 0 && name) {
        const d = APP._routeTotalDistance;
        const distText = d >= 1000 ? `${(d / 1000).toFixed(1)} км` : `${Math.round(d)} м`;
        name = `${name} (${distText})`;
    }
    el.textContent = name;
    el.style.display = name ? 'block' : 'none';
}

function clearInfoMarkers() {
    APP._infoMarkers.forEach(m => m.remove());
    APP._infoMarkers = [];
}

function renderInfoMarkers() {
    clearInfoMarkers();
    if (!APP.map) return;
    const idx = APP.navCurrentIndex;
    const pt = APP.navPoints[idx];
    if (!pt || !pt.info || !pt.info.length) return;
    pt.info.forEach(inf => {
        const img = inf.image;
        if (!img) return;
        const el = document.createElement('img');
        el.src = `znaki/${img}`;
        el.style.cssText = 'width:36px;height:36px;border:none;outline:none;display:block;margin:-18px 0 0 -18px;';
        const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
            .setLngLat([inf.lon, inf.lat])
            .addTo(APP.map);
        APP._infoMarkers.push(marker);
    });
}

function clearRoute() {
    stopDrive();
    APP._simMode = false;
    updateTiltState();
    removeRouteObjects();
    clearInfoMarkers();
    APP.navPoints = [];
    APP.navCurrentIndex = 0;
    APP._routeTotalDistance = 0;
    $('hud').classList.remove('active');
    updateRouteNameDisplay();
}

function renderRoutePoints() {
    if (!APP.map) return;
    
    APP.navPoints.forEach((p, i) => {
        const isCurrent = (i === APP.navCurrentIndex);
        const isPassed = (i < APP.navCurrentIndex);
        const isPrevious = (i === APP.navCurrentIndex - 1);
        const hasComm = p.comm && p.comm.trim() !== '';
        
        const showPoint = APP._driveShowFrom >= 0 ? (i >= Math.max(APP._driveShowFrom - 1, 0)) : (!isPassed || isCurrent || isPrevious);
        const showPath = APP._driveShowFrom >= 0 ? (i >= Math.max(APP._driveShowFrom - 1, 0)) : (!isPassed || isPrevious);
        
        // Create or update marker
        if (!p.marker) {
            const el = document.createElement('div');
            el.style.cssText = 'width:40px;height:40px;cursor:pointer;transform:translate(-50%,-50%);';
            el.dataset.idx = i;
            el.addEventListener('click', e => {
                e.stopPropagation();
                const idx = parseInt(el.dataset.idx);
                setTarget(idx);
            });
            p.marker = new maplibregl.Marker({ element: el, anchor: 'center' })
                .setLngLat([p.lon, p.lat])
                .addTo(APP.map);
        }
        
        const el = p.marker.getElement();
        el.dataset.idx = i;
        
        if (showPoint) {
            el.style.display = '';
            el.style.opacity = isPrevious ? '0.7' : '';
            el.innerHTML = `<img src="${getNavIconSvg(p.hex, p.id, p.az, false, isCurrent, hasComm)}" width="40" height="40" class="marker-img" />`;
            p.marker.setLngLat([p.lon, p.lat]);
        } else {
            el.style.display = 'none';
        }
        
        // Create or update line
        if (showPath && p.pts && p.pts.length >= 2) {
            const coords = p.pts.map(pt => [pt[1], pt[0]]); // [lon, lat]
            const lineColor = isCurrent ? p.hex : (isPrevious ? hexToRgba(p.hex, 0.5) : p.hex);
            const lineWidth = isCurrent ? 6 : (isPrevious ? 4 : 4);
            const haloWidth = isCurrent ? 8 : (isPrevious ? 6 : 6);
            
            if (!p.lineLayerId) {
                p.lineSourceId = `route-line-${i}`;
                p.lineLayerId = `route-line-layer-${i}`;
                p.haloLayerId = `route-halo-layer-${i}`;
                
                APP.map.addSource(p.lineSourceId, {
                    type: 'geojson',
                    data: {
                        type: 'Feature',
                        geometry: { type: 'LineString', coordinates: coords }
                    }
                });
                
                // Halo (black outline)
                APP.map.addLayer({
                    id: p.haloLayerId,
                    type: 'line',
                    source: p.lineSourceId,
                    paint: {
                        'line-color': '#000000',
                        'line-width': haloWidth,
                        'line-opacity': isPrevious ? 0.7 : 1
                    }
                });
                
                // Main line
                APP.map.addLayer({
                    id: p.lineLayerId,
                    type: 'line',
                    source: p.lineSourceId,
                    paint: {
                        'line-color': lineColor,
                        'line-width': lineWidth,
                        'line-opacity': isPrevious ? 0.5 : 1
                    }
                });
                
                // Green highlight for current
                if (isCurrent) {
                    p.highlightLayerId = `route-highlight-layer-${i}`;
                    APP.map.addLayer({
                        id: p.highlightLayerId,
                        type: 'line',
                        source: p.lineSourceId,
                        paint: {
                            'line-color': '#00FF00',
                            'line-width': 10,
                            'line-opacity': 0.5
                        }
                    });
                }
            } else {
                // Update existing
                if (APP.map.getSource(p.lineSourceId)) {
                    APP.map.getSource(p.lineSourceId).setData({
                        type: 'Feature',
                        geometry: { type: 'LineString', coordinates: coords }
                    });
                }
                if (APP.map.getLayer(p.lineLayerId)) {
                    APP.map.setPaintProperty(p.lineLayerId, 'line-color', lineColor);
                    APP.map.setPaintProperty(p.lineLayerId, 'line-width', lineWidth);
                    APP.map.setPaintProperty(p.lineLayerId, 'line-opacity', isPrevious ? 0.5 : 1);
                }
                if (APP.map.getLayer(p.haloLayerId)) {
                    APP.map.setPaintProperty(p.haloLayerId, 'line-width', haloWidth);
                    APP.map.setPaintProperty(p.haloLayerId, 'line-opacity', isPrevious ? 0.7 : 1);
                }
                if (isCurrent && p.highlightLayerId && APP.map.getLayer(p.highlightLayerId)) {
                    // keep highlight
                } else if (!isCurrent && p.highlightLayerId && APP.map.getLayer(p.highlightLayerId)) {
                    APP.map.removeLayer(p.highlightLayerId);
                    p.highlightLayerId = null;
                }
            }
        } else if (p.lineLayerId && APP.map.getLayer(p.lineLayerId)) {
            // Hide line
            if (APP.map.getLayer(p.lineLayerId)) APP.map.removeLayer(p.lineLayerId);
            if (APP.map.getLayer(p.haloLayerId)) APP.map.removeLayer(p.haloLayerId);
            if (p.highlightLayerId && APP.map.getLayer(p.highlightLayerId)) APP.map.removeLayer(p.highlightLayerId);
            if (APP.map.getSource(p.lineSourceId)) APP.map.removeSource(p.lineSourceId);
            p.lineLayerId = p.haloLayerId = p.highlightLayerId = p.lineSourceId = null;
        }
    });
    
    renderInfoMarkers();
    updateHud();
}

function updateHud() {
    let idx = APP.navCurrentIndex;
    if (idx >= APP.navPoints.length) idx = APP.navPoints.length - 1;
    const t = APP.navPoints[idx];
    if (!t) return;
    
    $('hudCmdNum').innerHTML = `<svg width="44" height="44" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="${t.hex}" opacity="0.3"/><circle cx="10" cy="10" r="9" fill="none" stroke="${t.hex}" stroke-width="1.5"/><text x="10" y="10.5" font-size="8" font-family="Arial" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="#fff">${t.id}</text></svg>`;
    $('hudCmdTextInner').textContent = t.cmd;
    $('hudCmdTextInner').style.opacity = APP._audioCache.has(t.cmd) ? '1' : '0.35';
    $('hudCmdNum').onclick = (e) => {
        e.stopPropagation();
        const el = $('hudCmdNum');
        document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing'));
        APP._commentAudio.onended = null;
        el.classList.add('playing');
        playPointAudio(t, () => el.classList.remove('playing'));
    };
    $('hudCmd').onclick = openPointsList;
    
    if (APP.lastPos) {
        const d = getGeoDistance(APP.lastPos, [t.lat, t.lon]);
        let ad = Math.abs(APP.lastAz - t.az) % 360;
        if (ad > 180) ad = 360 - ad;
        $('hudCmdDist').innerHTML = formatDistance(d);
        $('hudCmdDist').classList.toggle('in-range', d < 50 && ad <= APP.navConfig.AZ_TOLERANCE);
    } else {
        $('hudCmdDist').innerHTML = '---';
        $('hudCmdDist').classList.remove('in-range');
    }
    
    const prevBtn = $('prevBtn'), nextBtn = $('nextBtn');
    prevBtn.disabled = (idx <= 0);
    nextBtn.disabled = (idx >= APP.navPoints.length - 1);
    prevBtn.onclick = () => { stopDrive(); APP._simMode = false; updateTiltState(); idx > 0 && setTarget(idx - 1); tempDisableAutoCenter(5000); };
    nextBtn.onclick = () => { if (idx < APP.navPoints.length - 1) { stopDrive(); APP._simMode = false; updateTiltState(); setTarget(idx + 1); tempDisableAutoCenter(5000); } };
    prevBtn.innerHTML = `<svg class="arrow-icon" viewBox="0 0 24 24" width="18" height="18"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>`;
    nextBtn.innerHTML = `<svg class="arrow-icon" viewBox="0 0 24 24" width="18" height="18"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>`;
    
    const playBtn = $('playBtn');
    if (playBtn) {
        const hasPath = t && t.pts && t.pts.length >= 2;
        playBtn.disabled = !hasPath;
    }
    
    $('commentText').textContent = t.comm || '';
    const hasComm = t.comm && t.comm.trim() !== '';
    $('commentText').style.display = hasComm && APP._commentEnabled ? 'block' : 'none';
    $('commentText').style.opacity = (t.comm && APP._audioCache.has(t.comm)) ? '1' : '0.35';
    
    // Previous command panel
    const prevHeader = $('hudPrevHeader');
    const prev = idx > 0 ? APP.navPoints[idx - 1] : null;
    if (prevHeader) {
        if (!prev) {
            prevHeader.style.display = 'none';
        } else {
            prevHeader.style.display = '';
            $('hudPrevCmdNum').innerHTML = `<svg width="44" height="44" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="${prev.hex}" opacity="0.3"/><circle cx="10" cy="10" r="9" fill="none" stroke="${prev.hex}" stroke-width="1.5"/><text x="10" y="10.5" font-size="8" font-family="Arial" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="#fff">${prev.id}</text></svg>`;
            $('hudPrevCmdTextInner').textContent = prev.cmd;
            $('hudPrevCmdTextInner').style.opacity = APP._audioCache.has(prev.cmd) ? '1' : '0.35';
            $('hudPrevCmdNum').onclick = (e) => {
                e.stopPropagation();
                const el = $('hudPrevCmdNum');
                document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing'));
                APP._commentAudio.onended = null;
                el.classList.add('playing');
                playPointAudio(prev, () => el.classList.remove('playing'));
            };
            $('hudPrevCmd').onclick = openPointsList;
            $('prevCommentText').textContent = prev.comm || '';
            const hasPrevComm = prev.comm && prev.comm.trim() !== '';
            $('prevCommentText').style.display = hasPrevComm && APP._commentEnabled ? 'block' : 'none';
            $('prevCommentText').style.opacity = (prev.comm && APP._audioCache.has(prev.comm)) ? '1' : '0.35';
        }
    }
}

function formatDistance(d) {
    if (d >= 1000) {
        const v = (d / 1000).toFixed(1);
        return `${v}<span class="dist-unit">км</span>`;
    }
    return `${Math.round(d)}<span class="dist-unit">м</span>`;
}

function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function openPointsList() {
    if (!$('pointsListModal').classList.contains('hidden')) { closePointsList(); return; }
    closeAllSheets();
    const wrap = $('pointsListWrap');
    if (!wrap || APP.navPoints.length === 0) return;
    wrap.innerHTML = APP.navPoints.map((p, i) => {
        const isCurrent = i === APP.navCurrentIndex;
        const isPrev = i < APP.navCurrentIndex;
        const dist = isCurrent && APP.lastPos && p.pts && p.pts[0]
            ? formatDistance(getGeoDistance(APP.lastPos, [p.pts[0][0], p.pts[0][1]]))
            : '';
        const cls = `pl-item${isCurrent ? ' pl-active' : ''}${isPrev ? ' pl-prev' : ''}`;
        const activeStyle = isCurrent ? ` style="border-color:#00FF00;border-width:2px"` : '';
        return `<div class="${cls}" data-idx="${i}">
            <div class="pl-item-row"${activeStyle}>
                <div class="pl-item-row-main">
                    <div class="pl-item-icon" data-play="${i}"><svg width="44" height="44" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="${p.hex}" opacity="0.3"/><circle cx="10" cy="10" r="9" fill="none" stroke="${p.hex}" stroke-width="1.5"/><text x="10" y="10.5" font-size="8" font-family="Arial" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="#fff">${p.id}</text></svg></div>
                    <div class="pl-item-text">${p.cmd}</div>
                    ${dist ? `<div class="pl-item-dist">${dist}</div>` : ''}
                </div>
                ${p.comm && p.comm.trim() ? `<div class="pl-comment">${escapeHtml(p.comm)}</div>` : ''}
            </div>
        </div>`;
    }).join('');
    $('pointsListModal').classList.remove('hidden');
    requestAnimationFrame(() => {
        const active = wrap.querySelector('.pl-active');
        if (active) active.scrollIntoView({ block: 'center', behavior: 'auto' });
    });
}

function closePointsList() {
    hideSheetModal('pointsListModal', 'pointsListSheet');
}

function updateHudDist(d, ad) {
    $('hudCmdDist').innerHTML = formatDistance(d);
    $('hudCmdDist').classList.toggle('in-range', d < 50 && ad <= APP.navConfig.AZ_TOLERANCE);
    updatePointsListDist();
}

function updatePointsListDist() {
    const modal = $('pointsListModal');
    if (!modal || modal.classList.contains('hidden')) return;
    const activeItem = modal.querySelector('.pl-active');
    if (!activeItem || !APP.lastPos || APP.navCurrentIndex < 0) return;
    const t = APP.navPoints[APP.navCurrentIndex];
    if (!t) return;
    const d = getGeoDistance(APP.lastPos, [t.lat, t.lon]);
    const distEl = activeItem.querySelector('.pl-item-dist');
    if (distEl) distEl.innerHTML = formatDistance(d);
}

function updateCurrentPointHud() {
    if (APP.lastPos && APP.navPoints[APP.navCurrentIndex]) {
        const t = APP.navPoints[APP.navCurrentIndex];
        const d = getGeoDistance(APP.lastPos, [t.lat, t.lon]);
        let ad = Math.abs(APP.lastAz - t.az) % 360;
        if (ad > 180) ad = 360 - ad;
        $('hudCmdDist').innerHTML = formatDistance(d);
        $('hudCmdDist').classList.toggle('in-range', d < 50 && ad <= APP.navConfig.AZ_TOLERANCE);
    }
}

function setTarget(i) {
    APP.navCurrentIndex = i;
    renderRoutePoints();
    updateHud();
    updateCurrentPointHud();
    fitMapToCurrentTarget();
    updatePointsListActive();
}

function updatePointsListActive() {
    const modal = $('pointsListModal');
    if (!modal || modal.classList.contains('hidden')) return;
    modal.querySelectorAll('.pl-item').forEach(el => {
        const idx = parseInt(el.dataset.idx);
        const isCurrent = idx === APP.navCurrentIndex;
        el.classList.toggle('pl-active', isCurrent);
        el.classList.toggle('pl-prev', idx < APP.navCurrentIndex);
        
        const row = el.querySelector('.pl-item-row');
        if (row) row.style.cssText = isCurrent ? 'border-color:#00FF00;border-width:2px' : '';
        
        const pt = APP.navPoints[idx];
        let distEl = el.querySelector('.pl-item-dist');
        if (isCurrent && APP.lastPos && pt && pt.pts && pt.pts[0]) {
            const distText = formatDistance(getGeoDistance(APP.lastPos, [pt.pts[0][0], pt.pts[0][1]]));
            if (distEl) distEl.innerHTML = distText;
        }
    });
}

function fitMapToCurrentTarget() {
    if (!APP.map || !APP.lastPos) return;
    const t = APP.navPoints[APP.navCurrentIndex];
    if (!t) return;
    const bearing = APP.lastAz || 0;
    APP.map.easeTo({
        center: [APP.lastPos[1], APP.lastPos[0]],
        bearing: bearing,
        pitch: APP.lastTilt,
        zoom: 18,
        duration: 500
    });
}

function navCheckTriggers() {
    if (APP.navCurrentIndex < 0 || APP.navCurrentIndex >= APP.navPoints.length) return;
    const t = APP.navPoints[APP.navCurrentIndex];
    if (!t) return;
    if (!APP.lastPos) return;
    const d = getGeoDistance(APP.lastPos, [t.lat, t.lon]);
    let ad = Math.abs(APP.lastAz - t.az) % 360;
    if (ad > 180) ad = 360 - ad;
    updateHudDist(d, ad);
    if (d < APP.navConfig.TRIGGER_DIST && ad <= APP.navConfig.AZ_TOLERANCE && APP.currentSpeed >= APP.navConfig.SPEED_THRESHOLD) {
        triggerPoint(t);
    }
}

function triggerPoint(t) {
    if (t._triggered) return;
    t._triggered = true;
    playPointAudio(t);
    APP.navCurrentIndex++;
    if (APP.navCurrentIndex >= APP.navPoints.length) {
        showToast('Маршрут завершён', 'success', 3000);
        stopDrive();
        APP._simMode = false;
        updateTiltState();
    } else {
        renderRoutePoints();
        updateHud();
        fitMapToCurrentTarget();
        updatePointsListActive();
        const next = APP.navPoints[APP.navCurrentIndex];
        if (next && next.pts && next.pts.length >= 2) {
            playPointAudio(next);
        }
    }
}

async function playPointAudio(point, onEnd) {
    if (!point) return;
    const seq = ++APP._navSeq;
    const cmd = point.cmd;
    const comm = point.comm;
    
    if (cmd) {
        APP._audioPending++;
        try {
            await playCommand(cmd);
            if (APP._navSeq !== seq) return;
        } finally {
            APP._audioPending--;
        }
    }
    
    if (APP._commentEnabled && comm) {
        APP._audioPending++;
        try {
            await playComment(comm);
            if (APP._navSeq !== seq) return;
        } finally {
            APP._audioPending--;
        }
    }
    
    if (onEnd) onEnd();
}

async function playCommand(text) {
    if (!text) return;
    const cached = APP._audioCache.get(text);
    if (cached) {
        APP.navAudio.src = cached;
        return APP.navAudio.play().catch(() => {});
    }
    try {
        const res = await fetch(TTS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ batches: [{ voice_type: 'command', texts: [text] }] })
        });
        const data = await res.json();
        if (data.audios && data.audios[text]) {
            const b64 = data.audios[text];
            const url = `data:audio/mp3;base64,${b64}`;
            APP._audioCache.set(text, url);
            APP.navAudio.src = url;
            return APP.navAudio.play().catch(() => {});
        }
    } catch (e) {
        console.warn('TTS command failed:', e);
    }
}

async function playComment(text) {
    if (!text) return;
    const cached = APP._audioCache.get(text);
    if (cached) {
        APP._commentAudio.src = cached;
        return APP._commentAudio.play().catch(() => {});
    }
    try {
        const res = await fetch(TTS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ batches: [{ voice_type: 'comment', texts: [text] }] })
        });
        const data = await res.json();
        if (data.audios && data.audios[text]) {
            const b64 = data.audios[text];
            const url = `data:audio/mp3;base64,${b64}`;
            APP._audioCache.set(text, url);
            APP._commentAudio.src = url;
            return APP._commentAudio.play().catch(() => {});
        }
    } catch (e) {
        console.warn('TTS comment failed:', e);
    }
}

// --- Drive Simulation ---
function stopDrive() {
    APP._driveActive = false;
    APP._drivePaused = false;
    APP._driveShowFrom = -1;
    if (APP._driveRaf) { cancelAnimationFrame(APP._driveRaf); APP._driveRaf = null; }
    if (APP._driveMarker) { APP._driveMarker.remove(); APP._driveMarker = null; }
    if (APP._prevAnim) { cancelAnimationFrame(APP._prevAnim); APP._prevAnim = null; }
    APP.navAudio.pause();
    APP._commentAudio.pause();
    APP.navAudio.onended = null;
    APP._commentAudio.onended = null;
    document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing'));
    const pb = $('playBtn');
    if (pb) {
        pb.classList.remove('active');
        pb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    }
}

function driveAlongPath(fromIdx) {
    const p = APP.navPoints[fromIdx];
    if (!p || !p.pts || p.pts.length < 2) return;
    stopDrive();
    
    const path = p.pts;
    if (!p._dists) {
        p._dists = [0];
        for (let i = 1; i < path.length; i++) {
            p._dists[i] = p._dists[i - 1] + getGeoDistance(path[i - 1], path[i]);
        }
    }
    const dists = p._dists;
    const totalDist = dists[path.length - 1];
    if (totalDist < 0.1) return;
    
    APP._driveShowFrom = fromIdx;
    APP._driveActive = true;
    const resume = APP._drivePauseData;
    APP._drivePauseData = null;
    APP._drivePaused = false;
    let simulatedDist = resume ? resume.dist : 0;
    let currentSeg = resume ? resume.seg : 0;
    let currentAz = resume ? resume.az : calcAzimuth(path[0], path[1]);
    let lastFrameTime = performance.now();
    let _lastSeg = resume ? resume.lastSeg : 0;
    
    // Create drive marker
    const driveEl = document.createElement('div');
    driveEl.style.cssText = 'width:30px;height:30px;transform:translate(-50%,-50%);pointer-events:none;';
    driveEl.innerHTML = `<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="#00FF00" opacity="0.9"/><circle cx="15" cy="15" r="12" fill="none" stroke="#fff" stroke-width="2"/></svg>`;
    APP._driveMarker = new maplibregl.Marker({ element: driveEl, anchor: 'center' })
        .setLngLat([path[0][1], path[0][0]])
        .addTo(APP.map);
    
    if (resume) {
        const mp = getPos(simulatedDist);
        APP._driveMarker.setLngLat([mp.lon, mp.lat]);
        const nextIdx = resume.seg + 1;
        if (nextIdx < path.length) {
            setMapLocation([path[nextIdx][0], path[nextIdx][1]], undefined, currentAz, 0);
        }
    } else {
        const firstDur = (dists[1] - dists[0]) / (APP._driveSpeed / 3.6) * 1000;
        setMapLocation([path[1][0], path[1][1]], 19, currentAz, Math.max(firstDur, 500));
    }
    
    function getPos(dist) {
        if (dist >= totalDist) {
            const last = path[path.length - 1];
            return { lat: last[0], lon: last[1], seg: path.length - 2 };
        }
        while (_lastSeg < dists.length - 1 && dists[_lastSeg + 1] < dist) _lastSeg++;
        const t = dists[_lastSeg + 1] > dists[_lastSeg] ? (dist - dists[_lastSeg]) / (dists[_lastSeg + 1] - dists[_lastSeg]) : 0;
        return {
            lat: path[_lastSeg][0] + (path[_lastSeg + 1][0] - path[_lastSeg][0]) * t,
            lon: path[_lastSeg][1] + (path[_lastSeg + 1][1] - path[_lastSeg][1]) * t,
            seg: _lastSeg
        };
    }
    
    function frame(time) {
        if (!APP._driveActive) return;
        if (APP._drivePaused) {
            APP._drivePauseData = { dist: simulatedDist, seg: currentSeg, az: currentAz, lastSeg: _lastSeg, idx: fromIdx };
            APP._driveRaf = null;
            return;
        }
        const dt = (time - lastFrameTime) / 1000;
        lastFrameTime = time;
        simulatedDist += (APP._driveSpeed / 3.6) * dt;
        
        if (simulatedDist >= totalDist) {
            const lastPt = path[path.length - 1];
            const prevPt = path.length >= 2 ? path[path.length - 2] : lastPt;
            currentAz = calcAzimuth(prevPt, lastPt);
            APP._driveMarker.setLngLat([lastPt[1], lastPt[0]]);
            stopDrive();
            const nextIdx = fromIdx + 1;
            if (nextIdx < APP.navPoints.length) {
                const np = APP.navPoints[nextIdx];
                if (np && np.pts && np.pts.length >= 2) {
                    APP.navCurrentIndex = nextIdx;
                    APP._driveShowFrom = nextIdx;
                    renderRoutePoints();
                    updateHud();
                    updatePointsListActive();
                    playPointAudio(np, () => {
                        if (APP._driveShowFrom >= 0 && !APP._driveActive) driveAlongPath(nextIdx);
                    });
                    const pb = $('playBtn');
                    if (pb) { pb.classList.add('active'); pb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; }
                }
            }
            if (nextIdx >= APP.navPoints.length ||
                !APP.navPoints[nextIdx] ||
                !APP.navPoints[nextIdx].pts ||
                APP.navPoints[nextIdx].pts.length < 2) {
                APP._simMode = false;
                updateTiltState();
            }
            return;
        }
        
        const mp = getPos(simulatedDist);
        
        if (mp.seg !== currentSeg) {
            currentSeg = mp.seg;
            const nextIdx = mp.seg + 1;
            if (nextIdx < path.length) {
                const d = (dists[nextIdx] - dists[mp.seg]) / (APP._driveSpeed / 3.6) * 1000;
                currentAz = calcAzimuth(path[mp.seg], path[nextIdx]);
                setMapLocation([path[nextIdx][0], path[nextIdx][1]], undefined, currentAz, Math.max(d, 500));
            }
        }
        APP._driveMarker.setLngLat([mp.lon, mp.lat]);
        APP._driveRaf = requestAnimationFrame(frame);
    }
    
    APP._driveRaf = requestAnimationFrame(frame);
    const pb = $('playBtn');
    if (pb) { pb.classList.add('active'); pb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; }
}

// --- MenuModule callback ---
function onRouteLoaded(routeData) {
    if (!routeData) return;
    clearRoute();
    
    APP.navPoints = routeData.map((p, i) => ({
        ...p,
        id: String(i + 1),
        lat: p.pts[0][0],
        lon: p.pts[0][1],
        az: p.az || calcAzimuth(p.pts[0], p.pts[1]),
        _triggered: false
    }));
    
    // Calculate total route distance
    APP._routeTotalDistance = 0;
    APP.navPoints.forEach(p => {
        if (p.pts && p.pts.length >= 2) {
            for (let i = 1; i < p.pts.length; i++) {
                APP._routeTotalDistance += getGeoDistance(p.pts[i-1], p.pts[i]);
            }
        }
    });
    
    renderRoutePoints();
    updateHud();
    updateRouteNameDisplay();
    $('hud').classList.add('active');
    
    // Fit map to first point
    if (APP.navPoints.length > 0) {
        const first = APP.navPoints[0];
        setMapLocation([first.lat, first.lon], 18, first.az, 500);
    }
    
    // Send report
    sendRouteReport(routeData);
}

function sendRouteReport(routeData) {
    if (typeof REPORT === 'undefined') return;
    try {
        const routeName = MenuModule.currentRoute;
        const creatorId = routeName ? routeName.split('-')[0] : '';
        REPORT.send({
            user_id: creatorId,
            m_val: routeName ? routeName.split('-').slice(1).join('-') : '',
            report_type: 'navigator',
            route_name: routeName
        });
    } catch (e) {
        console.warn('Report send failed:', e);
    }
}

// --- Event Listeners ---
document.addEventListener('DOMContentLoaded', () => {
    // Settings buttons
    $('settingsBtn').addEventListener('click', openSettings);
    $('locateBtn').addEventListener('click', toggleAutoCenter);
    $('instructionBtn').addEventListener('click', () => {
        const modal = $('instructionModal');
        if (modal) modal.classList.remove('hidden');
    });
    
    // Settings form
    $('triggerShockToggle').addEventListener('change', updateShockDisplay);
    $('triggerShock').addEventListener('input', updateShockDisplay);
    $('triggerShockToggle, triggerShock, triggerShockPhrase').forEach(el => {
        if (el) el.addEventListener('change', applyShockConfig);
    });
    $('triggerSpeedAlertToggle, triggerSpeedAlert, triggerSpeedAlertPhrase').forEach(el => {
        if (el) el.addEventListener('change', applySpeedConfig);
    });
    $('commentToggle').addEventListener('change', applyCommentConfig);
    
    // Map type buttons
    $('schemeBtn').addEventListener('click', () => setMapType('scheme'));
    $('satBtn').addEventListener('click', () => setMapType('satellite'));
    
    // Play button
    $('playBtn').addEventListener('click', () => {
        if (APP._driveActive) {
            stopDrive();
            APP._simMode = false;
            updateTiltState();
        } else {
            if (APP.navCurrentIndex >= 0 && APP.navPoints[APP.navCurrentIndex]) {
                APP._simMode = true;
                updateTiltState();
                driveAlongPath(APP.navCurrentIndex);
            }
        }
    });
    
    // Prev/Next buttons
    $('prevBtn').addEventListener('click', () => {
        if (APP.navCurrentIndex > 0) {
            stopDrive();
            APP._simMode = false;
            updateTiltState();
            setTarget(APP.navCurrentIndex - 1);
            tempDisableAutoCenter(5000);
        }
    });
    $('nextBtn').addEventListener('click', () => {
        if (APP.navCurrentIndex < APP.navPoints.length - 1) {
            stopDrive();
            APP._simMode = false;
            updateTiltState();
            setTarget(APP.navCurrentIndex + 1);
            tempDisableAutoCenter(5000);
        }
    });
    
    // HUD click to open points list
    $('hudCmd').addEventListener('click', openPointsList);
    $('hudPrevCmd').addEventListener('click', openPointsList);
    
    // Initialize MapModule
    if (typeof MenuModule !== 'undefined') {
        MenuModule.init(onRouteLoaded);
    }
    
    // Initialize Map
    initMap().catch(e => {
        console.error('Map init failed:', e);
        showToast('Ошибка загрузки карты: ' + e.message, 'error', 8000);
        const wsEl = $('loading');
        if (wsEl) wsEl.style.display = 'none';
    });
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch(e.key) {
        case 'ArrowLeft': $('prevBtn').click(); break;
        case 'ArrowRight': $('nextBtn').click(); break;
        case ' ': case 'Enter': $('playBtn').click(); e.preventDefault(); break;
        case 'Escape': closeAllSheets(); break;
    }
});

// Prevent zoom on double tap
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
</script>
