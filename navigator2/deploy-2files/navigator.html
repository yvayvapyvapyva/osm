    <style>/* ============================================
   Общие переменные и базовые стили
   ============================================ */
:root {
    --bg: #000000;
    --glass-bg: rgba(15, 15, 15, 0.75);
    --glass-bg-heavy: rgba(12, 12, 12, 0.82);
    --glass-border: rgba(255, 255, 255, 0.12);
    --accent-green: #30D158;
    --accent-green-glow: rgba(48, 209, 88, 0.35);
    --text-primary: #ffffff;
    --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.3);
    --shadow-medium: 0 12px 40px rgba(0, 0, 0, 0.4);
    --radius-sm: 14px;
    --radius-full: 100px;

    /* Верхняя навигация */
    --nav-gap: 10px;

    /* Полноэкранные разделы: контент начинается под таб-баром */
    --screen-top: calc(48px + var(--nav-gap) + env(safe-area-inset-top) + 10px);
}

* {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
    overflow: hidden;
    background: var(--bg);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
}

#wakeLockVideo {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0.001;
    pointer-events: none;
}

/* ============================================
   Утилиты
   ============================================ */
.marker-img { display: block; }

/* Стрелка текущего положения — лежит в плоскости карты и наклоняется вместе с ней */
.user-location-marker {
    width: 54px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transform-origin: 50% 50%;
    filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.55)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
    will-change: transform;
}

.user-location-marker svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
}
.trigger-input { width:100%;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,0.06);color:#fff;font-size:14px;outline:none;box-sizing:border-box;border:none; }
.trigger-pad { padding:4px 0 6px; }
.trigger-input-num { width:100%;padding:10px 14px;border-radius:10px;border:none;background:rgba(255,255,255,0.06);color:#fff;font-size:16px;font-weight:600;outline:none;box-sizing:border-box; }
.speed-input-inline { width:60px !important;padding:10px 8px !important;text-align:center;font-size:14px !important;border-radius:8px !important;border:none !important;flex-shrink:0; }

/* ============================================
   Стили карты (общие)
   ============================================ */
#map {
    position: absolute;
    inset: 0;
    z-index: 1;
}

/* ============================================
   Загрузка
   ============================================ */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    z-index: 13000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 600;
    text-align: center;
    padding: 20px;
}

.loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Инструкция — полноэкранный раздел; таб-бар остаётся поверх него. */
#instructionModal { z-index: 11000; }

#instructionModal .icon-row,
#instructionModal .icon-row-v {
    background: rgba(255,255,255,0.10);
}

.instruction-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 8px 12px 12px;
}

.instruction-loading {
    text-align: center;
    padding: 40px 20px;
    color: #8b8f99;
    font-size: 15px;
}

#loadingSpinner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 13000;
    display: none;
    align-items: center;
    justify-content: center;
}

#loadingSpinner.active {
    display: flex;
}

.spinner-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

.spinner-ring {
    width: 48px;
    height: 48px;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: #30D158;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

.spinner-text {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.1px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ============================================
   Круглые кнопки
   ============================================ */
.circle-btn {
    position: absolute;
    z-index: 9005;
    background: var(--glass-bg);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 0.5px solid var(--glass-border);
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-soft), inset 0 0.5px 0 rgba(255, 255, 255, 0.1);
    touch-action: manipulation;
}

.circle-btn svg {
    fill: currentColor;
    width: 22px;
    height: 22px;
}

.circle-btn:active {
    background: rgba(30, 30, 30, 0.5);
}

.circle-btn.active {
    background: rgba(48, 209, 88, 0.5);
    border-color: var(--accent-green);
    box-shadow: var(--shadow-soft), 0 0 20px var(--accent-green-glow), inset 0 0.5px 0 rgba(255, 255, 255, 0.15);
}

#locateBtn {
    top: calc(76px + env(safe-area-inset-top));
    right: 12px;
}

#playBtn.active {
    background: rgba(255,59,48,0.2);
}

#playBtn.active svg {
    fill: #FF453A;
}

#routeNameDisplay {
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8), 0 0 8px rgba(0, 0, 0, 0.4);
    white-space: normal;
    word-break: break-word;
    pointer-events: none;
    display: none;
    text-align: center;
    line-height: 1.3;
    opacity: 0.6;
}

/* ============================================
   Верхняя центральная панель (меню + спидометр)
   ============================================ */
#topCenterControls {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 9005;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

/* ============================================
   Панель телеметрии (спидометр)
   ============================================ */
#telemetryPanel {
    position: fixed;
    top: calc(140px + env(safe-area-inset-top));
    right: 12px;
    z-index: 9005;
    background: var(--glass-bg);
    border-radius: 50%;
    border: 0.5px solid var(--glass-border);
    cursor: pointer;
    box-shadow: var(--shadow-soft), inset 0 0.5px 0 rgba(255, 255, 255, 0.1);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    width: 52px;
    height: 52px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 8px;
}

#telemetryPanel:active {
    transform: scale(0.92);
    background: rgba(30, 30, 30, 0.5);
}

.tel-item {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.tel-label {
    font-size: 8px;
    color: #ffffff;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8), 0 0 8px rgba(0, 0, 0, 0.4);
}

.tel-value {
    font-size: 16px;
    font-weight: 800;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8), 0 0 8px rgba(0, 0, 0, 0.4);
}

/* ============================================
   HUD (панель навигации)
   ============================================ */
#hud {
    position: absolute;
    bottom: 8px;
    left: 12px;
    right: 12px;
    z-index: 9000;
    display: none;
    flex-direction: column;
    gap: 8px;
    pointer-events: auto;
    box-sizing: border-box;
}

#hud.active {
    display: flex;
}

.hud-header {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* Панель предыдущей команды — та же вёрстка, что и основная, но полупрозрачная */
.hud-prev-header {
    width: 100%;
}

.hud-cmd.hud-prev {
    opacity: 0.55;
    width: 100%;
}

#hudPrevCmdNum {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    border-radius: 50%;
    transition: transform 0.1s, opacity 0.1s;
    -webkit-tap-highlight-color: transparent;
}

#hudPrevCmdNum:active {
    transform: scale(0.85);
    opacity: 0.7;
}

#hudPrevCmdNum.playing {
    animation: hud-pulse 0.4s ease-in-out infinite;
}

#hudPrevCmdText {
    flex: 1;
    display: flex;
    align-items: center;
    min-width: 0;
    padding: 4px 0;
}

#hudPrevCmdTextInner {
    display: block;
    text-align: left;
}

#prevCommentText {
    font-size: 11px;
    line-height: 1.3;
    color: rgba(255,255,255,0.8);
    white-space: pre-wrap;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    display: none;
    border: 1px solid rgba(255,69,58,0.5);
    border-radius: 4px;
    padding: 6px 12px;
    margin: 2px 2px 6px;
    box-sizing: border-box;
}

.hud-cmd {
    font-size: 18px;
    font-weight: 700;
    flex: 1;
    letter-spacing: -0.2px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    background: var(--glass-bg);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2), inset 0 0.5px 0 rgba(255, 255, 255, 0.15);
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.hud-cmd-row {
    display: flex;
    align-items: center;
    padding: 2px 0;
    gap: 10px;
    min-height: 52px;
}

#hudCmdNum {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    border-radius: 50%;
    transition: transform 0.1s, opacity 0.1s;
    -webkit-tap-highlight-color: transparent;
}

#hudCmdNum:active {
    transform: scale(0.85);
    opacity: 0.7;
}

#hudCmdNum.playing {
    animation: hud-pulse 0.4s ease-in-out infinite;
}

@keyframes hud-pulse {
    0% { transform: scale(0.92); opacity: 0.85; }
    50% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.92); opacity: 0.85; }
}

#hudCmdText {
    flex: 1;
    display: flex;
    align-items: center;
    min-width: 0;
    padding: 4px 0;
}

#hudCmdTextInner {
    display: block;
    text-align: left;
}

.hud-actions {
    width: 100%;
    display: flex;
    align-items: center;
    touch-action: manipulation;
}

#hudCmdDist {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.2;
    flex-shrink: 0;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 6px 10px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.08);
    font-size: 15px;
}

#hudCmdDist .dist-unit {
    font-size: 9px;
    font-weight: 600;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

#hudCmdDist.in-range {
    border-color: var(--accent-green);
    background: rgba(48, 209, 88, 0.12);
    color: var(--accent-green);
    text-shadow: 0 0 12px var(--accent-green-glow), 0 1px 2px rgba(0, 0, 0, 0.8);
}

/* ============================================
   Навигационная пилюля (назад, симуляция, вперёд)
   ============================================ */
.nav-pill {
    display: flex;
    width: 100%;
    height: 48px;
    border-radius: 100px;
    background: rgba(15, 15, 15, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0.5px 0 rgba(255, 255, 255, 0.1);
    overflow: hidden;
    flex-shrink: 0;
}

.nav-pill-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: #ffffff;
    cursor: pointer;
    height: 100%;
    padding: 0;
    transition: background 0.15s;
    touch-action: manipulation;
}

.nav-pill-btn svg {
    fill: currentColor;
    width: 22px;
    height: 22px;
}

.nav-pill-divider {
    width: 1px;
    background: rgba(255, 255, 255, 0.4);
    flex-shrink: 0;
}

.nav-pill-btn:active {
    background: rgba(255, 255, 255, 0.1);
}

.nav-pill-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

#playBtn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* ============================================
   Индикатор датчика удара (шок-бар)
   ============================================ */
#shockBar {
    display: none;
    position: fixed;
    top: calc(4px + env(safe-area-inset-top));
    left: 0;
    right: 0;
    z-index: 9002;
    height: 4px;
    background: transparent;
    pointer-events: none;
}
#shockBarFill {
    height: 100%;
    width: 0%;
    background: #30D158;
}
#shockBarValue {
    position: absolute;
    top: calc(50% - 2px);
    left: 12px;
    transform: translateY(-50%);
    font-size: 10px;
    font-weight: 800;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.3px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.6);
    line-height: 1;
}

/* ============================================
   Комментарий внутри hud-cmd
   ============================================ */
#commentText {
    font-size: 11px;
    line-height: 1.3;
    color: rgba(255,255,255,0.8);
    white-space: pre-wrap;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    display: none;
    border: 1px solid rgba(255,69,58,0.5);
    border-radius: 4px;
    padding: 6px 12px;
    margin: 2px 2px 6px;
    box-sizing: border-box;
}

/* ============================================
   Toast уведомления
   ============================================ */
#toast {
    position: fixed;
    top: calc(90px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--glass-bg-heavy);
    color: var(--text-primary);
    padding: 14px 24px;
    border-radius: var(--radius-full);
    font-size: 15px;
    z-index: 16000;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    border: 0.5px solid var(--glass-border);
    font-weight: 600;
    max-width: 85vw;
    white-space: pre-wrap;
    text-align: center;
    line-height: 1.4;
    pointer-events: none;
    box-shadow: var(--shadow-medium), inset 0 0.5px 0 rgba(255, 255, 255, 0.1);
    letter-spacing: -0.1px;
}

#toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}

#toast.success {
    background: rgba(48, 209, 88, 0.85);
    border-color: rgba(48, 209, 88, 0.5);
}

#toast.error {
    background: rgba(255, 69, 58, 0.85);
    border-color: rgba(255, 69, 58, 0.5);
}

#toast.info {
    background: var(--glass-bg-heavy);
}

.routes-breadcrumb {

.routes-breadcrumb-separator {

.routes-search-clear svg {

.routes-list {

.routes-list::after {

.routes-results-meta {

.routes-folder-list {

.routes-folder-row {

    gap: 10px;

    min-height: 54px;
    padding: 7px 12px;

.routes-folder-row:active {

}

.routes-folder-icon {

.routes-folder-name {

.routes-folder-count {

.routes-folder-chevron {

}

.route-row {
    display: flex;
    align-items: center;
    gap: 8px;

    min-height: 106px;
    padding: 5px 8px 5px 5px;

}

.route-row:active {

}

.route-row.is-active {

.route-preview {

.route-preview-image {
    display: block;
    width: 100%;

.route-preview.is-loading::after {

.route-preview.is-empty::after {

.route-row-main {

.route-row-badge {

.route-row-details {

.route-row-meta {

}

.route-row-stats {

.route-row-tail {

    width: 20px;
    height: 20px;

}

.route-row.is-active .route-row-tail {

.route-row-tail svg {

.routes-empty {

.routes-empty-title {

}

.routes-empty-hint {

    font-size: 13px;
}

@media (prefers-reduced-motion: reduce) {
    .route-preview.is-loading::after {
        animation: none;
    }
}

/* ============================================
   Модальное окно настроек навигатора

}

    min-height: 0;
}
.settings-body::after {
    content: '';
    display: block;

    pointer-events: none;
    flex-shrink: 0;
}

.settings-label {
    font-size: 16px;

}

.settings-group {

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.settings-group + .settings-group {

.map-style-grid {

.map-style-btn {

    color: #fff;

    line-height: 1.25;

.map-style-btn:active {

}

.map-style-btn.active {

/* ---- Trigger settings ---- */
.trigger-setting-row {

    flex-direction: column;
}

.trigger-setting-header {

    gap: 14px;

.trigger-setting-row .label {

.trigger-setting-row .value {

.trigger-setting-row input[type="range"] {

.trigger-setting-row input[type="range"]::-webkit-slider-runnable-track {

.trigger-setting-row input[type="range"]::-webkit-slider-thumb {

.trigger-setting-row input[type="range"]::-moz-range-track {

.trigger-setting-row input[type="range"]::-moz-range-thumb {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #30D158;
    border: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* ============================================
   Полноэкранные разделы (модалки в стиле gdebenz.ru)
   ============================================ */
.screen-modal {
    position: fixed;
    inset: 0;
    z-index: 11000;
    background: rgba(15, 15, 15, 0.45);
    backdrop-filter: blur(4px);
}

.screen-modal.hidden {
    display: none;
}

.screen-panel {
    position: absolute;
    top: var(--screen-top);
    bottom: env(safe-area-inset-bottom);
    left: 0;
    right: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0;
    padding-top: 0;
    background: #0f0f0f;
    box-sizing: border-box;
    overflow: hidden;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -24px 48px rgba(0, 0, 0, 0.55), inset 0 0.5px 0 rgba(255, 255, 255, 0.06);
}

.screen-modal:not(.hidden) .screen-panel {
    animation: screen-in 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes screen-in {
    from {
        opacity: 0;
        transform: translateY(100%);
    }
    to {
        opacity: 1;
        transform: none;
    }
}

.screen-head {
    position: relative;
    z-index: 1;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 52px;
    padding: 10px 12px 8px 16px;
    box-sizing: border-box;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(15, 15, 15, 0.92);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
}

.screen-title {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.2px;
    line-height: 1.2;
    color: #F4F7FA;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.screen-close {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.7);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
    -webkit-tap-highlight-color: transparent;
}

.screen-close svg {
    display: block;
    width: 20px;
    height: 20px;
}

.screen-close:active {
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    transform: scale(0.94);
}

.screen-close:focus-visible {
    outline: 2px solid rgba(52, 199, 89, 0.7);
    outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
    .screen-modal:not(.hidden) .screen-panel {
        animation: none;
    }
}

#pointsListWrap {
    flex: 1;
    overflow-y: auto;
    padding: 8px 8px 0;
    -webkit-overflow-scrolling: touch;
}
#pointsListWrap::after {
    content: '';
    display: block;
    height: 8px;
    pointer-events: none;
}

.pl-item {
    cursor: pointer;
    touch-action: manipulation;
    padding: 4px 0;
}

.pl-item:active {
    opacity: 0.8;
}

.pl-item-row {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding: 0 4px;
    min-height: 52px;
    background: var(--glass-bg);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: var(--radius-sm);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2), inset 0 0.5px 0 rgba(255, 255, 255, 0.15);
    box-sizing: border-box;
}

.pl-item-row-main {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 52px;
    padding: 2px 0;
}

.pl-item.pl-active .pl-item-row {
    border-width: 2px;
    box-shadow: 0 0 12px rgba(0,255,0,0.15), 0 2px 8px rgba(0, 0, 0, 0.2), inset 0 0.5px 0 rgba(255, 255, 255, 0.15);
}

.pl-item-icon {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 50%;
    transition: transform 0.1s, opacity 0.1s;
    -webkit-tap-highlight-color: transparent;
}

.pl-item-icon:active {
    transform: scale(0.85);
    opacity: 0.7;
}

.pl-item-icon.playing {
    animation: hud-pulse 0.4s ease-in-out infinite;
}

.pl-prev {
    opacity: 0.45;
}

.pl-item-text {
    flex: 1;
    font-size: 18px;
    font-weight: 700;
    min-width: 0;
    word-break: break-word;
    line-height: 1.3;
    padding: 4px 0;
}

.pl-item-dist {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.2;
    flex-shrink: 0;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 6px 10px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.08);
    font-size: 15px;
}

.pl-item-dist .dist-unit {
    font-size: 9px;
    font-weight: 600;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.pl-comment {
    font-size: 11px;
    line-height: 1.3;
    color: rgba(255,255,255,0.8);
    white-space: pre-wrap;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    border: 1px solid rgba(255,69,58,0.5);
    border-radius: 4px;
    padding: 4px 8px;
    margin: 4px 6px 6px;
    box-sizing: border-box;
}

   ============================================ */
/* Атрибуция карты в правом нижнем углу (как на gdebenz.ru) */
.maplibregl-ctrl-bottom-right {
    bottom: calc(12px + env(safe-area-inset-bottom));
    top: auto;
    right: 12px;
    left: auto;
}

.top-actions {
    position: fixed;
    left: 50%;
    top: calc(var(--nav-gap) + env(safe-area-inset-top));
    transform: translateX(-50%);
    z-index: 12000;
    display: flex;
    gap: 8px;
    padding: 0;
    box-sizing: border-box;
    pointer-events: auto;
    max-width: min(340px, calc(100% - 24px));
    width: max-content;
}

.top-action-btn {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-width: 0;
    padding: 0;
    margin: 0;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    background: rgba(15, 19, 24, 0.86);
    color: rgba(235, 240, 245, 0.58);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1px;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    width: 96px;
    flex: 0 0 auto;
    transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease, transform 0.12s ease;
    height: 48px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    backdrop-filter: blur(20px) saturate(140%);
}

.top-action-btn svg {
    display: block;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
}

.top-action-btn.active {
    color: #F4FBF6;
    border-color: rgba(52, 199, 89, 0.45);
    background: rgba(15, 19, 24, 0.95);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(52, 199, 89, 0.25);
}

.top-action-btn.active svg {
    color: #34C759;
}

.top-action-btn:active {
    transform: scale(0.94);
    background: rgba(30, 30, 30, 0.5);
}

.top-action-btn:focus-visible {
    outline: 2px solid rgba(52, 199, 89, 0.7);
    outline-offset: -2px;
}

@media (max-height: 520px) {
    .top-action-btn svg {
        width: 20px;
        height: 20px;
    }
}

@media (max-width: 380px) {
    .top-action-btn {
        font-size: 10px;
        letter-spacing: 0;
    }

    .top-action-btn svg {
        width: 20px;
        height: 20px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .top-action-btn {
        transition: none;
    }
}
