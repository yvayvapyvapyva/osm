<div id="navSettingsModal" class="hidden screen-modal">
    <div class="screen-panel" id="navSettingsScreen">
        <header class="screen-head">
            <h1 class="screen-title">Настройки</h1>
            <button type="button" class="screen-close" onclick="closeSettings()" aria-label="Закрыть">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>

        <div class="settings-body">
            <div class="settings-group">
                <div class="settings-label">Оформление</div>

                        </label>

                        <label class="toggle-switch">
                            <input type="checkbox" class="toggle-input" id="triggerShockToggle" onchange="updateShockDisplay();applyShockConfig()">
                            <span class="toggle-slider"></span>
                        </label>
