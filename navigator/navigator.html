<script>
// Грузим Telegram/VK SDK асинхронно с таймаутом 10с.
// Если telegram.org / unpkg.com заблокированы или недоступны — не блокируем загрузку приложения.
(function (g) {
  var finished = false, pending = 0, cbs = [];
  function finish() {
    if (finished) return;
    finished = true;
    var list = cbs.splice(0);
    for (var i = 0; i < list.length; i++) { try { list[i](); } catch (e) {} }
  }
  function tryLoad(url) {
    pending++;
    var settled = false;
    var controller = null;
    var timeout = null;
    function settle() {
      if (settled) return; settled = true;
      if (timeout) { clearTimeout(timeout); timeout = null; }
      if (controller) { try { controller.abort(); } catch (e) {} controller = null; }
      if (--pending === 0) finish();
    }
    timeout = setTimeout(settle, 10000);
    if (typeof fetch === 'function' && typeof AbortController !== 'undefined') {
      // Реально отменяем запрос через 10с, чтобы браузер не крутил спиннер
      controller = new AbortController();
      fetch(url, { signal: controller.signal })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (code) {
          if (settled) return;
          try {
            var s = document.createElement('script');
            s.text = code;
            (document.head || document.documentElement).appendChild(s);
          } catch (e) {}
          settle();
        })
        .catch(settle);
    } else {
      var s = document.createElement('script');
      s.async = true;
      var done = false;
      function done_() { if (done) return; done = true; settle(); }
      s.onload = done_;
      s.onerror = done_;
      s.src = url;
      try { (document.head || document.documentElement).appendChild(s); }
      catch (e) { done_(); }
    }
  }
  g.bootPlatforms = function (cb) {
    if (finished) { try { cb(); } catch (e) {} }
    else cbs.push(cb);
  };
  g.platformReady = new Promise(function (r) { g.bootPlatforms(r); });
  tryLoad('https://telegram.org/js/telegram-web-app.js');
  tryLoad('https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js');
})(window);
</script>

<script>
// Ключ MapTiler для навигатора (карта, схема, спутник)
const MAPTILER_KEY = 'mveDsz0PeGC3zhA47AdM';

// Доступные подложки. id можно посмотреть/поменять в кабинете MapTiler.
const MAP_STYLES = {
  scheme:    { id: 'streets-v4',      label: 'Схема' },
  base:      { id: 'base-v4',         label: 'Базовая' },
  sat:       { id: 'hybrid-v4',       label: 'Спутник' },
  topo:      { id: 'topo-v4',         label: 'Топо' },
  dark:      { id: 'streets-v4-dark', label: 'Тёмная' },
  osm:       { id: 'openstreetmap',   label: 'OSM' },
  yandex_sat: {
    label: 'Яндекс.Спутник',
    // Keyless-тайлы Яндекса отдаются без ключа и с CORS, но в эллипсоидном
    // Меркаторе (EPSG:3395), а MapLibre рисует Web Mercator (EPSG:3857).
    // Схему 'yandexsat://' перехватывает кастомный протокол ниже: он сам берёт
    // нужный тайл Яндекса и сдвигает его по широте, компенсируя разницу проекций.
    tiles: ['yandexsat://sat/{z}/{x}/{y}'],
    attribution: '© <a href="https://yandex.ru/maps">Яндекс</a>'
  }
};

// Дополнительные слои поверх любой подложки.
const MAP_OVERLAYS = {
  buildings: { label: '3D-здания' }
};

const MAP_PREFS_KEY = 'osm_map_prefs_v1';

function loadMapPrefs() {
  const prefs = { style: 'yandex_sat', overlays: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(MAP_PREFS_KEY) || '{}');
    if (saved && MAP_STYLES[saved.style]) prefs.style = saved.style;
    if (saved && saved.overlays && typeof saved.overlays === 'object') {
      for (const key of Object.keys(MAP_OVERLAYS)) {
        if (saved.overlays[key]) prefs.overlays[key] = true;
      }
    }
  } catch (e) {}
  return prefs;
}

const MAP_PREFS = loadMapPrefs();

const COLORS = {
  Gold: { hex: '#FFD700' },
  Blue: { hex: '#007AFF' },
  Red: { hex: '#FF3B30' },
  Fuchsia: { hex: '#AF52DE' },
  Orange: { hex: '#FF9500' },
  Purple: { hex: '#5856D6' },
  Cyan: { hex: '#5AC8FA' },
  Brown: { hex: '#A2845E' },
  Lime: { hex: '#34C759' }
};

const TTS_API_URL = 'https://functions.yandexcloud.net/d4erngid6s4rf5oinnp1';

const APP = {
    map: null, userMarker: null, lastPos: null, lastAz: 0, rawAz: 0, lastTilt: 0, autoCenter: false, currentSpeed: 0,
    navPoints: [],     navCurrentIndex: 0, _routeTotalDistance: 0,
    navAudio: new Audio(), _commentAudio: new Audio(),
    navConfig: { TRIGGER_DIST: 25, AZ_TOLERANCE: 45, SPEED_THRESHOLD: 2, SHOCK_THRESHOLD: 1, SHOCK_PHRASE: 'Сильный удар', SPEED_ALERT_THRESHOLD: 58, SPEED_ALERT_PHRASE: 'Превышена максимальная скорость' },
    _mapStyle: MAP_PREFS.style, _overlays: Object.assign({}, MAP_PREFS.overlays), _overlayRestoreDirty: true,
    _routeFeatures: [], _routeDataSource: null, _routeDataDirty: false,
    _driveActive: false, _driveRaf: null, _driveMarker: null, _driveShowFrom: -1,
    _driveState: null, _driveResume: null,
    _driveSpeed: 90,
    _userMarkerEl: null, markerRotation: 0,
    _currentDisplayAz: 0,
    _audioCache: new Map(),
    _commentEnabled: true,
    _lastShockTime: 0,
    _lastSpeedAlertTime: 0,
    _motionTracked: false,
    _shockDisplayG: 0,
    _shockPeakTime: 0,
    _simFirstRun: true,
    _simMode: false,
    _navSeq: 0,
    _audioPending: 0,
    _autoCenterTimer: null
};

const $ = id => document.getElementById(id);

/* ---------- MapLibre: адаптер объектов карты ---------- */
class MapMarker {
    constructor(options, element) {
        this.element = element;
        this.coordinates = options.coordinates || [0, 0];
        this._marker = new maplibregl.Marker({
            element,
            anchor: 'center',
            rotationAlignment: 'viewport',
            pitchAlignment: 'viewport'
        }).setLngLat(this.coordinates);
        this._onMap = false;
    }
    update(options) {
        if (options && options.coordinates) {
            this.coordinates = options.coordinates;
            this._marker.setLngLat(this.coordinates);
        }
    }
    _add(map) {
        if (!this._onMap) {
            this._marker.addTo(map);
            this._onMap = true;
        }
    }
    _remove() {
        if (this._onMap) {
            this._marker.remove();
            this._onMap = false;
        }
    }
}

function mapAddChild(obj) {
    if (!APP.map || !obj) return;
    if (obj._add) obj._add(APP.map);
}

function mapRemoveChild(obj) {
    if (!obj) return;
    if (obj._remove) obj._remove();
}

// Определение платформы (Telegram/VK SDK). Нужно только для UI и отчётов,
// аккаунты и привязка маршрутов к пользователям не используются.
(function() {
    const runPlatform = () => {
        if (window._platformRan) return;
        window._platformRan = true;
        if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
            try {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                if (Telegram.WebApp.version && parseFloat(Telegram.WebApp.version) >= 7.0) {
                    try { Telegram.WebApp.requestFullscreen?.(); } catch (e) {}
                    try { Telegram.WebApp.disableVerticalSwipes?.(); } catch (e) {}
                }
                const user = Telegram.WebApp.initDataUnsafe?.user;
                if (user) {
                    window.platformType = 'tg';
                    window.tgUser = user;
                }
            } catch (e) {}
        }
        if (typeof vkBridge !== 'undefined') {
            try {
                vkBridge.send('VKWebAppInit');
                vkBridge.send('VKWebAppGetUserInfo').then(data => {
                    if (data?.id) {
                        window.platformType = 'vk';
                        window.vkUser = data;
                    }
                });
            } catch (e) {}
        }
        if (navigator.userAgent.includes('Android') && window.platformType === 'tg') {
            document.documentElement.classList.add('android-app');
        }
    };
    if (window.bootPlatforms) window.bootPlatforms(runPlatform); else runPlatform();
})();

let toastTimer = null;
function showToast(text, type = 'info', duration = 2000) {
    const el = $('toast');
    el.textContent = text;
    el.className = `toast ${type} show`;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

function updateUserMarkerRotation() {
    if (!APP._userMarkerEl || APP.lastAz === null || !APP.map) return;
    if (APP.currentSpeed < APP.navConfig.SPEED_THRESHOLD) return;
    const arrow = APP._userMarkerEl.querySelector('#user-arrow');
    if (arrow) {
        const mapAz = -(APP.map.getBearing() || 0);
        const targetRotation = APP._currentDisplayAz + mapAz;
        let delta = ((targetRotation - APP.markerRotation + 180) % 360) - 180;
        APP.markerRotation += delta;
        arrow.setAttribute('transform', `rotate(${APP.markerRotation}, 20, 20)`);
    }
}

function calcAzimuth(p1, p2) {
    if (!p1 || !p2) return 0;
    const [la1, lo1] = p1.map(v => v * Math.PI / 180);
    const [la2, lo2] = p2.map(v => v * Math.PI / 180);
    const y = Math.sin(lo2 - lo1) * Math.cos(la2);
    const x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(lo2 - lo1);
    return Math.round((Math.atan2(y, x) * 180 / Math.PI + 360) % 360);
}

function getGeoDistance(p1, p2) {
    const R = 6371000;
    const dLat = (p2[0] - p1[0]) * Math.PI / 180;
    const dLon = (p2[1] - p1[1]) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(p1[0] * Math.PI / 180) * Math.cos(p2[0] * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function setMapLocation(center, zoom, azimuth, duration = 400) {
    if (!APP.map) return;
    const params = {
        center: [center[1], center[0]],
        pitch: APP.lastTilt
    };
    if (zoom !== undefined) params.zoom = Math.min(zoom, 20);
    if (azimuth !== undefined) params.bearing = ((azimuth % 360) + 360) % 360;
    if (duration > 0) {
        APP.map.easeTo({ ...params, duration, easing: t => t });
    } else {
        APP.map.jumpTo(params);
    }
}

function stopDrive() {
    APP._driveActive = false;
    APP._driveShowFrom = -1;
    APP._driveState = null;
    APP._driveResume = null;
    if (APP._driveRaf) { cancelAnimationFrame(APP._driveRaf); APP._driveRaf = null; }
    if (APP.map) APP.map.stop();
    if (APP._driveMarker) { APP._driveMarker.element.style.display = 'none'; }
    APP.navAudio.pause();
    APP._commentAudio.pause();
    APP.navAudio.onended = null;
    APP._commentAudio.onended = null;
    document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing'));
    const pb = $('playBtn');
    if (pb) {
        pb.classList.remove('active');
        pb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    }
}

function pauseDrive() {
    if (!APP._driveActive) return;
    APP._driveActive = false;
    if (APP._driveRaf) { cancelAnimationFrame(APP._driveRaf); APP._driveRaf = null; }
    if (APP.map) APP.map.stop();
    APP._driveResume = APP._driveState ? { ...APP._driveState } : null;
    APP._driveState = null;
    APP.navAudio.pause();
    APP._commentAudio.pause();
    APP.navAudio.onended = null;
    APP._commentAudio.onended = null;
    document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing'));
    const pb = $('playBtn');
    if (pb) {
        pb.classList.remove('active');
        pb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    }
}

function driveAlongPath(fromIdx) {
    const p = APP.navPoints[fromIdx];
    if (!p || !p.pts || p.pts.length < 2) return;

    const resume = APP._driveResume && APP._driveResume.idx === fromIdx ? APP._driveResume : null;
    stopDrive();

    const path = p.pts;
    if (!p._dists) {
        p._dists = [0];
        for (let i = 1; i < path.length; i++) {
            p._dists[i] = p._dists[i - 1] + getGeoDistance(path[i - 1], path[i]);
        }
    }
    const dists = p._dists;
    const totalDist = dists[path.length - 1];
    if (totalDist < 0.1) return;

    APP._driveShowFrom = fromIdx;

    APP._driveActive = true;
    let simulatedDist = resume ? resume.dist : 0;
    let currentSeg = resume ? resume.seg : 0;
    let currentAz = resume ? resume.az : calcAzimuth(path[0], path[1]);
    let lastFrameTime = performance.now();
    let _lastSeg = resume ? resume.lastSeg : 0;
    let _lastZoom = APP.map.getZoom();
    let _zoomChangedAt = 0;
    let _zoomRecenterPending = false;
    APP._driveState = { idx: fromIdx, dist: simulatedDist, seg: currentSeg, az: currentAz, lastSeg: _lastSeg };

    // Зум не ставит симуляцию на паузу. После окончания жеста мягко
    // возвращаем камеру к текущей точке, сохраняя выбранный пользователем зум.

    mapRemoveChild(APP._driveMarker);
    mapAddChild(APP._driveMarker);
    APP._driveMarker.update({ coordinates: [path[0][1], path[0][0]] });
    APP._driveMarker.element.style.display = '';

    if (resume) {
        const mp = getPos(simulatedDist);
        currentSeg = mp.seg;
        APP._driveMarker.update({ coordinates: [mp.lon, mp.lat] });

        // Сначала совмещаем камеру с маркером, затем ведём её к следующей
        // вершине за оставшееся время сегмента — иначе маркер уезжает
        // от центра и камера догоняет его только на следующем сегменте.
        setMapLocation([mp.lat, mp.lon], undefined, currentAz, 0);
        const nextIdx = mp.seg + 1;
        if (nextIdx < path.length) {
            const remaining = Math.max(dists[nextIdx] - simulatedDist, 0);
            const remainingMs = remaining / (APP._driveSpeed / 3.6) * 1000;
            setMapLocation([path[nextIdx][0], path[nextIdx][1]], undefined, currentAz, Math.max(remainingMs, 300));
        }
    } else {
        const firstDur = (dists[1] - dists[0]) / (APP._driveSpeed / 3.6) * 1000;
        const zoom = APP._simForceZoom ? 19 : undefined;
        APP._simForceZoom = false;
        setMapLocation([path[1][0], path[1][1]], zoom, currentAz, Math.max(firstDur, 500));
    }

    function getPos(dist) {
        if (dist >= totalDist) {
            const last = path[path.length - 1];
            return { lat: last[0], lon: last[1], seg: path.length - 2 };
        }
        while (_lastSeg < dists.length - 1 && dists[_lastSeg + 1] < dist) _lastSeg++;
        const t = dists[_lastSeg + 1] > dists[_lastSeg] ? (dist - dists[_lastSeg]) / (dists[_lastSeg + 1] - dists[_lastSeg]) : 0;
        return {
            lat: path[_lastSeg][0] + (path[_lastSeg + 1][0] - path[_lastSeg][0]) * t,
            lon: path[_lastSeg][1] + (path[_lastSeg + 1][1] - path[_lastSeg][1]) * t,
            seg: _lastSeg
        };
    }

    function frame(time) {
        if (!APP._driveActive) return;
        // Ограничиваем шаг: после сворачивания вкладки rAF может вернуть
        // большой dt, и машина иначе прыгнет далеко вперёд.
        const dt = Math.min((time - lastFrameTime) / 1000, 0.1);
        lastFrameTime = time;
        simulatedDist += (APP._driveSpeed / 3.6) * dt;

        if (simulatedDist >= totalDist) {
            const lastPt = path[path.length - 1];
            const prevPt = path.length >= 2 ? path[path.length - 2] : lastPt;
            currentAz = calcAzimuth(prevPt, lastPt);
            APP._driveMarker.update({ coordinates: [lastPt[1], lastPt[0]] });
            stopDrive();
            const nextIdx = fromIdx + 1;
            if (nextIdx < APP.navPoints.length) {
                const np = APP.navPoints[nextIdx];
                if (np && np.pts && np.pts.length >= 2) {
                    APP.navCurrentIndex = nextIdx;
                    APP._driveShowFrom = nextIdx;
                    renderRoutePoints();
                    updateHud();
                    updatePointsListActive();
                    playPointAudio(np, () => {
                        if (APP._driveShowFrom >= 0 && !APP._driveActive) driveAlongPath(nextIdx);
                    });
                    const pb = $('playBtn');
                    if (pb) { pb.classList.add('active'); pb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; }
                }
            }
            if (nextIdx >= APP.navPoints.length ||
                !APP.navPoints[nextIdx] ||
                !APP.navPoints[nextIdx].pts ||
                APP.navPoints[nextIdx].pts.length < 2) {
                APP._simMode = false;
                updateTiltState();
            }
            return;
        }

        const mp = getPos(simulatedDist);

        const curZoom = APP.map.getZoom();
        if (curZoom !== _lastZoom) {
            _lastZoom = curZoom;
            _zoomChangedAt = time;
            _zoomRecenterPending = true;
        }

        if (mp.seg !== currentSeg) {
            currentSeg = mp.seg;
            const nextIdx = mp.seg + 1;
            if (nextIdx < path.length) {
                const d = (dists[nextIdx] - dists[mp.seg]) / (APP._driveSpeed / 3.6) * 1000;
                currentAz = calcAzimuth(path[mp.seg], path[nextIdx]);
                if (!_zoomRecenterPending) {
                    setMapLocation([path[nextIdx][0], path[nextIdx][1]], undefined, currentAz, Math.max(d, 500));
                }
            }
        }

        if (_zoomRecenterPending && time - _zoomChangedAt >= 180) {
            _zoomRecenterPending = false;
            setMapLocation([mp.lat, mp.lon], undefined, currentAz, 300);
        }

        if (APP._driveState) {
            APP._driveState.dist = simulatedDist;
            APP._driveState.seg = currentSeg;
            APP._driveState.az = currentAz;
            APP._driveState.lastSeg = _lastSeg;
        }
        APP._driveMarker.update({ coordinates: [mp.lon, mp.lat] });
        APP._driveRaf = requestAnimationFrame(frame);
    }

    APP._driveRaf = requestAnimationFrame(frame);
    $('playBtn').classList.add('active');
    $('playBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
}


function initGeolocation() {
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
            const coords = [pos.coords.latitude, pos.coords.longitude];
            const speed = (pos.coords.speed || 0) * 3.6;
            if (APP.lastPos && speed >= APP.navConfig.SPEED_THRESHOLD) {
                const rawAz = calcAzimuth(APP.lastPos, coords);
                APP.rawAz = rawAz;
                APP.lastAz = rawAz;
            }
            APP.lastPos = coords;
            APP.currentSpeed = speed;
            checkSpeedAlert(speed);

            if (APP.userMarker && APP._userMarkerEl) {
                if (APP.autoCenter) {
                    APP._currentDisplayAz = APP.lastAz;
                    APP.userMarker.update({ coordinates: [coords[1], coords[0]] });
                    const camera = { center: [coords[1], coords[0]], pitch: APP.lastTilt };
                    if (APP.lastAz) camera.bearing = APP.lastAz;
                    APP.map.jumpTo(camera);
                } else {
                    APP._currentDisplayAz = APP.lastAz;
                    APP.userMarker.update({ coordinates: [coords[1], coords[0]] });
                }
                updateUserMarkerRotation();
            }
            $('telSpeed').textContent = Math.round(APP.currentSpeed);

            if (APP.navCurrentIndex >= 0) navCheckTriggers();
        }, () => {}, { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 });
    }
}

async function requestMotionPermission() {
    if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
        try {
            const state = await DeviceMotionEvent.requestPermission();
            return state === 'granted';
        } catch (e) {
            return false;
        }
    }
    return true;
}

function ensureMotionTracking() {
    if (APP._motionTracked) return Promise.resolve(true);
    return requestMotionPermission().then(granted => {
        if (granted) {
            APP._motionTracked = true;
            window.addEventListener('devicemotion', onMotion);
        } else {
            APP.navConfig.SHOCK_THRESHOLD = 0;
            $('triggerShock').value = 0;
            updateShockDisplay();
        }
        updateShockBarVisibility();
        return granted;
    });
}

function updateShockBarVisibility() {
    const bar = $('shockBar');
    if (bar) bar.style.display = APP.navConfig.SHOCK_THRESHOLD > 0 ? 'block' : 'none';
}

const SHOCK_DEBOUNCE = 3000;

function isAudioPlaying() {
    return APP._audioPending > 0 ||
           (!APP.navAudio.paused && APP.navAudio.currentTime > 0) ||
           (!APP._commentAudio.paused && APP._commentAudio.currentTime > 0);
}

function onMotion(event) {
    const gThreshold = APP.navConfig.SHOCK_THRESHOLD;
    if (gThreshold <= 0) return;
    const acc = event.accelerationIncludingGravity;
    if (!acc) return;
    const { x, y, z } = acc;
    const total = Math.sqrt(x*x + y*y + z*z);
    const impactG = Math.abs(total - 9.8) / 9.8;
    updateShockBar(impactG);
    if (isAudioPlaying()) return;
    if (impactG > gThreshold) {
        const now = Date.now();
        if (now - APP._lastShockTime < SHOCK_DEBOUNCE) return;
        APP._lastShockTime = now;
        playCommand(APP.navConfig.SHOCK_PHRASE || 'Сильный удар').catch(() => {});
    }
}

let _shockFill = null;
let _shockLabel = null;
let _shockLastG = -1;
let _shockLastColor = '';

function updateShockBar(g) {
    if (!_shockFill) _shockFill = $('shockBarFill');
    if (!_shockLabel) _shockLabel = $('shockBarValue');
    if (!_shockFill) return;
    const now = Date.now();
    if (g > APP._shockDisplayG) {
        APP._shockDisplayG = g;
        APP._shockPeakTime = now;
    } else if (now - APP._shockPeakTime > 1000) {
        APP._shockDisplayG += (g - APP._shockDisplayG) * 0.08;
        if (Math.abs(APP._shockDisplayG - g) < 0.01) {
            APP._shockDisplayG = g;
        }
    }
    const displayG = APP._shockDisplayG;
    if (Math.abs(displayG - _shockLastG) < 0.05) return;
    _shockLastG = displayG;
    const clamped = Math.max(0.1, Math.min(3, displayG));
    const pct = ((clamped - 0.1) / (3 - 0.1)) * 100;
    _shockFill.style.width = Math.min(100, pct) + '%';
    if (_shockLabel) {
        _shockLabel.textContent = displayG > 0.2 ? displayG.toFixed(2) : '';
    }
    let color;
    if (displayG < 0.5) color = '#30D158';
    else if (displayG < 1.5) color = '#FFD700';
    else if (displayG < 2.5) color = '#FF9500';
    else color = '#FF3B30';
    if (color !== _shockLastColor) {
        _shockFill.style.background = color;
        _shockLastColor = color;
    }
}

const SPEED_ALERT_DEBOUNCE = 5000;

function checkSpeedAlert(speed) {
    const threshold = APP.navConfig.SPEED_ALERT_THRESHOLD;
    if (threshold <= 0) return;
    if (isAudioPlaying()) return;
    if (speed > threshold) {
        const now = Date.now();
        if (now - APP._lastSpeedAlertTime < SPEED_ALERT_DEBOUNCE) return;
        APP._lastSpeedAlertTime = now;
        playCommand(APP.navConfig.SPEED_ALERT_PHRASE || 'Превышена максимальная скорость').catch(() => {});
    }
}

function maptilerStyleUrl(type) {
    const st = MAP_STYLES[type] || MAP_STYLES.scheme;
    if (st.tiles) {
        const srcId = 'osm-yandex-base';
        return {
            version: 8,
            sources: {
                [srcId]: { type: 'raster', tiles: st.tiles, tileSize: 256, attribution: st.attribution }
            },
            layers: [{ id: srcId, type: 'raster', source: srcId }]
        };
    }
    return `https://api.maptiler.com/maps/${st.id}/style.json?key=${encodeURIComponent(MAPTILER_KEY)}`;
}

/* ---------- Яндекс.Спутник: пересчёт проекции EPSG:3395 -> Web Mercator ----------
   Keyless-тайлы Яндекса отдаются в эллипсоидном Меркаторе, а MapLibre рисует
   сферический Web Mercator: по долготе всё совпадает, а по широте нужен сдвиг.
   Схему 'yandexsat://' перехватывает протокол: он по строке web-тайла считает
   точную строку в сетке Яндекса, берёт её и субпиксельно сдвигает.
   Для Нижнего Новгорода сдвиг ≈19.7 км (проверено замером по снимкам). */
const YANDEX_MERC_E = 0.0818191908426;
let _yandexProtoRegistered = false;

function webRowToLat(R, worldPx) {
    return Math.atan(Math.sinh(Math.PI * (1 - 2 * R / worldPx))) * 180 / Math.PI;
}

function latToYandexRow(lat, worldPx) {
    const b = lat * Math.PI / 180;
    const phi = (1 - YANDEX_MERC_E * Math.sin(b)) / (1 + YANDEX_MERC_E * Math.sin(b));
    const theta = Math.tan(Math.PI / 4 + b / 2) * Math.pow(phi, YANDEX_MERC_E / 2);
    return worldPx * (1 - Math.log(theta) / Math.PI) / 2;
}

function makeCanvas(w, h) {
    if (typeof OffscreenCanvas !== 'undefined') {
        const c = new OffscreenCanvas(w, h);
        return { canvas: c, ctx: c.getContext('2d'), offscreen: true };
    }
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return { canvas: c, ctx: c.getContext('2d'), offscreen: false };
}

async function fetchTileBitmap(url, signal) {
    const res = await fetch(url, { signal, mode: 'cors' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await createImageBitmap(await res.blob());
}

async function buildYandexTile(params, abortController) {
    const m = /yandexsat:\/\/sat\/(\d+)\/(\d+)\/(\d+)/.exec((params && params.url) || '');
    if (!m) throw new Error('Некорректный URL тайла Яндекса');
    const z = +m[1], x = +m[2], y = +m[3];
    const n = Math.pow(2, z);
    const worldPx = 256 * n;

    const lat = webRowToLat(256 * y, worldPx);
    const yRow = latToYandexRow(lat, worldPx);
    let srcY = Math.floor(yRow / 256);
    srcY = Math.max(0, Math.min(n - 1, srcY));
    const shiftUp = Math.max(0, Math.min(255.999, yRow - 256 * srcY));

    // Сдвиг округляем до целых пикселей: при дробном сдвиге drawImage
    // пересэмплирует стык двух тайлов и на нём проступает видимая
    // горизонтальная линия. Целочисленный сдвиг линию убирает, а ошибка
    // при этом меньше пикселя.
    const snap = Math.max(0, Math.min(255, Math.round(shiftUp)));

    const base = 'https://core-sat.maps.yandex.net/tiles?l=sat&x=' + x + '&y=';
    const signal = abortController && abortController.signal;
    const secondY = Math.min(n - 1, srcY + 1);
    const [imgA, imgB] = await Promise.all([
        fetchTileBitmap(base + srcY + '&z=' + z, signal),
        snap > 0
            ? fetchTileBitmap(base + secondY + '&z=' + z, signal).catch(() => null)
            : Promise.resolve(null)
    ]);

    const { canvas, ctx, offscreen } = makeCanvas(256, 256);
    ctx.drawImage(imgA, 0, -snap);
    if (imgB) ctx.drawImage(imgB, 0, 256 - snap);
    if (imgA.close) imgA.close();
    if (imgB && imgB.close) imgB.close();

    const data = offscreen ? canvas.transferToImageBitmap() : await createImageBitmap(canvas);
    return { data };
}

function registerYandexProtocol() {
    if (_yandexProtoRegistered) return;
    if (typeof maplibregl === 'undefined' || !maplibregl.addProtocol) return;
    maplibregl.addProtocol('yandexsat', buildYandexTile);
    _yandexProtoRegistered = true;
}

function saveMapPrefs() {
    try {
        localStorage.setItem(MAP_PREFS_KEY, JSON.stringify({
            style: APP._mapStyle,
            overlays: APP._overlays
        }));
    } catch (e) {}
}

function renderMapSettings() {
    const grid = $('mapStyleGrid');
    if (grid) {
        grid.innerHTML = '';
        Object.keys(MAP_STYLES).forEach(key => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'map-style-btn' + (APP._mapStyle === key ? ' active' : '');
            btn.dataset.style = key;
            btn.textContent = MAP_STYLES[key].label;
            btn.addEventListener('click', () => setMapType(key));
            grid.appendChild(btn);
        });
    }
    const list = $('mapOverlayList');
    if (list) {
        list.innerHTML = '';
        Object.keys(MAP_OVERLAYS).forEach(key => {
            const row = document.createElement('label');
            row.className = 'map-overlay-row';
            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = MAP_OVERLAYS[key].label;
            const sw = document.createElement('span');
            sw.className = 'toggle-switch';
            const input = document.createElement('input');
            input.type = 'checkbox';
            input.className = 'toggle-input';
            input.checked = !!APP._overlays[key];
            input.addEventListener('change', () => setOverlay(key, input.checked));
            const slider = document.createElement('span');
            slider.className = 'toggle-slider';
            sw.appendChild(input);
            sw.appendChild(slider);
            row.appendChild(label);
            row.appendChild(sw);
            list.appendChild(row);
        });
    }
}

function syncMapStyleButtons() {
    document.querySelectorAll('.map-style-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.style === APP._mapStyle);
    });
}

function setMapType(type) {
    if (!MAP_STYLES[type] || !APP.map || APP._mapStyle === type) return;
    APP._mapStyle = type;
    saveMapPrefs();
    syncMapStyleButtons();
    APP._routeDataSource = null;
    APP._overlayRestoreDirty = true;
    APP.map.setStyle(maptilerStyleUrl(type));
    showToast(MAP_STYLES[type].label, 'info', 1500);
}

/* ---------- Дополнительные слои карты ---------- */
const BUILDINGS_SOURCE_ID = 'osm-buildings';
const BUILDINGS_LAYER_ID = 'osm-3d-buildings';
// Векторный тайлсет MapTiler со слоем building (render_height/render_min_height).
// Нужен, чтобы рисовать 3D-здания поверх растровых подложек без векторных данных.
const BUILDINGS_TILES_URL = `https://api.maptiler.com/tiles/v3/tiles.json?key=${encodeURIComponent(MAPTILER_KEY)}`;

function firstSymbolLayerId() {
    try {
        const layers = APP.map.getStyle().layers || [];
        const sym = layers.find(l => l.type === 'symbol' && l.id.indexOf('osm-') !== 0);
        return sym ? sym.id : undefined;
    } catch (e) { return undefined; }
}

// Куда вставлять доп. слои: под подписи, а если их нет (растровые подложки) —
// под маршруты, чтобы 3D-здания и прочие слои не перекрывали линии маршрута.
function overlayInsertBefore() {
    const sym = firstSymbolLayerId();
    if (sym) return sym;
    if (APP.map.getLayer('nav-routes-casing')) return 'nav-routes-casing';
    return undefined;
}

function addMapLayer(layer, beforeId) {
    if (APP.map.getLayer(layer.id)) return;
    APP.map.addLayer(layer, beforeId);
}

function removeMapLayer(id) {
    if (APP.map.getLayer(id)) APP.map.removeLayer(id);
}

function removeMapSource(id) {
    if (APP.map.getSource(id)) APP.map.removeSource(id);
}

function applyBuildings(beforeId) {
    let src = null;
    try {
        const b = (APP.map.getStyle().layers || []).find(l => l['source-layer'] === 'building');
        src = b && b.source;
    } catch (e) { src = null; }
    // На растровых подложках (Яндекс.Спутник, OSM) в стиле нет
    // векторных данных — берём контуры и высоты из тайлсета MapTiler v3.
    if (!src) {
        src = BUILDINGS_SOURCE_ID;
        if (!APP.map.getSource(src)) {
            APP.map.addSource(src, {
                type: 'vector',
                url: BUILDINGS_TILES_URL,
                maxzoom: 15
            });
        }
    }
    addMapLayer({
        id: BUILDINGS_LAYER_ID,
        type: 'fill-extrusion',
        source: src,
        'source-layer': 'building',
        minzoom: 14,
        paint: {
            'fill-extrusion-color': '#cfcfcf',
            'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 8],
            'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], ['get', 'min_height'], 0],
            'fill-extrusion-opacity': 0.75
        }
    }, beforeId);
}

function setOverlay(key, enabled) {
    if (!MAP_OVERLAYS[key]) return;
    APP._overlays[key] = !!enabled;
    saveMapPrefs();
    APP._overlayRestoreDirty = true;
    restoreMapOverlays(true);
}

function restoreMapOverlays(force) {
    if (!APP.map) return;
    if (!APP.map.isStyleLoaded()) return;
    if (!force && !APP._overlayRestoreDirty) return;
    const o = APP._overlays || {};
    const b = overlayInsertBefore();
    let ok = true;
    const step = fn => { try { fn(); } catch (e) { ok = false; } };

    step(() => {
        if (o.buildings) applyBuildings(b);
        else { removeMapLayer(BUILDINGS_LAYER_ID); removeMapSource(BUILDINGS_SOURCE_ID); }
    });
    APP._overlayRestoreDirty = !ok;
}

function setTilt(mode) {
    const is3d = mode === '3d';
    if (is3d === APP._is3D) return;
    APP._is3D = is3d;
    APP.lastTilt = is3d ? 60 : 0;
    if (APP.map) APP.map.easeTo({ pitch: APP.lastTilt, duration: 300 });
}

function updateTiltState() {
    setTilt(APP._simMode || APP.autoCenter ? '3d' : '2d');
}

    closePointsList();

function openSettings() {

    closeAllSheets();

    const shockOn = APP.navConfig.SHOCK_THRESHOLD > 0;

    $('triggerShockPhrase').value = APP.navConfig.SHOCK_PHRASE;

    $('triggerSpeedAlertToggle').checked = speedOn;
    $('triggerSpeedAlert').value = speedOn ? APP.navConfig.SPEED_ALERT_THRESHOLD : 58;
    $('triggerSpeedAlertPhrase').value = APP.navConfig.SPEED_ALERT_PHRASE;
    $('triggerShockVal').textContent = shockOn ? APP.navConfig.SHOCK_THRESHOLD + 'g' : 'Выкл';

function getNavIconSvg(col, txt, isCurr = false, hasComm = false) {
    const s = 40, c = s / 2;
    const r = 9;
    // Цвет подставляется в атрибуты SVG, номер точки — в текстовый узел.
    // И то, и другое приходит из данных маршрута, поэтому валидируем/экранируем.
    const safeCol = /^#[0-9a-f]{6}$/i.test(col) ? col : '#007AFF';
    const safeTxt = escapeHtml(String(txt ?? ''));
    const txtFill = '#ffffff';
    const txtStroke = hasComm ? '#FF3B30' : '#000000';
    const txtStrokeW = hasComm ? 3 : 2;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}">
        <rect width="${s}" height="${s}" fill="transparent"/>
        ${isCurr ? `<circle cx="${c}" cy="${c}" r="${r + 3}" fill="none" stroke="#00FF00" stroke-width="2.5" opacity="0.9"/>` : ''}
        <circle cx="${c}" cy="${c}" r="${r}" fill="rgba(0,0,0,0.7)"/>
        <circle cx="${c}" cy="${c}" r="${r}" fill="${safeCol}" opacity="0.3"/>
        <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${safeCol}" stroke-width="1.5"/>
        <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
        <text x="${c}" y="${c + 0.5}" font-size="9" font-family="Arial" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="${txtFill}" stroke="${txtStroke}" stroke-width="${txtStrokeW}" paint-order="stroke fill">${safeTxt}</text>
    </svg>`;
    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

function hexToRgba(h, a) {
    return `rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`;
}

const ROUTE_SOURCE_ID = 'nav-routes';

function ensureRouteLayers() {
    if (!APP.map) return;
    try {
        if (!APP.map.getSource(ROUTE_SOURCE_ID)) {
            APP.map.addSource(ROUTE_SOURCE_ID, {
                type: 'geojson',
                data: { type: 'FeatureCollection', features: [] }
            });
        }
        // Нижняя группа: предыдущий (priority 20) и будущие (10) сегменты.
        // line-sort-key гарантирует, что предыдущий рисуется поверх будущих.
        if (!APP.map.getLayer('nav-routes-casing')) {
            APP.map.addLayer({
                id: 'nav-routes-casing',
                type: 'line',
                source: ROUTE_SOURCE_ID,
                filter: ['!=', ['get', 'priority'], 30],
                layout: {
                    'line-join': 'round',
                    'line-cap': 'round',
                    'line-sort-key': ['get', 'priority']
                },
                paint: {
                    'line-color': ['get', 'casingColor'],
                    'line-width': ['get', 'casingWidth']
                }
            });
        }
        if (!APP.map.getLayer('nav-routes-main')) {
            APP.map.addLayer({
                id: 'nav-routes-main',
                type: 'line',
                source: ROUTE_SOURCE_ID,
                filter: ['!=', ['get', 'priority'], 30],
                layout: {
                    'line-join': 'round',
                    'line-cap': 'round',
                    'line-sort-key': ['get', 'priority']
                },
                paint: {
                    'line-color': ['get', 'color'],
                    'line-width': ['get', 'width']
                }
            });
        }
        // Верхняя группа: только активный сегмент (priority 30) — всегда выше остальных.
        if (!APP.map.getLayer('nav-routes-glow')) {
            APP.map.addLayer({
                id: 'nav-routes-glow',
                type: 'line',
                source: ROUTE_SOURCE_ID,
                filter: ['==', ['get', 'priority'], 30],
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: { 'line-color': '#00FF00', 'line-width': 12, 'line-opacity': 0.95 }
            });
        }
        if (!APP.map.getLayer('nav-routes-active-casing')) {
            APP.map.addLayer({
                id: 'nav-routes-active-casing',
                type: 'line',
                source: ROUTE_SOURCE_ID,
                filter: ['==', ['get', 'priority'], 30],
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: {
                    'line-color': ['get', 'casingColor'],
                    'line-width': ['get', 'casingWidth']
                }
            });
        }
        if (!APP.map.getLayer('nav-routes-active-main')) {
            APP.map.addLayer({
                id: 'nav-routes-active-main',
                type: 'line',
                source: ROUTE_SOURCE_ID,
                filter: ['==', ['get', 'priority'], 30],
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: {
                    'line-color': ['get', 'color'],
                    'line-width': ['get', 'width']
                }
            });
        }
    } catch (e) {
        // Стиль ещё не догрузился — повторно попробуем на styledata
    }
}

function updateRouteLines(features) {
    if (features) {
        APP._routeFeatures = features;
        APP._routeDataDirty = true;
    }
    if (!APP.map) return;
    const source = APP.map.getSource(ROUTE_SOURCE_ID);
    if (!source) return;
    // После смены стиля источник создаётся заново — данные нужно применить ещё раз.
    if (APP._routeDataSource !== source) {
        APP._routeDataSource = source;
        APP._routeDataDirty = true;
    }
    if (!APP._routeDataDirty) return;
    source.setData({ type: 'FeatureCollection', features: APP._routeFeatures || [] });
    APP._routeDataDirty = false;
}

// После setStyle MapLibre удаляет все source/layer. Восстанавливаем маршрутные слои,
// как только стиль догрузился (события styledata/idle; style.load при setStyle не приходит).
function restoreRouteLayers() {
    if (!APP.map) return;
    ensureRouteLayers();
    updateRouteLines();
    restoreMapOverlays(false);
}


function removeRouteObjects() {
    APP.navPoints.forEach(p => {
        if (p.placemark) mapRemoveChild(p.placemark);
        p.placemark = null;
    });
    updateRouteLines([]);
}

function updateRouteNameDisplay() {
    const el = $('routeNameDisplay');
    if (!el) return;
    let name = '';
    try {
        if (typeof MenuModule !== 'undefined') {
            const cr = MenuModule.currentRoute;
            if (cr && MenuModule.routesDescriptions && MenuModule.routesDescriptions[cr]) {
                name = (MenuModule.routesDescriptions[cr].name || '').trim();
            }
            if (!name && cr) {
                name = cr;
            }
        }
    } catch (e) {}
    if (APP._routeTotalDistance > 0 && name) {
        const d = APP._routeTotalDistance;
        const distText = d >= 1000 ? `${(d / 1000).toFixed(1)} км` : `${Math.round(d)} м`;
        name = `${name} (${distText})`;
    }
    el.textContent = name;
    el.style.display = name ? 'block' : 'none';
}

function clearRoute() {
    stopDrive();
    APP._simMode = false;
    updateTiltState();
    removeRouteObjects();
    APP.navPoints = [];
    APP.navCurrentIndex = 0;
    APP._routeTotalDistance = 0;
    $('hud').classList.remove('active');
    updateRouteNameDisplay();
}

function renderRoutePoints() {
    const features = [];

    APP.navPoints.forEach((p, i) => {
        const isCurrent = (i === APP.navCurrentIndex);
        const isPassed = (i < APP.navCurrentIndex);
        const isPrevious = (i === APP.navCurrentIndex - 1);
        const hasComm = p.comm && p.comm.trim() !== '';

        const showPoint = APP._driveShowFrom >= 0 ? (i >= Math.max(APP._driveShowFrom - 1, 0)) : (!isPassed || isCurrent || isPrevious);
        const showPath = APP._driveShowFrom >= 0 ? (i >= Math.max(APP._driveShowFrom - 1, 0)) : (!isPassed || isPrevious);

        if (!p.placemark) {
            const el = document.createElement('div');
            el.style.cssText = 'width:40px;height:40px;cursor:pointer;';
            el.dataset.idx = i;
            el.addEventListener('click', e => {
                e.stopPropagation();
                const idx = parseInt(el.dataset.idx);
                setTarget(idx);
            });
            p.placemark = new MapMarker({ coordinates: [p.lon, p.lat] }, el);
        }

        const el = p.placemark.element;
        el.dataset.idx = i;

        if (showPoint) {
            el.style.display = '';
            el.style.opacity = isPrevious ? '0.7' : '';
            el.innerHTML = `<img src="${getNavIconSvg(p.hex, p.id, isCurrent, hasComm)}" width="40" height="40" class="marker-img" />`;
            p.placemark.update({ coordinates: [p.lon, p.lat] });
        } else {
            el.style.display = 'none';
        }

        if (showPath && p.pts && p.pts.length >= 2) {
            features.push({
                type: 'Feature',
                geometry: {
                    type: 'LineString',
                    coordinates: p.pts.map(pt => [pt[1], pt[0]])
                },
                properties: {
                    color: isCurrent ? p.hex : (isPrevious ? hexToRgba(p.hex, 0.5) : p.hex),
                    casingColor: isPrevious ? 'rgba(0,0,0,0.7)' : '#000000',
                    casingWidth: isCurrent ? 8 : (isPrevious ? 8 : 6),
                    width: isCurrent ? 6 : (isPrevious ? 6 : 4),
                    priority: isCurrent ? 30 : (isPrevious ? 20 : 10)
                }
            });
        }
    });

    if (APP.map) {
        for (let ci = APP.navPoints.length - 1; ci >= 0; ci--) {
            const pt = APP.navPoints[ci];
            if (pt.placemark) mapAddChild(pt.placemark);
        }
        ensureRouteLayers();
        updateRouteLines(features);
    }
    updateHud();
}


function updateHud() {
    let idx = APP.navCurrentIndex;
    if (idx >= APP.navPoints.length) idx = APP.navPoints.length - 1;
    const t = APP.navPoints[idx];
    if (!t) return;

    $('hudCmdNum').innerHTML = `<svg width="44" height="44" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="${t.hex}" opacity="0.3"/><circle cx="10" cy="10" r="9" fill="none" stroke="${t.hex}" stroke-width="1.5"/><text x="10" y="10.5" font-size="8" font-family="Arial" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="#fff">${escapeHtml(t.id)}</text></svg>`;
    $('hudCmdTextInner').textContent = t.cmd;
    $('hudCmdTextInner').style.opacity = APP._audioCache.has(t.cmd) ? '1' : '0.35';
    $('hudCmdNum').onclick = (e) => {
        e.stopPropagation();
        const el = $('hudCmdNum');
        document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing'));
        APP._commentAudio.onended = null;
        el.classList.add('playing');
        playPointAudio(t, () => el.classList.remove('playing'));
    };
    $('hudCmd').onclick = openPointsList;

    if (APP.lastPos) {
        const d = getGeoDistance(APP.lastPos, [t.lat, t.lon]);
        let ad = Math.abs(APP.lastAz - t.az) % 360;
        if (ad > 180) ad = 360 - ad;
        $('hudCmdDist').innerHTML = formatDistance(d);
        $('hudCmdDist').classList.toggle('in-range', d < 50 && ad <= APP.navConfig.AZ_TOLERANCE);
    } else {
        $('hudCmdDist').innerHTML = '---';
        $('hudCmdDist').classList.remove('in-range');
    }

    const prevBtn = $('prevBtn'), nextBtn = $('nextBtn');
    prevBtn.disabled = (idx <= 0);
    nextBtn.disabled = (idx >= APP.navPoints.length - 1);
    prevBtn.onclick = () => { stopDrive(); APP._simMode = false; updateTiltState(); idx > 0 && setTarget(idx - 1); tempDisableAutoCenter(5000); };

    nextBtn.onclick = () => { if (idx < APP.navPoints.length - 1) { stopDrive(); APP._simMode = false; updateTiltState(); setTarget(idx + 1); tempDisableAutoCenter(5000); } };
    prevBtn.innerHTML = `<svg class="arrow-icon" viewBox="0 0 24 24" width="18" height="18"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>`;
    nextBtn.innerHTML = `<svg class="arrow-icon" viewBox="0 0 24 24" width="18" height="18"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>`;

    const playBtn = $('playBtn');
    if (playBtn) {
        const hasPath = t && t.pts && t.pts.length >= 2;
        playBtn.disabled = !hasPath;
    }

    $('commentText').textContent = t.comm || '';
    const hasComm = t.comm && t.comm.trim() !== '';
    $('commentText').style.display = hasComm && APP._commentEnabled ? 'block' : 'none';
    $('commentText').style.opacity = (t.comm && APP._audioCache.has(t.comm)) ? '1' : '0.35';

    // Панель предыдущей команды — та же вёрстка над основной, полупрозрачная
    const prevHeader = $('hudPrevHeader');
    const prev = idx > 0 ? APP.navPoints[idx - 1] : null;
    if (prevHeader) {
        if (!prev) {
            prevHeader.style.display = 'none';
        } else {
            prevHeader.style.display = '';
            $('hudPrevCmdNum').innerHTML = `<svg width="44" height="44" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="${prev.hex}" opacity="0.3"/><circle cx="10" cy="10" r="9" fill="none" stroke="${prev.hex}" stroke-width="1.5"/><text x="10" y="10.5" font-size="8" font-family="Arial" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="#fff">${escapeHtml(prev.id)}</text></svg>`;
            $('hudPrevCmdTextInner').textContent = prev.cmd;
            $('hudPrevCmdTextInner').style.opacity = APP._audioCache.has(prev.cmd) ? '1' : '0.35';
            $('hudPrevCmdNum').onclick = (e) => {
                e.stopPropagation();
                const el = $('hudPrevCmdNum');
                document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing'));
                APP._commentAudio.onended = null;
                el.classList.add('playing');
                playPointAudio(prev, () => el.classList.remove('playing'));
            };
            $('hudPrevCmd').onclick = openPointsList;
            $('prevCommentText').textContent = prev.comm || '';
            const hasPrevComm = prev.comm && prev.comm.trim() !== '';
            $('prevCommentText').style.display = hasPrevComm && APP._commentEnabled ? 'block' : 'none';
            $('prevCommentText').style.opacity = (prev.comm && APP._audioCache.has(prev.comm)) ? '1' : '0.35';
        }
    }
}

function formatDistance(d) {
    if (d >= 1000) {
        const v = (d / 1000).toFixed(1);
        return `${v}<span class="dist-unit">км</span>`;
    }
    return `${Math.round(d)}<span class="dist-unit">м</span>`;
}

function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function openPointsList() {
    if (!$('pointsListModal').classList.contains('hidden')) { closePointsList(); return; }
    closeAllSheets();
    const wrap = $('pointsListWrap');
    if (!wrap || APP.navPoints.length === 0) return;
    wrap.innerHTML = APP.navPoints.map((p, i) => {
        const isCurrent = i === APP.navCurrentIndex;
        const isPrev = i < APP.navCurrentIndex;
        const dist = isCurrent && APP.lastPos && p.pts && p.pts[0]
            ? formatDistance(getGeoDistance(APP.lastPos, [p.pts[0][0], p.pts[0][1]]))
            : '';
        const cls = `pl-item${isCurrent ? ' pl-active' : ''}${isPrev ? ' pl-prev' : ''}`;
        const activeStyle = isCurrent ? ` style="border-color:#00FF00;border-width:2px"` : '';
        return `<div class="${cls}" data-idx="${i}">
            <div class="pl-item-row"${activeStyle}>
                <div class="pl-item-row-main">
                    <div class="pl-item-icon" data-play="${i}"><svg width="44" height="44" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="${p.hex}" opacity="0.3"/><circle cx="10" cy="10" r="9" fill="none" stroke="${p.hex}" stroke-width="1.5"/><text x="10" y="10.5" font-size="8" font-family="Arial" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="#fff">${escapeHtml(p.id)}</text></svg></div>
                    <div class="pl-item-text">${escapeHtml(p.cmd)}</div>
                    ${dist ? `<div class="pl-item-dist">${dist}</div>` : ''}
                </div>
                ${p.comm && p.comm.trim() ? `<div class="pl-comment">${escapeHtml(p.comm)}</div>` : ''}
            </div>
        </div>`;
    }).join('');
    $('pointsListModal').classList.remove('hidden');
    requestAnimationFrame(() => {
        const active = wrap.querySelector('.pl-active');
        if (active) active.scrollIntoView({ block: 'center', behavior: 'auto' });
    });
}

function closePointsList() {
    hideSheetModal('pointsListModal', 'pointsListSheet');
}

function updateHudDist(d, ad) {
    $('hudCmdDist').innerHTML = formatDistance(d);
    $('hudCmdDist').classList.toggle('in-range', d < 50 && ad <= APP.navConfig.AZ_TOLERANCE);
    updatePointsListDist();
}

function updatePointsListDist() {
    const modal = $('pointsListModal');
    if (!modal || modal.classList.contains('hidden')) return;
    const activeItem = modal.querySelector('.pl-active');
    if (!activeItem || !APP.lastPos || APP.navCurrentIndex < 0) return;
    const t = APP.navPoints[APP.navCurrentIndex];
    if (!t) return;
    const d = getGeoDistance(APP.lastPos, [t.lat, t.lon]);
    const distEl = activeItem.querySelector('.pl-item-dist');
    if (distEl) distEl.innerHTML = formatDistance(d);
}



function setTarget(i) {
    APP.navCurrentIndex = i;
    renderRoutePoints();
    updateHud();
    fitMapToCurrentTarget();
    updatePointsListActive();
}

function updatePointsListActive() {
    const modal = $('pointsListModal');
    if (!modal || modal.classList.contains('hidden')) return;
    modal.querySelectorAll('.pl-item').forEach(el => {
        const idx = parseInt(el.dataset.idx);
        const isCurrent = idx === APP.navCurrentIndex;
        el.classList.toggle('pl-active', isCurrent);
        el.classList.toggle('pl-prev', idx < APP.navCurrentIndex);

        const row = el.querySelector('.pl-item-row');
        if (row) row.style.cssText = isCurrent ? 'border-color:#00FF00;border-width:2px' : '';

        const pt = APP.navPoints[idx];
        let distEl = el.querySelector('.pl-item-dist');
        if (isCurrent && APP.lastPos && pt && pt.pts && pt.pts[0]) {
            const distText = formatDistance(getGeoDistance(APP.lastPos, [pt.pts[0][0], pt.pts[0][1]]));
            if (distEl) {
                distEl.innerHTML = distText;
            } else {
                const main = el.querySelector('.pl-item-row-main');
                if (main) {
                    distEl = document.createElement('div');
                    distEl.className = 'pl-item-dist';
                    distEl.innerHTML = distText;
                    main.appendChild(distEl);
                }
            }
        } else if (distEl) {
            distEl.remove();
        }
    });
    const active = modal.querySelector('.pl-active');
    if (active) active.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function fitMapToCurrentTarget() {
    const p = APP.navPoints[APP.navCurrentIndex];
    if (!p || !p.pts || p.pts.length < 1 || !APP.map) return;
    let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
    for (const pt of p.pts) {
        const lat = pt[0], lon = pt[1];
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
    }
    if (minLat === Infinity) return;
    APP.map.fitBounds([[minLon, minLat], [maxLon, maxLat]], { padding: 40, maxZoom: 19, duration: 400 });
}


async function playCommand(text) {
    if (!text || !text.trim()) return;
    APP._commentAudio.pause();
    APP.navAudio.onended = null;
    APP.navAudio.pause();
    await playTTS(text);
}

async function playTTS(text, voice_type = 'command') {
    APP._audioPending++;
    try {
        APP.navAudio.pause();
        const cached = APP._audioCache.get(text);
        if (cached) {
            APP.navAudio.src = cached;
            await APP.navAudio.play().catch(() => {});
            return;
        }
        try {
            const resp = await fetch(TTS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ batches: [{ voice_type, texts: [text] }] })
            });
            const data = await resp.json();
            if (data.audios && data.audios[text]) {
                const binaryStr = atob(data.audios[text]);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
                const blob = new Blob([bytes], { type: 'audio/mp3' });
                const url = URL.createObjectURL(blob);
                APP._audioCache.set(text, url);
                updateHud();
                APP.navAudio.src = url;
                await APP.navAudio.play().catch(() => {});
            }
        } catch (e) {
            console.warn('TTS error:', e);
        }
    } finally {
        APP._audioPending--;
    }
}

async function playComment(text) {
    if (!text || !text.trim()) return;
    if (!APP._commentEnabled) return;
    APP.navAudio.pause();
    APP._commentAudio.pause();
    const saved = APP.navAudio;
    APP.navAudio = APP._commentAudio;
    try {
        await playTTS(text, 'comment');
    } finally {
        APP.navAudio = saved;
    }
}

function playPointAudio(point, onDone) {
    if (!point) { if (onDone) onDone(); return; }
    let finished = false;
    const finish = () => { if (finished) return; finished = true; if (onDone) onDone(); };

    playCommand(point.cmd).then(() => {
        APP._commentAudio.onended = null;

        const afterCommand = () => {
            APP.navAudio.onended = null;
            if (point.comm && point.comm.trim() && APP._commentEnabled) {
                APP._commentAudio.onended = () => {
                    APP._commentAudio.onended = null;
                    finish();
                };
                playComment(point.comm).then(() => {
                    // Если комментарий не зазвучал — не ждём onended
                    if (APP._commentAudio.paused || !APP._commentAudio.src) {
                        APP._commentAudio.onended = null;
                        finish();
                    }
                }).catch(finish);
            } else {
                finish();
            }
        };

        // Если команда не зазвучала (нет TTS / автоплей заблокирован) —
        // не ждём onended, иначе симуляция/подсветка зависнут навсегда.
        if (APP.navAudio.paused || !APP.navAudio.src) afterCommand();
        else APP.navAudio.onended = afterCommand;
    }).catch(finish);
}

function navCheckTriggers() {
    if (APP.navCurrentIndex < 0 || !APP.lastPos || !APP.navPoints[APP.navCurrentIndex]) return;
    const t = APP.navPoints[APP.navCurrentIndex];
    const d = getGeoDistance(APP.lastPos, [t.lat, t.lon]);
    let ad = Math.abs(APP.rawAz - t.az) % 360;
    if (ad > 180) ad = 360 - ad;
    updateHudDist(d, ad);

    if (d <= APP.navConfig.TRIGGER_DIST && ad <= APP.navConfig.AZ_TOLERANCE) {
        const mySeq = ++APP._navSeq;
        playCommand(t.cmd).then(() => {
            if (mySeq !== APP._navSeq) return;
            if (t.comm && t.comm.trim()) {
                APP.navAudio.onended = () => {
                    APP.navAudio.onended = null;
                    if (mySeq !== APP._navSeq) return;
                    playComment(t.comm);
                };
            }
        });
        APP.navCurrentIndex++;
        if (APP.navCurrentIndex < APP.navPoints.length) {
            renderRoutePoints();
            updateHud();
            updatePointsListActive();
        } else {
            showToast('Маршрут завершён!', 'success');
            updateHud();
        }
    }
}

async function loadRouteFromJSON(data) {
    await processRouteData(data);
}

async function processRouteData(data) {
    startWakeLock();
    APP._simFirstRun = true;
    if (!data || !Array.isArray(data)) throw new Error('Неверный формат данных: ожидается массив');
    if (data.length === 0) throw new Error('Маршрут пуст');

    APP.navPoints = data.map((d, i) => {
        const pts = d.pts || [];
        if (!pts || pts.length === 0) return null;
        return {
            id: d.id || (i + 1), lat: pts[0]?.[0], lon: pts[0]?.[1],
            hex: COLORS[d.color]?.hex || '#007AFF',
            cmd: (d.cmd || d.comm || `Т${i + 1}`).trim(),
            comm: d.comm || '', pts: pts,
            az: pts.length >= 2 ? calcAzimuth(pts[0], pts[1]) : 0
        };
    }).filter(p => p !== null);

    if (APP.navPoints.length === 0) throw new Error('Нет валидных точек в маршруте');

    let totalDist = 0;
    for (const p of APP.navPoints) {
        if (p.pts && p.pts.length >= 2) {
            for (let i = 1; i < p.pts.length; i++) {
                totalDist += getGeoDistance(p.pts[i-1], p.pts[i]);
            }
        }
    }
    APP._routeTotalDistance = totalDist;

    APP.navCurrentIndex = 0;

    $('hud').classList.add('active');
    const jsonModal = $('jsonModal');
    if (jsonModal) jsonModal.classList.add('hidden');
    $('loading').classList.add('hidden');

    renderRoutePoints();
    updateHud();

    if (APP.navPoints.length > 0 && APP.map) {
        setTimeout(() => {
            let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
            for (const p of APP.navPoints) {
                if (!p.pts) continue;
                for (const pt of p.pts) {
                    const lat = pt[0], lon = pt[1];
                    if (lat < minLat) minLat = lat;
                    if (lat > maxLat) maxLat = lat;
                    if (lon < minLon) minLon = lon;
                    if (lon > maxLon) maxLon = lon;
                }
            }
            if (minLat !== Infinity) {
                APP.map.fitBounds([[minLon, minLat], [maxLon, maxLat]], { padding: 40, maxZoom: 19, duration: 400 });
            }
        }, 100);
    }
    await precacheRouteAudio(data);
    updateRouteNameDisplay();
}

async function precacheRouteAudio(data) {
    const cmdTexts = [...new Set(data.map(d => d.cmd).filter(t => t && t.trim()))];
    const commTexts = [...new Set(data.map(d => d.comm).filter(t => t && t.trim()))];
    cmdTexts.push(APP.navConfig.SHOCK_PHRASE || 'Сильный удар');
    cmdTexts.push(APP.navConfig.SPEED_ALERT_PHRASE || 'Превышена максимальная скорость');
    const uncachedCmd = cmdTexts.filter(t => !APP._audioCache.has(t));
    const uncachedComm = commTexts.filter(t => !APP._audioCache.has(t));
    if (uncachedCmd.length + uncachedComm.length === 0) return;
    try {
        const resp = await fetch(TTS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                batches: [
                    { voice_type: 'command', texts: uncachedCmd },
                    { voice_type: 'comment', texts: uncachedComm },
                ]
            })
        });
        const result = await resp.json();
        if (result.audios) {
            for (const [text, b64] of Object.entries(result.audios)) {
                const binaryStr = atob(b64);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
                const blob = new Blob([bytes], { type: 'audio/mp3' });
                APP._audioCache.set(text, URL.createObjectURL(blob));
            }
        }
    } catch (e) {
        console.warn('Precache error:', e);
    }
    updateHud();
}

let _wakeLock = null, wakeLockInterval = null, wakeCanvas = null, wakeCanvasStream = null;
const wakeVideo = document.getElementById('wakeLockVideo');

async function requestWakeLock() {
    if (!navigator.wakeLock || !navigator.wakeLock.request) return;
    try {
        const lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => {
            _wakeLock = null;
            if (document.visibilityState === 'visible') startWakeLock();
        });
        _wakeLock = lock;
        stopCanvasWakeLock();
    } catch (e) {
        startCanvasWakeLock();
    }
}

function startCanvasWakeLock() {
    if (_wakeLock) return;
    if (!wakeCanvas) {
        wakeCanvas = document.createElement('canvas');
        wakeCanvas.width = 1; wakeCanvas.height = 1;
        const ctx = wakeCanvas.getContext('2d');
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1, 1);
        if (wakeCanvas.captureStream) wakeCanvasStream = wakeCanvas.captureStream(30);
        else if (wakeCanvas.mozCaptureStream) wakeCanvasStream = wakeCanvas.mozCaptureStream(30);
    }
    if (wakeVideo && wakeCanvasStream) {
        wakeVideo.srcObject = wakeCanvasStream;
        wakeVideo.play().catch(() => {});
    }
    if (wakeLockInterval) clearInterval(wakeLockInterval);
    wakeLockInterval = setInterval(() => {
        if (wakeVideo && wakeVideo.paused) wakeVideo.play().catch(() => {});
        if (wakeCanvas) {
            const ctx = wakeCanvas.getContext('2d');
            ctx.fillStyle = '#' + Math.floor(Math.random()*16777215).toString(16);
            ctx.fillRect(0, 0, 1, 1);
        }
    }, 15000);
}

function stopCanvasWakeLock() {
    if (wakeLockInterval) {
        clearInterval(wakeLockInterval);
        wakeLockInterval = null;
    }
    if (wakeVideo) {
        wakeVideo.pause();
        wakeVideo.srcObject = null;
    }
}

function startWakeLock() {
    requestWakeLock();
}

// iOS — запрос по первому клику (требуется жест пользователя)
document.addEventListener('click', async () => {
    if (!_wakeLock) await requestWakeLock();
}, { once: true });

// Перезахват после выключения/включения экрана
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !_wakeLock) requestWakeLock();
});

function openInstruction() {
    closePointsList();
    closeSettings();
    if (typeof MenuModule !== 'undefined') MenuModule.hide();
    const modal = $('instructionModal');
    const body = $('instructionBody');
    if (!modal || !body) return;
    modal.classList.remove('hidden');
    if (!body.dataset.loaded) {
        const embeddedInstruction = $('embeddedInstruction');
        if (embeddedInstruction) {
            body.innerHTML = embeddedInstruction.innerHTML;
            body.dataset.loaded = '1';
            return;
        }
        fetch('instr.html', { cache: 'no-cache' })
            .then(r => r.text())
            .then(html => {
                const doc = new DOMParser().parseFromString(html, 'text/html');
                body.innerHTML = doc.body.innerHTML;
                body.dataset.loaded = '1';
            })
            .catch(() => { body.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,100,100,0.8);">Ошибка загрузки инструкции</div>'; });
    }
}

function closeInstruction() {
    hideSheetModal('instructionModal', 'instructionSheet');
}

document.addEventListener('click', e => {
    const btn = $('instructionBtn');
    if (btn && btn.contains(e.target)) openInstruction();
});

// Кнопка инструкции скрывается после первого клика в любом месте,
// кроме самой этой кнопки. Capture нужен, чтобы срабатывало даже если
// другой обработчик остановит всплытие.
document.addEventListener('click', e => {
    const btn = $('instructionBtn');
    if (!btn || btn.classList.contains('is-hidden')) return;
    if (btn.contains(e.target)) return;
    btn.classList.add('is-hidden');
}, true);

document.addEventListener('DOMContentLoaded', () => {
    setTimeout(startWakeLock, 500);
});

if (typeof maplibregl === 'undefined' || typeof MAPTILER_KEY === 'undefined' || !MAPTILER_KEY) {
    showToast('Ошибка загрузки карты (MapLibre/MapTiler)', 'error', 8000);
    $('loading').classList.add('hidden');
} else {
(async () => {
    let initCenter = [43.9968, 56.3269];
    if (navigator.geolocation) {
        try {
            const pos = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 });
            });
            initCenter = [pos.coords.longitude, pos.coords.latitude];
        } catch (e) {}
    }

    registerYandexProtocol();
    APP.map = new maplibregl.Map({
        container: 'map',
        style: maptilerStyleUrl(APP._mapStyle),
        center: [initCenter[0], initCenter[1]],
        zoom: 17,
        minZoom: 3,
        maxZoom: 20,
        attributionControl: { compact: true },
        dragRotate: true,
        pitchWithRotate: true,
        touchPitch: true
    });

    APP.map.once('load', restoreRouteLayers);
    APP.map.on('styledata', restoreRouteLayers);
    APP.map.on('idle', restoreRouteLayers);

    APP.map.on('error', (e) => {
        if (APP._mapErrorShown) return;
        const msg = e && e.error ? String(e.error.message || '') : '';
        if (/key|401|403|failed to fetch|load/i.test(msg)) {
            APP._mapErrorShown = true;
            showToast('Ошибка карты: проверьте ключ MapTiler', 'error', 6000);
        }
    });

    const userEl = document.createElement('div');
    userEl.style.cssText = 'width:40px;height:40px;cursor:pointer;';
    userEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><g id="user-arrow"><path d="M20,4 L32,34 L20,28 L8,34 Z" fill="#FF3B30" stroke="white" stroke-width="2"/></g></svg>';
    APP._userMarkerEl = userEl;
    APP.userMarker = new MapMarker({ coordinates: [0, 0] }, userEl);
    mapAddChild(APP.userMarker);

    const driveEl = document.createElement('div');
    driveEl.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="#FF3B30" stroke="#fff" stroke-width="2.5"/></svg>';
    // Явные размеры обязательны: MapLibre центрирует маркер через
    // translate(-50%,-50%) от размера элемента. Без width/height div
    // растягивался на всю ширину карты, и точка уезжала в левый край.
    driveEl.style.cssText = 'display:none;position:absolute;width:18px;height:18px;z-index:9999;';
    APP._driveMarker = new MapMarker({ coordinates: [0, 0] }, driveEl);
    mapAddChild(APP._driveMarker);

    initGeolocation();

    APP._is3D = false;

    const speedometer = $('telemetryPanel');
    let editorHoldTimer = null;
    let editorHoldPointerId = null;
    let editorHoldStart = null;
    const cancelEditorHold = (event) => {
        if (event && editorHoldPointerId !== null && event.pointerId !== editorHoldPointerId) return;
        clearTimeout(editorHoldTimer);
        editorHoldTimer = null;
        editorHoldPointerId = null;
        editorHoldStart = null;
    };
    speedometer.addEventListener('pointerdown', (event) => {
        if (event.button !== undefined && event.button !== 0) return;
        cancelEditorHold();
        editorHoldPointerId = event.pointerId;
        editorHoldStart = { x: event.clientX, y: event.clientY };
        editorHoldTimer = setTimeout(() => {
            window.location.href = new URL('editor.html', window.location.href).href;
        }, 800);
    });
    document.addEventListener('pointerup', cancelEditorHold);
    document.addEventListener('pointercancel', cancelEditorHold);
    document.addEventListener('pointermove', (event) => {
        if (!editorHoldStart || event.pointerId !== editorHoldPointerId) return;
        if (Math.hypot(event.clientX - editorHoldStart.x, event.clientY - editorHoldStart.y) > 12) {
            cancelEditorHold(event);
        }
    });
    speedometer.addEventListener('contextmenu', (event) => event.preventDefault());
    $('locateBtn').addEventListener('click', toggleAutoCenter);

    $('settingsBtn').addEventListener('click', openSettings);
    $('playBtn').addEventListener('click', () => {
        if (APP._driveActive) {
            pauseDrive();
            return;
        }
        if ((!APP.navAudio.paused && APP.navAudio.currentTime > 0) ||
            (!APP._commentAudio.paused && APP._commentAudio.currentTime > 0)) {
            stopDrive();
            APP._simMode = false;
            updateTiltState();
            return;
        }
        const idx = APP.navCurrentIndex;
        if (APP._driveResume && APP._driveResume.idx === idx) {
            disableAutoCenter();
            APP._simMode = true;
            APP._simForceZoom = false;
            updateTiltState();
            APP._driveShowFrom = idx;
            renderRoutePoints();
            driveAlongPath(idx);
            return;
        }
        const p = APP.navPoints[idx];
        if (!p || !p.pts || p.pts.length < 2) {
            showToast('У текущей точки нет пути для симуляции', 'info');
            return;
        }
        disableAutoCenter();
        APP._simMode = true;
        updateTiltState();
        APP._simForceZoom = APP._simFirstRun;
        if (APP._simFirstRun) {
            APP._simFirstRun = false;
            const from = p.pts[0], to = p.pts[1];
            const dLon = (to[1] - from[1]) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(to[0] * Math.PI / 180);
            const x = Math.cos(from[0] * Math.PI / 180) * Math.sin(to[0] * Math.PI / 180) -
                      Math.sin(from[0] * Math.PI / 180) * Math.cos(to[0] * Math.PI / 180) * Math.cos(dLon);
            const bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
            setMapLocation(from, 19, bearing, 2000);
        }
        APP.navCurrentIndex = idx;
        APP._driveShowFrom = idx;
        renderRoutePoints();
        $('playBtn').classList.add('active');
        $('playBtn').innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
        const startSimAfterAudio = () => {
            if (APP._driveShowFrom >= 0 && !APP._driveActive) driveAlongPath(idx);
        };
        const doPlay = () => playPointAudio(p, startSimAfterAudio);
        APP._simForceZoom ? setTimeout(doPlay, 2000) : doPlay();
    });

    document.getElementById('map').addEventListener('click', () => {
        stopDrive();
        APP._simMode = false;
        updateTiltState();
    });

    $('pointsListWrap').addEventListener('click', (e) => {
        const icon = e.target.closest('.pl-item-icon');
        if (icon) {
            const idx = +icon.dataset.play;
            if (!isNaN(idx) && APP.navPoints[idx]) {
                const p = APP.navPoints[idx];
                document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing'));
                APP._commentAudio.onended = null;
                icon.classList.add('playing');
                playPointAudio(p, () => icon.classList.remove('playing'));
            }
            return;
        }
        const item = e.target.closest('.pl-item');
        if (!item) return;
        const idx = +item.dataset.idx;
        if (!isNaN(idx) && idx >= 0 && idx < APP.navPoints.length) {
            closePointsList();
            stopDrive();
            APP._simMode = false;
            updateTiltState();
            setTarget(idx);
            tempDisableAutoCenter(5000);
        }
    });

    // Скрываем оверлей сразу, не дожидаясь загрузки SDK (в браузере блокировки тянутся до ~10с)
    $('loading').classList.add('hidden');
    // Даём SDK короткую фору (1.5с); в TG/VK он приходит мгновенно, в браузере — продолжаем без него
    if (window.platformReady) {
        const grace = new Promise(r => setTimeout(r, 1500));
        try { await Promise.race([window.platformReady, grace]); } catch (e) {}
    }
    MenuModule.init(loadRouteFromJSON);
    ensureMotionTracking();

    document.addEventListener('click', function activateAudio() {
        APP.navAudio.muted = true;
        APP.navAudio.play().catch(() => {});
        APP.navAudio.pause();
        APP.navAudio.muted = false;
    }, { once: true });
})().catch(e => {
    showToast('Ошибка загрузки карты: ' + e.message, 'error', 5000);
    $('loading').classList.add('hidden');
});
}
</script>

<script>
document.addEventListener('click', (e) => {
    const sheetModals = [
        { id: 'navSettingsModal', close: closeSettings, triggers: ['settingsBtn', 'menuBtn'], handle: 'settingsSheetDragArea' },
        { id: 'pointsListModal', close: closePointsList, triggers: ['hudCmd', 'hudPrevCmd', 'menuBtn'], handle: 'sheetDragArea' },
        { id: 'instructionModal', close: closeInstruction, triggers: ['instructionBtn', 'menuBtn'], handle: 'instructionDragArea' },
    ];
    sheetModals.forEach(({ id, close, triggers, handle: handleId }) => {
        const modal = document.getElementById(id);
        if (!modal || modal.classList.contains('hidden')) return;
        const sheet = modal.querySelector('.modal-sheet');
        const isTrigger = triggers.some(tid => {
            const el = document.getElementById(tid);
            return el && (el === e.target || el.contains(e.target));
        });
        const isHandle = handleId && document.getElementById(handleId)?.contains(e.target);
        if (isHandle || (sheet && !sheet.contains(e.target) && !isTrigger)) close();
    });
});

function enableSheetSwipe(sheetId, handleId, closeFn) {
    const sheet = document.getElementById(sheetId);
    const handle = document.getElementById(handleId);
    let startY = 0, currentY = 0, dragging = false;
    if (!sheet || !handle) return;
    const onStart = (e) => { e.preventDefault(); startY = e.clientY; currentY = startY; dragging = false; };
    const onMove = (e) => {
        if (startY === 0) return;
        const dy = e.clientY - startY;
        if (Math.abs(dy) > 5) dragging = true;
        if (!dragging) return;
        currentY = e.clientY;
        sheet.style.transition = 'none';
        if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
    };
    const onEnd = () => {
        if (startY === 0) return;
        if (dragging) {
            sheet.style.transition = '';
            const dy = currentY - startY;
            if (dy > 100) { closeFn(); startY = 0; return; }
            sheet.style.transform = '';
        } else {
            closeFn();
        }
        startY = 0;
    };
    handle.addEventListener('pointerdown', onStart);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onEnd);
    window.addEventListener('pointercancel', onEnd);
}

enableSheetSwipe('navSettingsSheet', 'settingsSheetDragArea', closeSettings);
enableSheetSwipe('pointsListSheet', 'sheetDragArea', closePointsList);
enableSheetSwipe('instructionSheet', 'instructionDragArea', closeInstruction);
</script>
