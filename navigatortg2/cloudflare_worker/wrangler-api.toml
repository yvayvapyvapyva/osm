# Воркер API для navigatortg2 (данные на общей D1 nav-db). TTS остаётся на Yandex — сюда не входит.
# Использование:
#   1. D1 nav-db уже создана и общая с navigatortg (database_id ниже)
#   2. схему обновлять миграциями из cloudflare_worker/migrations/
#   3. wrangler secret put TELEGRAM_TOKEN --config=cloudflare_worker/wrangler-api.toml
#      wrangler secret put ADMIN_IDS --config=cloudflare_worker/wrangler-api.toml  (ID админов бота, через запятую)
#   4. wrangler deploy --config=cloudflare_worker/wrangler-api.toml
#   5. URL из вывода deploy вписать в assets/js/config.js -> API_CONFIG.API_BASE

name = "nav-api-v2"
main = "api.js"
compatibility_date = "2026-01-01"

# Не удалять переменные, заданные не в этом файле (например, из дашборда),
# при деплое. Секретов не касается.
keep_vars = true

# Обычные (не секретные) переменные.
# ВНИМАНИЕ: файл лежит в ПУБЛИЧНОМ репозитории, поэтому секреты
# (TELEGRAM_TOKEN, TG_SECRET и т.п.) здесь хранить нельзя —
# только значения, которые не страшно показать.
[vars]
# Telegram user id админов бота (команды /balance, /stats, /refund), через запятую.
ADMIN_IDS = "7292595756"

# Чат для отчётов из приложения (POST /report).
# "@username" публичного или "-100…" приватного; бот должен быть участником чата.
REPORT_CHAT_ID = "-1003906981409"

# Канал для отчётов о покупках и возвратах: "@username" или "-100…" (приватный).
# Пусто ("") — уведомления не отправляются.
# Значение вписывать ЗДЕСЬ, а не в дашборде: если имя есть в конфиге,
# деплой перезапишет значение из дашборда этим.
PURCHASE_CHANNEL_ID = "-1004446137461"

# Веб-версия: адрес сайта и отправитель писем для входа по email.
# RESEND_API_KEY или binding EMAIL задаются отдельно (wrangler secret).
WEB_APP_URL = "https://avtoinstruktor-web.pages.dev"
WEB_EMAIL_FROM = "navigator@mail.ainstruktor.ru"

[[d1_databases]]
binding = "DB"
database_name = "nav-db"
database_id = "1c336d50-6fbf-4309-8177-c79881020422"
